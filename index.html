<script id="ripple-community-v81">
(function(){
  // Ripple Communities v81: owner/admin management, customizable community
  // profile, category tags, community-only posts, and community-only replies.
  function rcNorm(c){
    c.members=Array.isArray(c.members)?c.members:[];
    c.posts=Array.isArray(c.posts)?c.posts:[];
    c.owner=c.owner||c.creator||c.members[0]||current||'';
    c.admins=Array.isArray(c.admins)?c.admins:[];
    c.type=c.type||'Other';
    c.description=c.description||'';
    c.name=c.name||'Untitled Community';
    c.picture=c.picture||c.avatar||'';
    c.posts.forEach(p=>{p.comments=Array.isArray(p.comments)?p.comments:[];p.user=p.user||p.author||'';p.text=p.text||'';p.created=p.created||Date.now()});
    return c;
  }
  function rcCommunity(id){return (db.communities||[]).map(rcNorm).find(c=>String(c.id)===String(id))}
  function rcCanManage(c){return !!c&&(String(c.owner)===String(current)||c.admins.some(x=>String(x)===String(current)))}
  function rcIsOwner(c){return !!c&&String(c.owner)===String(current)}
  function rcAvatar(c,cls='community-avatar'){
    return c.picture?`<img class="${cls}" src="${esc(c.picture)}" alt="">`:`<div class="${cls}" style="display:grid;place-items:center;font-size:28px">🌊</div>`
  }
  function rcUserAvatar(id,cls='mini-avatar'){
    const u=userBy(id);return u?.avatar?`<img class="${cls}" src="${esc(u.avatar)}" alt="">`:`<div class="${cls}" style="display:grid;place-items:center;font-size:13px">●</div>`
  }
  function rcRole(c,id){return String(c.owner)===String(id)?'OWNER':c.admins.some(x=>String(x)===String(id))?'ADMIN':''}
  function rcCompactImage(file){
    return new Promise(resolve=>{
      if(!file)return resolve('');
      const fr=new FileReader();fr.onload=()=>{
        const img=new Image();img.onload=()=>{
          const max=420,scale=Math.min(1,max/Math.max(img.width,img.height));
          const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
          const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78));
        };img.onerror=()=>resolve('');img.src=fr.result;
      };fr.onerror=()=>resolve('');fr.readAsDataURL(file);
    })
  }
  function rcPersist(){try{save()}catch(e){console.warn('Community save failed',e);toast('Community changes could not be saved locally.')}}

  // Migrate existing communities without breaking the older local format.
  (db.communities||[]).forEach(rcNorm);

  window.openCommunityManage=function(id){
    const c=rcCommunity(id);if(!c)return;
    if(!rcCanManage(c))return toast('Only the owner or an admin can manage this community.');
    const adminRows=c.admins.map(a=>{const u=userBy(a);return `<div class="community-admin-row"><span>${esc(u?.display||a)} <span class="meta">@${esc(u?.username||a)}</span></span><button class="retro-btn danger" onclick="removeCommunityAdmin('${esc(c.id)}','${esc(a)}')">REMOVE</button></div>`}).join('')||'<div class="meta">No admins yet.</div>';
    document.getElementById('rippleCommunityManage')?.remove();
    const wrap=document.createElement('div');wrap.id='rippleCommunityManage';wrap.className='modal';
    wrap.innerHTML=`<div class="window community-modal-window">
      <div class="titlebar">COMMUNITY SETTINGS <button class="retro-btn" style="float:right" onclick="document.getElementById('rippleCommunityManage').remove()">CLOSE</button></div>
      <div class="panel-body">
        <div class="community-manage-grid">
          <div class="card"><h3>PROFILE</h3>
            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
              <div id="rcPicPreview">${rcAvatar(c,'community-picture-preview')}</div>
              <div><input id="rcPicInput" type="file" accept="image/*" class="hidden" onchange="communityPicturePreview(this,'${esc(c.id)}')"><button class="retro-btn" onclick="document.getElementById('rcPicInput').click()">CHANGE PICTURE</button><button class="retro-btn" onclick="clearCommunityPicture('${esc(c.id)}')">REMOVE</button></div>
            </div>
            <label>NAME</label><input id="rcName" value="${esc(c.name)}" maxlength="50">
            <label>DESCRIPTION</label><textarea id="rcDesc" rows="4" maxlength="240">${esc(c.description)}</textarea>
            <label>CATEGORY / TAG</label><select id="rcType">${communityTypes().slice(1).map(t=>`<option ${t===c.type?'selected':''}>${esc(t)}</option>`).join('')}</select>
            <button class="retro-btn" style="margin-top:8px" onclick="saveCommunitySettings('${esc(c.id)}')">SAVE PROFILE</button>
          </div>
          <div class="card"><h3>ADMINS</h3>
            ${rcIsOwner(c)?`<p class="meta">Add someone who is already a member. Admins can co-manage the community and moderate its posts/replies.</p><div style="display:flex;gap:6px"><input id="rcAdminUsername" placeholder="username"><button class="retro-btn" onclick="addCommunityAdmin('${esc(c.id)}')">ADD ADMIN</button></div>`:`<p class="meta">You are an admin. The owner controls who becomes an admin.</p>`}
            <div style="margin-top:10px">${adminRows}</div>
          </div>
        </div>
        <div class="notice" style="margin-top:10px"><b>${rcIsOwner(c)?'OWNER':'ADMIN'}</b> · ${rcIsOwner(c)?'You have full control of this community.':'You can co-manage and moderate this community.'}</div>
      </div>
    </div>`;
    document.body.appendChild(wrap);
  };
  window.communityPicturePreview=async function(input,id){
    const file=input.files?.[0];if(!file)return;
    const data=await rcCompactImage(file);if(!data)return toast('That image could not be loaded.');
    const c=rcCommunity(id);if(!c)return;
    c._pendingPicture=data;$('#rcPicPreview').innerHTML=rcAvatar({...c,picture:data},'community-picture-preview');
  };
  window.clearCommunityPicture=function(id){const c=rcCommunity(id);if(!c)return;c.picture='';c._pendingPicture='';rcPersist();openCommunityManage(id);toast('Community picture removed.')};
  window.saveCommunitySettings=function(id){
    const c=rcCommunity(id);if(!c||!rcCanManage(c))return;
    const name=$('#rcName')?.value.trim();if(!name)return toast('Community name cannot be empty.');
    c.name=name;c.description=$('#rcDesc')?.value.trim()||'';c.type=$('#rcType')?.value||'Other';
    if(c._pendingPicture!==undefined){c.picture=c._pendingPicture;delete c._pendingPicture}
    rcPersist();document.getElementById('rippleCommunityManage')?.remove();viewCommunity(id);toast('Community profile updated.');
  };
  window.addCommunityAdmin=function(id){
    const c=rcCommunity(id);if(!rcIsOwner(c))return toast('Only the owner can add admins.');
    const raw=$('#rcAdminUsername')?.value.trim().replace(/^@/,'');if(!raw)return;
    const target=Object.values(db.users||{}).find(u=>String(u.username||'').toLowerCase()===raw.toLowerCase());
    if(!target)return toast('That user could not be found.');
    if(!c.members.some(x=>String(x)===String(target.id)))return toast('They must join the community before becoming an admin.');
    if(String(target.id)===String(c.owner))return toast('The owner already has full permissions.');
    if(!c.admins.some(x=>String(x)===String(target.id)))c.admins.push(target.id);
    rcPersist();openCommunityManage(id);toast(`${target.display||target.username} is now an admin.`);
  };
  window.removeCommunityAdmin=function(id,userId){
    const c=rcCommunity(id);if(!rcIsOwner(c))return toast('Only the owner can remove admins.');
    c.admins=c.admins.filter(x=>String(x)!==String(userId));rcPersist();openCommunityManage(id);toast('Admin removed.');
  };
  window.deleteCommunityPost=function(cid,pid){
    const c=rcCommunity(cid);if(!rcCanManage(c))return toast('You do not have permission to moderate this community.');
    if(!confirm('Delete this community post and its replies?'))return;
    c.posts=c.posts.filter(p=>String(p.id)!==String(pid));rcPersist();viewCommunity(cid);toast('Community post deleted.');
  };
  window.communityReply=function(cid,pid){
    const c=rcCommunity(cid),p=c?.posts.find(x=>String(x.id)===String(pid));if(!c||!p)return;
    const t=prompt('Reply to this community post?');if(!t?.trim())return;
    p.comments=Array.isArray(p.comments)?p.comments:[];p.comments.push({id:uid('cr'),user:current,text:t.trim(),created:Date.now()});rcPersist();viewCommunity(cid);
  };

  // Replace the older Communities UI with the richer version.
  // Community creation uses the same visual editor model as Community Settings — no prompt() chains.
  window.createCommunity=function(){
    document.getElementById('rippleCommunityCreate')?.remove();
    const wrap=document.createElement('div');wrap.id='rippleCommunityCreate';wrap.className='modal';
    const types=communityTypes().slice(1);
    wrap.innerHTML=`<div class="window community-modal-window">
      <div class="titlebar">CREATE COMMUNITY <button class="retro-btn" style="float:right" onclick="document.getElementById('rippleCommunityCreate').remove()">CLOSE</button></div>
      <div class="panel-body">
        <div class="community-manage-grid">
          <div class="card"><h3>COMMUNITY PROFILE</h3>
            <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
              <div id="rccPicPreview"><div class="community-picture-preview" style="display:grid;place-items:center;font-size:28px">🌊</div></div>
              <div><input id="rccPicInput" type="file" accept="image/*" class="hidden"><button class="retro-btn" type="button" onclick="document.getElementById('rccPicInput').click()">CHOOSE PICTURE</button><button class="retro-btn" type="button" onclick="clearCreateCommunityPicture()">REMOVE</button></div>
            </div>
            <label>NAME</label><input id="rccName" maxlength="50" placeholder="Community name" autocomplete="off">
            <label>DESCRIPTION</label><textarea id="rccDesc" rows="4" maxlength="240" placeholder="What is this community about?"></textarea>
            <label>CATEGORY / TAG</label><select id="rccType">${types.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
          </div>
          <div class="card"><h3>PREVIEW</h3>
            <div id="rccLivePreview" class="community-card" style="margin:0">
              <div class="community-card-top"><div id="rccLiveAvatar"><div class="community-avatar" style="display:grid;place-items:center;font-size:28px">🌊</div></div><div class="community-card-copy"><div id="rccLiveType" class="community-type">${esc(types[0]||'Other')}</div><h2 id="rccLiveName" style="margin:3px 0">Your Community</h2></div></div>
              <p id="rccLiveDesc">Your community description will appear here.</p>
              <div class="meta">1 member · OWNER</div>
            </div>
          </div>
        </div>
        <div class="notice" style="margin-top:10px"><b>OWNER</b> · You will automatically become the owner. You can add admins after creating the community.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="retro-btn" type="button" onclick="document.getElementById('rippleCommunityCreate').remove()">CANCEL</button><button class="retro-btn" type="button" onclick="finishCreateCommunity()">CREATE COMMUNITY</button></div>
      </div>
    </div>`;
    document.body.appendChild(wrap);
    const update=()=>{
      const name=$('#rccName')?.value.trim()||'Your Community',desc=$('#rccDesc')?.value.trim()||'Your community description will appear here.',type=$('#rccType')?.value||'Other';
      $('#rccLiveName').textContent=name;$('#rccLiveDesc').textContent=desc;$('#rccLiveType').textContent=type;
    };
    $('#rccName')?.addEventListener('input',update);$('#rccDesc')?.addEventListener('input',update);$('#rccType')?.addEventListener('change',update);
    $('#rccPicInput')?.addEventListener('change',async function(){
      const file=this.files?.[0];if(!file)return;const data=await rcCompactImage(file);if(!data)return toast('That image could not be loaded.');
      window._rippleCreateCommunityPicture=data;$('#rccPicPreview').innerHTML=rcAvatar({picture:data},'community-picture-preview');$('#rccLiveAvatar').innerHTML=rcAvatar({picture:data},'community-avatar');
    });
    update();
  };
  window.clearCreateCommunityPicture=function(){window._rippleCreateCommunityPicture='';$('#rccPicInput').val('');$('#rccPicPreview').innerHTML='<div class="community-picture-preview" style="display:grid;place-items:center;font-size:28px">🌊</div>';$('#rccLiveAvatar').innerHTML='<div class="community-avatar" style="display:grid;place-items:center;font-size:28px">🌊</div>'};
  window.finishCreateCommunity=function(){
    const name=$('#rccName')?.value.trim();if(!name)return toast('Community name cannot be empty.');
    const description=$('#rccDesc')?.value.trim()||'',type=$('#rccType')?.value||'Other';
    const c={id:uid('com'),name,description,type,members:[current],owner:current,admins:[],picture:window._rippleCreateCommunityPicture||'',posts:[],created:Date.now()};
    db.communities.push(c);window._rippleCreateCommunityPicture='';rcPersist();document.getElementById('rippleCommunityCreate')?.remove();communities();toast('Community created. You are the owner.');
  };
  window.communities=function(){
    let cs=(db.communities||[]).map(rcNorm),filter=state.communityFilter||'All';
    let shown=cs.filter(c=>filter==='All'||c.type===filter),mine=cs.filter(c=>c.members.some(x=>String(x)===String(current)));
    $('#view').innerHTML=`<div class="window communities-window"><div class="titlebar">COMMUNITIES</div><div class="panel-body">
      <div class="community-intro"><div><h2 style="margin:0">Find your people.</h2><p>Join communities, make posts, and talk inside each community.</p></div><button class="retro-btn" onclick="createCommunity()">＋ CREATE COMMUNITY</button></div>
      <div class="community-filters">${communityTypes().map(t=>`<button class="retro-btn ${filter===t?'active-filter':''}" onclick="state.communityFilter='${esc(t)}';communities()">${esc(t)}</button>`).join('')}</div></div>
      <div class="community-grid">${shown.length?shown.map(c=>`<div class="card community-card"><div class="community-card-top">${rcAvatar(c)}<div class="community-card-copy"><div class="community-type">${esc(c.type||'Other')}</div><h2 style="margin:3px 0">${esc(c.name)}</h2></div></div><p>${esc(c.description)}</p><div class="meta">${c.members.length} members${rcIsOwner(c)?' · OWNER':''}${c.admins.includes(current)?' · ADMIN':''}</div><button class="retro-btn" onclick="viewCommunity('${esc(c.id)}')">${c.members.includes(current)?'OPEN':'JOIN'}</button></div>`).join(''):`<div class="empty">No communities in this category yet.</div>`}</div>
      <div class="panel-body"><h3>Your communities (${mine.length})</h3><div class="community-mini-list">${mine.map(c=>`<button class="link" onclick="viewCommunity('${esc(c.id)}')">🌊 ${esc(c.name)} <span class="meta">(${esc(c.type||'Other')})</span></button>`).join('')||'<span class="meta">Join a community to see it here.</span>'}</div></div>
    </div>`;
  };
  window.viewCommunity=function(id){
    const c=rcCommunity(id);if(!c)return;
    const wasMember=c.members.some(x=>String(x)===String(current));
    if(!wasMember){c.members.push(current);rcPersist();toast('Joined community.');}
    const manage=rcCanManage(c),owner=rcIsOwner(c);
    $('#view').innerHTML=`<div class="window"><div class="titlebar">${esc(c.name)} <span class="community-type">${esc(c.type)}</span></div>
      <div class="panel-body"><div class="community-profile-head">${rcAvatar(c,'community-hero-avatar')}<div class="community-profile-copy"><h2 style="margin:0">${esc(c.name)}</h2><p style="margin:5px 0">${esc(c.description)}</p><div class="meta">${c.members.length} members · ${owner?'OWNER':c.admins.includes(current)?'ADMIN':'MEMBER'}</div></div><div class="community-profile-actions">${!owner?`<button class="retro-btn" onclick="leaveCommunity('${esc(id)}')">LEAVE</button>`:''}<button class="retro-btn" onclick="communityPost('${esc(id)}')">NEW POST</button>${manage?`<button class="retro-btn" onclick="openCommunityManage('${esc(id)}')">COMMUNITY SETTINGS</button>`:''}<button class="retro-btn" onclick="communities()">ALL COMMUNITIES</button></div></div></div>
      ${c.posts.map(p=>`<div class="card community-post"><div class="community-post-head">${rcUserAvatar(p.user)}<div><b>${esc(userBy(p.user)?.display||p.user)}</b>${rcRole(c,p.user)?`<span class="community-role">${rcRole(c,p.user)}</span>`:''}<div class="meta">${time(p.created)}</div></div></div><p>${esc(p.text)}</p><div><button class="retro-btn" onclick="communityReply('${esc(c.id)}','${esc(p.id)}')">REPLY</button>${manage?` <button class="retro-btn danger" onclick="deleteCommunityPost('${esc(c.id)}','${esc(p.id)}')">DELETE</button>`:''}</div>${p.comments.length?`<div class="community-replies">${p.comments.map(r=>`<div class="community-reply"><b>${esc(userBy(r.user)?.display||r.user)}</b>${rcRole(c,r.user)?` <span class="community-role">${rcRole(c,r.user)}</span>`:''} <span class="meta">${time(r.created)}</span><div>${esc(r.text)}</div></div>`).join('')}</div>`:''}</div>`).join('')||'<div class="empty">No community posts yet. Be the first to post.</div>'}
    </div>`;
  };
  window.leaveCommunity=function(id){
    const c=rcCommunity(id);if(!c)return;
    if(rcIsOwner(c))return toast('The owner cannot leave. Transfer ownership first.');
    c.members=c.members.filter(x=>String(x)!==String(current));c.admins=c.admins.filter(x=>String(x)!==String(current));rcPersist();communities();
  };
  window.communityPost=function(id){
    const c=rcCommunity(id),t=prompt('Write a post for this community…');if(!c||!t?.trim())return;
    c.posts.unshift({id:uid('cp'),user:current,text:t.trim(),comments:[],created:Date.now()});
    c.members.filter(x=>String(x)!==String(current)).forEach(to=>notify(to,'community',`${user().display} posted in ${c.name}.`,'community:'+id));
    rcPersist();viewCommunity(id);
  };
  // Ensure the upgraded renderer is used when navigating to Communities.
  try{if(state.view==='communities')communities()}catch{}
})();
</script>
<script>
/* ===== RIPPLE v83 REALTIME + COMMENT FIX ===== */
(function(){
  // Resolve the actual public profiles.id for the signed-in Auth user.
  // Comments/likes in this schema use profiles.id, not the Auth UUID.
  async function ensureMyOnlineProfileId(){
    if(!onlineUser||!supabaseClient)return null;
    const me=user();
    if(!me)return null;
    if(me.profile_id!=null&&String(me.profile_id))return String(me.profile_id);
    try{
      let q=await supabaseClient.from('profiles').select('id,username,auth_id').eq('auth_id',onlineUser.id).maybeSingle();
      if(q.error)throw q.error;
      let row=q.data;
      if(!row){
        q=await supabaseClient.from('profiles').select('id,username,auth_id').eq('username',String(me.username||'').toLowerCase()).maybeSingle();
        if(q.error)throw q.error;
        row=q.data;
      }
      if(row?.id!=null){
        me.profile_id=String(row.id);
        me.auth_id=onlineUser.id;
        save();
        return String(row.id);
      }
    }catch(e){console.warn('Ripple profile-id lookup failed:',e)}
    return null;
  }
  window.ensureMyOnlineProfileId=ensureMyOnlineProfileId;

  // Make profile sync remember the id returned by Supabase immediately.
  const oldSyncMyProfile=syncMyProfile;
  syncMyProfile=async function(){
    const ok=await oldSyncMyProfile();
    if(ok&&onlineUser){
      try{await ensureMyOnlineProfileId()}catch{}
    }
    return ok;
  };

  // When the public profiles query succeeds, reconcile known online profiles
  // against it. This is the missing piece that lets Device B learn that a
  // profile was deleted even if its websocket DELETE event was missed while
  // the browser was asleep/offline. We only reconcile users that already have
  // a remote profile_id, so local-only drafts are not destroyed.
  const oldPullProfiles=pullOnlineProfiles;
  pullOnlineProfiles=async function(){
    await oldPullProfiles();
    if(!onlineUser||!supabaseClient)return;
    try{
      const q=await supabaseClient.from('profiles').select('id,username,auth_id');
      if(q.error||!Array.isArray(q.data))return;
      const remoteIds=new Set(q.data.map(r=>r?.id!=null?String(r.id):'').filter(Boolean));
      const remoteAuth=new Set(q.data.map(r=>r?.auth_id!=null?String(r.auth_id):'').filter(Boolean));
      const doomed=[];
      Object.values(db.users||{}).forEach(u=>{
        if(!u||String(u.id)===String(current)||u.profile_id==null)return;
        const pid=String(u.profile_id);
        const aid=u.auth_id!=null?String(u.auth_id):'';
        if(!remoteIds.has(pid)&&(!aid||!remoteAuth.has(aid)))doomed.push(u);
      });
      if(doomed.length){
        window._rippleDeletedProfileTombstones=window._rippleDeletedProfileTombstones||new Set();
        doomed.forEach(u=>{
          [u.id,u.username,u.profile_id,u.auth_id].filter(x=>x!=null&&String(x)).forEach(x=>window._rippleDeletedProfileTombstones.add(String(x)));
        });
        const saved=(()=>{try{return JSON.parse(localStorage.getItem('ripple_deleted_profiles_v1')||'[]').map(String)}catch{return []}})();
        try{localStorage.setItem('ripple_deleted_profiles_v1',JSON.stringify([...new Set([...saved,...doomed.flatMap(u=>[u.id,u.username,u.profile_id,u.auth_id].filter(x=>x!=null&&String(x)).map(String))])].slice(-500)))}catch{}
        doomed.forEach(u=>{
          db.posts=(db.posts||[]).filter(p=>{
            const ids=[p.user,p.username,p.remote_author_id,p.author_id].filter(x=>x!=null&&String(x)).map(String);
            return !ids.includes(String(u.id))&&!ids.includes(String(u.username))&&!ids.includes(String(u.profile_id))&&!ids.includes(String(u.auth_id));
          });
          delete db.users[u.id];
          if(u.username&&db.users[u.username])delete db.users[u.username];
        });
        try{save()}catch{}
      }
    }catch(e){console.warn('Ripple profile deletion reconciliation failed:',e)}
    if(window.ripplePurgeDeleted)window.ripplePurgeDeleted();
  };

  // Comments: use the real profiles.id, never a missing local profile_id.
  const oldComment=comment;
  comment=async function(id){
    const inp=$('#comment-'+id),text=inp?.value.trim();
    if(!text)return;
    const p=db.posts.find(x=>String(x.id)===String(id));
    if(!p)return;
    if(onlineUser){
      const postId=remotePostId(p);
      const profileId=await ensureMyOnlineProfileId();
      if(postId!=null&&profileId!=null){
        try{
          // This is the canonical schema used by Ripple: comments.author_id is NOT NULL.
          // Do not try payload variants with null/missing author_id; that caused the
          // "author_id violates not-null constraint" error shown on Device B.
          const q=await supabaseClient.from('comments')
            .insert({post_id:String(postId),author_id:String(profileId),content:text})
            .select('id,post_id,author_id,content,created_at')
            .maybeSingle();
          if(q.error)throw q.error;
          inp.value='';
          await notify(p.user,'comment',`${user().display} commented on your post.`,`comment:${postId}:${profileId}:${Date.now()}`);
          await pullOnlineLikesComments();
          render();
          return;
        }catch(e){
          console.warn('Online comment failed:',e);
          toast(e?.message||'Comment could not be saved online.');
          return;
        }
      }
      // If the profile cannot be resolved, do not silently create an offline
      // comment that another device can never see.
      toast('Your Ripple profile is still syncing. Please try the comment again.');
      return;
    }
    return oldComment(id);
  };

  // Rebuild the realtime channel so profile/post DELETE events are handled too.
  async function installRealtimeV83(){
    if(!onlineUser||!supabaseClient)return;
    try{
      if(window.__rippleRealtime){await supabaseClient.removeChannel(window.__rippleRealtime)}
    }catch{}
    window.__rippleRealtime=supabaseClient.channel('ripple-live-v83-'+onlineUser.id)
      .on('broadcast',{event:'typing'},payload=>receiveTyping(payload?.payload||payload))
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'profiles'},async()=>{await pullOnlineProfiles();await pullOnlinePosts();if(state.view!=='profile')render()})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},async()=>{await pullOnlineProfiles();await pullOnlinePosts();if(state.view!=='profile')render()})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'profiles'},async payload=>{
        const old=payload?.old||{};
        const ids=[old.id,old.username,old.auth_id].filter(x=>x!=null&&String(x)).map(String);
        window._rippleDeletedProfileTombstones=window._rippleDeletedProfileTombstones||new Set();
        ids.forEach(x=>window._rippleDeletedProfileTombstones.add(x));
        try{
          const saved=JSON.parse(localStorage.getItem('ripple_deleted_profiles_v1')||'[]').map(String);
          localStorage.setItem('ripple_deleted_profiles_v1',JSON.stringify([...new Set([...saved,...ids])].slice(-500)));
        }catch{}
        if(window.ripplePurgeDeleted)window.ripplePurgeDeleted();
        await pullOnlineProfiles();
        render();
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},async()=>{await pullOnlineProfiles();await pullOnlinePosts();render()})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'posts'},async()=>{await pullOnlinePosts();render()})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'posts'},async()=>{await pullOnlinePosts();render()})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async payload=>{
        const row=payload?.new;if(!row||row.sender_id===onlineUser.id)return;
        await pullOnlineChats();if(state.view==='messages')messages();const created=row.created_at?new Date(row.created_at).getTime():Date.now();if(created>=notificationSessionStartedAt-2000)sound();
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'recipient_id=eq.'+onlineUser.id},async payload=>{
        const row=payload?.new||{};const created=row.created_at?new Date(row.created_at).getTime():Date.now();
        await pullOnlineNotifications();const fresh=created>=notificationSessionStartedAt-2000;
        if(row.id&&fresh){const n=db.notifications.find(x=>String(x.id)===String(row.id));if(n){n.fresh=true;save()}}
        render();if(fresh)sound();
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'likes'},async()=>{await pullOnlineLikesComments();render()})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'likes'},async()=>{await pullOnlineLikesComments();render()})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'comments'},async()=>{await pullOnlineLikesComments();render()})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'comments'},async()=>{await pullOnlineLikesComments();render()})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'comments'},async()=>{await pullOnlineLikesComments();render()})
      .subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Ripple realtime status:',status)});
  }
  window.installRealtimeV83=installRealtimeV83;

  // Mobile browsers can suspend websocket connections. This fallback makes
  // cross-device deletion/profile/feed changes converge even when Realtime is
  // unavailable. It is deliberately lightweight and only runs while signed in.
  if(window.__rippleLivePoll)clearInterval(window.__rippleLivePoll);
  let liveBusy=false;
  window.__rippleLivePoll=setInterval(async()=>{
    if(!onlineUser||liveBusy||document.hidden)return;
    liveBusy=true;
    try{
      await pullOnlineProfiles();
      await pullOnlinePosts();
      await pullOnlineLikesComments();
      if(window.ripplePurgeDeleted)window.ripplePurgeDeleted();
      render();
    }catch(e){console.warn('Ripple live sync:',e)}
    finally{liveBusy=false}
  },3500);

  // Install after all earlier startup patches have been defined.
  setTimeout(()=>{if(onlineUser)installRealtimeV83().catch(e=>console.warn(e))},250);
})();
</script>
<script id="ripple-v84">
/* ===== RIPPLE v84 — account lifecycle, blocks, exact follow counts, DM reactions ===== */
(function(){
  'use strict';
  const V84_DEFAULT_TEXT='#000000';
  const V84_REACTIONS=['❤️','👍','😂','😮','😢','😡'];
  const v84OrigProfile=window.profile;
  const v84OrigExplore=window.explore;
  const v84OrigMessages=window.messages;
  const v84OrigPullProfiles=window.pullOnlineProfiles;
  const v84OrigPullPosts=window.pullOnlinePosts;
  const v84OrigSyncProfile=window.syncMyProfile;
  const v84OrigBoot=window.boot;
  const v84OrigRealtime=window.installRealtimeV83;

  function safeColor(v){return /^#[0-9a-fA-F]{6}$/.test(String(v||''))?String(v):V84_DEFAULT_TEXT}
  function normalizeTextColors(){
    Object.values(db.users||{}).forEach(u=>{
      if(!u)return;
      // New/legacy profiles that never explicitly chose a color start black.
      if(!u.profile_text_color||u.profile_text_color==='#ffffff'&&!u._profileTextColorTouched)u.profile_text_color=V84_DEFAULT_TEXT;
      u.profile_text_color=safeColor(u.profile_text_color);
    });
  }
  normalizeTextColors();

  function deactivationMs(u){const t=u?.deactivated_until?new Date(u.deactivated_until).getTime():0;return Number.isFinite(t)?t:0}
  function isDeactivated(u){return !!u&&deactivationMs(u)>Date.now()}
  function isBlockedLocal(a,b){
    const x=userBy(a),y=userBy(b);if(!x||!y)return false;
    return !!((x.blocked_users||[]).includes(y.id)||(y.blocked_users||[]).includes(x.id));
  }
  function blockedByMe(id){return !!(user()?.blocked_users||[]).includes(id)}
  function setLocalBlocked(id,on){
    const me=user(),other=userBy(id);if(!me||!other)return;
    me.blocked_users=me.blocked_users||[];
    other.blocked_by=other.blocked_by||[];
    if(on){if(!me.blocked_users.includes(other.id))me.blocked_users.push(other.id);if(!other.blocked_by.includes(me.id))other.blocked_by.push(me.id)}
    else{me.blocked_users=me.blocked_users.filter(x=>String(x)!==String(other.id));other.blocked_by=other.blocked_by.filter(x=>String(x)!==String(me.id))}
    // Blocking also removes the follow relationship in both directions.
    me.following=(me.following||[]).filter(x=>String(x)!==String(other.id));
    me.followers=(me.followers||[]).filter(x=>String(x)!==String(other.id));
    other.following=(other.following||[]).filter(x=>String(x)!==String(me.id));
    other.followers=(other.followers||[]).filter(x=>String(x)!==String(me.id));
    save();
  }

  async function onlineProfileIdFor(id){
    const u=userBy(id);if(!u)return null;
    if(u.profile_id!=null)return String(u.profile_id);
    if(!supabaseClient)return null;
    try{
      const q=await supabaseClient.from('profiles').select('id').eq('username',String(u.username||id).toLowerCase()).maybeSingle();
      if(!q.error&&q.data?.id!=null){u.profile_id=String(q.data.id);save();return String(q.data.id)}
    }catch{}
    return null;
  }

  window.blockUser=async function(id){
    if(String(id)===String(current))return;
    const other=userBy(id);if(!other||isDeactivated(other))return toast('That profile is unavailable.');
    const on=!blockedByMe(id);
    if(!confirm(on?`Block @${other.username}?\n\nThey will not appear in your Explore/feed and you will stop following each other.`:`Unblock @${other.username}?`))return;
    if(onlineUser&&supabaseClient){
      try{
        const a=await ensureMyOnlineProfileId();const b=await onlineProfileIdFor(id);
        if(a==null||b==null)throw new Error('Could not resolve both profiles online.');
        if(on){
          const q=await supabaseClient.from('blocks').upsert({blocker_id:String(a),blocked_id:String(b)},{onConflict:'blocker_id,blocked_id'});if(q.error)throw q.error;
          await supabaseClient.from('follows').delete().or(`and(follower_id.eq.${a},following_id.eq.${b}),and(follower_id.eq.${b},following_id.eq.${a})`);
        }else{
          const q=await supabaseClient.from('blocks').delete().eq('blocker_id',String(a)).eq('blocked_id',String(b));if(q.error)throw q.error;
        }
      }catch(e){toast(e?.message||'Block change could not be saved online.');return}
    }
    setLocalBlocked(id,on);
    if(state.profile===id&&on)go('home');else render();
    toast(on?`@${other.username} blocked.`:`@${other.username} unblocked.`);
  };

  function v84ProfileVisible(u){return !!u&&!isDeactivated(u)&&!isBlockedLocal(current,u.id)&&!isDeletedProfileIdV69?.(u.id)&&!isDeletedProfileIdV69?.(u.username)&&!isDeletedProfileIdV69?.(u.profile_id)&&!isDeletedProfileIdV69?.(u.auth_id)}
  window.v84ProfileVisible=v84ProfileVisible;

  async function syncFollowGraphExact(){
    if(!onlineUser||!supabaseClient)return;
    try{
      let rows=null,err=null;
      try{
        const r=await supabaseClient.rpc('ripple_follow_graph');rows=r.data;err=r.error;
      }catch(e){err=e}
      if(err||!Array.isArray(rows)){
        const q=await supabaseClient.from('follows').select('follower_id,following_id');rows=q.data;err=q.error;
      }
      if(err||!Array.isArray(rows))return;
      Object.values(db.users||{}).forEach(u=>{u.followers=[];u.following=[]});
      const byProfile=new Map(Object.values(db.users||{}).filter(u=>u?.profile_id!=null).map(u=>[String(u.profile_id),u.id]));
      rows.forEach(r=>{
        const a=byProfile.get(String(r.follower_id)),b=byProfile.get(String(r.following_id));
        const fu=a&&db.users[a],tu=b&&db.users[b];
        if(!fu||!tu||a===b||!v84ProfileVisible(fu)||!v84ProfileVisible(tu))return;
        if(!(fu.following||[]).includes(b))fu.following.push(b);
        if(!(tu.followers||[]).includes(a))tu.followers.push(a);
      });
      save();
    }catch(e){console.warn('Ripple exact follow graph sync failed',e)}
  }
  window.syncFollowGraphExact=syncFollowGraphExact;

  // Pull profile metadata including lifecycle state and block lists.
  pullOnlineProfiles=async function(){
    await v84OrigPullProfiles();
    normalizeTextColors();
    if(!onlineUser||!supabaseClient)return;
    try{
      const q=await supabaseClient.from('profiles').select('id,username,auth_id,deactivated_until');
      if(q.error||!Array.isArray(q.data))return;
      const byPid=new Map(q.data.map(r=>[String(r.id),r]));
      const byName=new Map(q.data.map(r=>[String(r.username||'').toLowerCase(),r]));
      Object.values(db.users||{}).forEach(u=>{
        const r=(u.profile_id!=null&&byPid.get(String(u.profile_id)))||byName.get(String(u.username||'').toLowerCase());
        if(r){u.deactivated_until=r.deactivated_until||null;u.profile_id=String(r.id);u.auth_id=r.auth_id||u.auth_id||null}
      });
      // Blocks are server truth when the table exists.
      try{
        const mePid=await ensureMyOnlineProfileId();
        if(mePid){
          const bq=await supabaseClient.from('blocks').select('blocker_id,blocked_id').or(`blocker_id.eq.${mePid},blocked_id.eq.${mePid}`);
          if(!bq.error&&Array.isArray(bq.data)){
            const me=user();if(me){me.blocked_users=[];me.blocked_by=[];}
            bq.data.forEach(r=>{
              const a=Object.values(db.users).find(u=>String(u.profile_id||'')===String(r.blocker_id));
              const b=Object.values(db.users).find(u=>String(u.profile_id||'')===String(r.blocked_id));
              if(a&&b){a.blocked_users=a.blocked_users||[];b.blocked_by=b.blocked_by||[];if(String(a.profile_id)===String(mePid))me.blocked_users.push(b.id);if(String(b.profile_id)===String(mePid))me.blocked_by.push(a.id)}
            });
          }
        }
      }catch{}
      save();
    }catch(e){console.warn('Ripple lifecycle profile sync failed',e)}
    try{await syncFollowGraphExact()}catch{}
    try{window.ripplePurgeDeleted?.();}catch{}
  };

  // Exact online posts: never import posts from deactivated/blocked profiles.
  pullOnlinePosts=async function(){
    await v84OrigPullPosts();
    db.posts=(db.posts||[]).filter(p=>{
      const u=db.users?.[p.user];
      if(u&&(isDeactivated(u)||isBlockedLocal(current,u.id)))return false;
      return typeof visiblePostForRippleV69!=='function'||visiblePostForRippleV69(p);
    });
    try{save()}catch{}
  };

  // Own profile always gets edit/archive controls; never render a self-follow button.
  profile=function(id){
    const u=userBy(id);if(!u)return;
    if(!v84ProfileVisible(u)){toast(isDeactivated(u)?'This account is currently deactivated.':'This Ripple profile is unavailable.');return}
    const own=String(id)===String(current)||String(u.auth_id||'')===String(onlineUser?.id||'');
    if(own&&String(current)!==String(id))id=current;
    v84OrigProfile(id);
    // The base renderer already handles own actions; this guard fixes old state where current was auth/profile id.
    setTimeout(()=>{
      const actions=document.querySelector('.profile-actions');if(!actions)return;
      if(own){
        actions.querySelectorAll('.retro-btn').forEach(btn=>{if(/FOLLOW|UNFOLLOW|FOLLOW BACK/i.test(btn.textContent||''))btn.remove()});
        if(![...actions.querySelectorAll('button')].some(b=>/EDIT PROFILE/i.test(b.textContent||''))){
          const b=document.createElement('button');b.className='retro-btn';b.textContent='✎ EDIT PROFILE';b.type='button';b.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();window.rippleLaunchEditProfile(ev);};actions.prepend(b);
        }
      }else{
        actions.querySelectorAll('.v84-block-btn').forEach(b=>b.remove());
        const b=document.createElement('button');b.className='retro-btn v84-block-btn';b.textContent=blockedByMe(u.id)?'UNBLOCK':'BLOCK';b.onclick=()=>blockUser(u.id);actions.appendChild(b);
      }
    },0);
  };

  // Hide blocked/deactivated authors everywhere the shared post renderer is used.
  const v84OrigPostHTML=window.postHTML;
  postHTML=function(p){
    const u=db.users?.[p?.user];
    if(u&&(isDeactivated(u)||isBlockedLocal(current,u.id)))return '';
    return v84OrigPostHTML(p);
  };

  // Explore filtering + no self-follow.
  explore=function(){v84OrigExplore();setTimeout(()=>{
    document.querySelectorAll('#view .user-grid .card').forEach(card=>{
      const link=card.querySelector('h3 button.link');
      const m=String(link?.getAttribute('onclick')||'').match(/go\('profile','([^']+)'\)/);
      const id=m?.[1];const u=id?userBy(id):null;
      if(id===current||u&&(isDeactivated(u)||isBlockedLocal(current,u.id)))card.remove();
    });
  },0)};

  function lifecycleModal(){
    const u=user();if(!u)return;
    $('#modalRoot').innerHTML=`<div class="modal"><div class="window lifecycle-window"><div class="titlebar">DEACTIVATE ACCOUNT <button class="link" style="color:#fff;float:right" onclick="closeModal()">CLOSE</button></div><div class="panel-body"><p><b>Deactivation hides your profile and posts temporarily.</b> Your account is not deleted.</p><div class="field"><label>HOW MANY DAYS?</label><input id="deactivateDays" type="number" min="1" max="3650" value="7"><div class="meta">Pick 1–3650 days. You can reactivate early by logging in and confirming.</div></div><div style="display:flex;gap:7px;justify-content:flex-end"><button class="retro-btn" onclick="closeModal()">CANCEL</button><button class="retro-btn danger" onclick="confirmDeactivateAccount()">DEACTIVATE</button></div></div></div></div>`;
  }
  window.deactivateAccount=lifecycleModal;
  window.confirmDeactivateAccount=async function(){
    const days=Math.max(1,Math.min(3650,parseInt($('#deactivateDays')?.value||'7',10)||7));
    const u=user();if(!u)return;
    if(!confirm(`Deactivate @${u.username} for ${days} day${days===1?'':'s'}?`))return;
    const until=new Date(Date.now()+days*86400000).toISOString();
    if(onlineUser&&supabaseClient){
      try{
        let q=await supabaseClient.rpc('ripple_deactivate_account',{p_days:days});
        if(q.error){
          q=await supabaseClient.from('profiles').update({deactivated_until:until}).eq('id',String(u.profile_id));
          if(q.error)throw q.error;
          await supabaseClient.from('follows').delete().or(`follower_id.eq.${u.profile_id},following_id.eq.${u.profile_id}`);
        }
      }catch(e){return toast(e?.message||'Could not deactivate the account online.')}
    }
    u.deactivated_until=until;
    Object.values(db.users||{}).forEach(x=>{x.following=(x.following||[]).filter(id=>String(id)!==String(u.id));x.followers=(x.followers||[]).filter(id=>String(id)!==String(u.id))});
    db.posts=(db.posts||[]).filter(p=>String(p.user)!==String(u.id));
    save();closeModal();current=null;try{await supabaseClient?.auth.signOut()}catch{}onlineUser=null;localStorage.removeItem('ripple_current');toast(`Account deactivated for ${days} days.`);setTimeout(()=>location.reload(),200);
  };

  async function reactivateIfNeeded(){
    if(!onlineUser||!current||!supabaseClient)return false;
    await v84OrigPullProfiles();
    const u=user();if(!u)return false;
    const until=deactivationMs(u);if(!until||until<=Date.now()){if(u.deactivated_until){u.deactivated_until=null;save()}return false}
    // The user already authenticated with their username/password to reach this point.
    const yes=confirm('Reactivate Account?\n\nYes = restore your account now.\nNo = keep it deactivated.');
    if(!yes){try{await supabaseClient.auth.signOut()}catch{}current=null;onlineUser=null;clearRippleSessionPersistence();return true}
    try{
      const rpc=await supabaseClient.rpc('ripple_reactivate_account');
      if(rpc.error){const q=await supabaseClient.from('profiles').update({deactivated_until:null}).eq('id',String(u.profile_id));if(q.error)throw q.error}
      u.deactivated_until=null;save();await syncFollowGraphExact();return false;
    }catch(e){toast(e?.message||'Could not reactivate the account.');try{await supabaseClient.auth.signOut()}catch{}current=null;onlineUser=null;clearRippleSessionPersistence();return true}
  }
  window.reactivateIfNeeded=reactivateIfNeeded;
  boot=async function(){
    const r=await v84OrigBoot();
    try{if(onlineUser&&current){const stopped=await reactivateIfNeeded();if(stopped){location.reload();return}normalizeTextColors();render()}}catch(e){console.warn('Ripple lifecycle gate:',e)}
    return r;
  };

  // Authoritative account deletion: public content cleanup first, Auth deletion second.
  deleteAccount=async function(){
    const u=user();if(!u)return;
    if(!confirm(`Delete @${u.username} permanently?\n\nEvery post, comment, like, follow, block, reaction, and public profile record owned by this account will be wiped. This cannot be undone.`))return;
    const ids=[u.id,u.username,u.profile_id,u.auth_id].filter(x=>x!=null&&String(x)).map(String);
    window._rippleDeletedProfileTombstones=window._rippleDeletedProfileTombstones||new Set();ids.forEach(x=>window._rippleDeletedProfileTombstones.add(x));
    try{const old=JSON.parse(localStorage.getItem('ripple_deleted_profiles_v1')||'[]').map(String);localStorage.setItem('ripple_deleted_profiles_v1',JSON.stringify([...new Set([...old,...ids])].slice(-500)))}catch{}
    const doomed=(db.posts||[]).filter(p=>{const pu=db.users?.[p.user];const vals=[p.user,p.username,p.remote_author_id,p.author_id,pu?.id,pu?.username,pu?.profile_id,pu?.auth_id].filter(x=>x!=null&&String(x)).map(String);return vals.some(x=>ids.includes(x))});
    if(onlineUser&&supabaseClient){
      try{
        const clean=await supabaseClient.rpc('ripple_cleanup_my_account');
        if(clean.error&&!/function .* does not exist|404/i.test(String(clean.error.message||'')))throw clean.error;
        const auth=await supabaseClient.rpc('delete_my_account');
        if(auth.error)throw auth.error;
      }catch(e){
        // Backward-compatible fallback for projects that have not run the v84 SQL yet.
        try{
          const pid=String(u.profile_id||'');
          if(pid){await supabaseClient.from('posts').delete().eq('author_id',pid);await supabaseClient.from('follows').delete().or(`follower_id.eq.${pid},following_id.eq.${pid}`);await supabaseClient.from('profiles').delete().eq('id',pid)}
          const auth=await supabaseClient.rpc('delete_my_account');if(auth.error)throw auth.error;
        }catch(e2){toast('Account deletion failed: '+String(e2?.message||e?.message||'Please run the Ripple v84 Supabase SQL first.'));return}
      }
    }
    doomed.forEach(p=>{try{rememberDeletedPost(p)}catch{}});
    db.posts=(db.posts||[]).filter(p=>!doomed.includes(p));
    Object.values(db.users||{}).forEach(x=>{x.posts=(x.posts||[]).filter(pid=>!doomed.some(p=>String(p.id)===String(pid)));x.followers=(x.followers||[]).filter(id=>!ids.includes(String(id)));x.following=(x.following||[]).filter(id=>!ids.includes(String(id)))});
    Object.keys(db.users||{}).forEach(k=>{const x=db.users[k];if(ids.includes(String(k))||ids.includes(String(x?.id))||ids.includes(String(x?.username))||ids.includes(String(x?.profile_id))||ids.includes(String(x?.auth_id)))delete db.users[k]});
    try{save()}catch{}
    current=null;onlineUser=null;clearRippleSessionPersistence();
    try{localStorage.setItem('ripple_device_accounts',JSON.stringify(deviceAccountIds().filter(x=>!ids.includes(String(x)))))}catch{}
    try{await supabaseClient?.auth.signOut()}catch{}
    toast('Account permanently deleted.');setTimeout(()=>location.reload(),200);
  };

  // Settings gets explicit lifecycle controls.
  const v84OrigSettings=window.settings;
  settings=function(){
    v84OrigSettings();
    const panel=document.querySelector('#view .panel-body');if(!panel)return;
    const accountHead=[...panel.querySelectorAll('h3')].find(x=>x.textContent.trim()==='Account');
    if(!accountHead)return;
    const u=user();
    const wrap=document.createElement('div');wrap.className='v84-account-tools';wrap.innerHTML=`<h4 style="margin:12px 0 5px">ACCOUNT STATUS</h4><p class="meta">${isDeactivated(u)?'Your account is currently deactivated.':'Deactivate temporarily or permanently delete your account.'}</p><button class="retro-btn" onclick="deactivateAccount()">|| DEACTIVATE ACCOUNT</button> <button class="retro-btn danger" onclick="deleteAccount()">DELETE ACCOUNT</button>`;
    const oldDelete=[...panel.querySelectorAll('button')].find(b=>b.textContent.includes('DELETE ACCOUNT'));if(oldDelete)oldDelete.remove();accountHead.insertAdjacentElement('afterend',wrap);
  };

  // Blocked users should also disappear from the Messages people/conversation list.
  messages=function(){
    if(state.chat){const active=db.chats.find(x=>String(x.id)===String(state.chat));const other=active?.members?.find(x=>String(x)!==String(current));if(other&&isBlockedLocal(current,other)){state.chat=null}}
    v84OrigMessages();
    document.querySelectorAll('.chatlist .chatitem').forEach(item=>{
      const m=String(item.getAttribute('onclick')||'').match(/openFollowedChat\('([^']+)'\)/);
      const id=m?.[1];if(id&&isBlockedLocal(current,id))item.remove();
    });
  };

  // ----- DM message reactions -----
  function reactionData(m){m.reactions=m.reactions||{};return m.reactions}
  function reactionCount(m){return Object.values(reactionData(m)).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
  window.cancelMessageLongPress=function(){clearTimeout(window._rippleMsgLongPress);window._rippleMsgLongPress=null};
  window.startMessageLongPress=function(ev,chatId,msgId){
    if(ev?.pointerType==='mouse'&&ev.button!==0)return;
    cancelMessageLongPress();
    window._rippleMsgLongPress=setTimeout(()=>{showMessageReactionMenu(chatId,msgId,ev?.clientX||window.innerWidth/2,ev?.clientY||window.innerHeight/2)},520);
  };
  window.showMessageReactionMenu=function(chatId,msgId,x,y){
    cancelMessageLongPress();document.querySelector('.ripple-reaction-menu')?.remove();
    const menu=document.createElement('div');menu.className='ripple-reaction-menu';menu.style.left=Math.max(8,Math.min(window.innerWidth-260,x-110))+'px';menu.style.top=Math.max(8,Math.min(window.innerHeight-70,y-70))+'px';
    menu.innerHTML=V84_REACTIONS.map(e=>`<button type="button" title="React ${e}" onclick="reactToMessage('${String(chatId).replace(/'/g,"&#39;")}','${String(msgId).replace(/'/g,"&#39;")}','${e}')">${e}</button>`).join('');document.body.appendChild(menu);setTimeout(()=>document.addEventListener('pointerdown',function close(e){if(!e.target.closest('.ripple-reaction-menu')){menu.remove();document.removeEventListener('pointerdown',close)}},{once:true}),0);
  };
  window.reactToMessage=async function(chatId,msgId,emoji){
    const c=db.chats.find(x=>String(x.id)===String(chatId));const m=c?.messages?.find(x=>String(x.id)===String(msgId));if(!m||!onlineUser)return;
    const reactions=reactionData(m),arr=Array.isArray(reactions[emoji])?reactions[emoji]:[];const uid=String(onlineUser.id),has=arr.map(String).includes(uid);
    if(has)reactions[emoji]=arr.filter(x=>String(x)!==uid);else{reactions[emoji]=[...arr,uid]}
    save();messages();
    try{
      if(has){const q=await supabaseClient.from('message_reactions').delete().eq('message_id',String(msgId)).eq('user_id',uid).eq('reaction',emoji);if(q.error)throw q.error}
      else{const q=await supabaseClient.from('message_reactions').upsert({message_id:String(msgId),user_id:uid,reaction:emoji},{onConflict:'message_id,user_id,reaction'});if(q.error)throw q.error}
    }catch(e){console.warn('Message reaction sync failed',e);toast('Reaction saved locally; online reaction sync failed.')}
  };
  function renderReactions(m){
    const r=reactionData(m);const entries=Object.entries(r).filter(([,ids])=>Array.isArray(ids)&&ids.length);if(!entries.length)return '';
    return `<div class="message-reactions">${entries.map(([e,ids])=>`<button type="button" class="message-reaction ${ids.map(String).includes(String(onlineUser?.id))?'mine-reaction':''}" onclick="reactToMessage('${String(m._chatId||state.chat)}','${String(m.id)}','${e}')">${e} ${ids.length}</button>`).join('')}</div>`;
  }
  messageRowsHTML=function(c){
    const unique=[];const seen=new Set();(c.messages||[]).forEach(m=>{const key=String(m.id||`${m.senderAuthId||m.user}|${m.created}|${m.text||''}|${m.image||''}|${m.audio||''}`);if(seen.has(key))return;seen.add(key);m._chatId=c.id;unique.push(m)});c.messages=unique;
    return unique.map(m=>{const mine=(m.senderAuthId&&onlineUser&&String(m.senderAuthId)===String(onlineUser.id))||(m.user===current);return `<div class="bubble ${mine?'mine':''}" oncontextmenu="event.preventDefault();showMessageReactionMenu('${String(c.id).replace(/'/g,"&#39;")}','${String(m.id).replace(/'/g,"&#39;")}',event.clientX,event.clientY)" onpointerdown="startMessageLongPress(event,'${String(c.id).replace(/'/g,"&#39;")}','${String(m.id).replace(/'/g,"&#39;")}')" onpointerup="cancelMessageLongPress()" onpointercancel="cancelMessageLongPress()" onpointerleave="cancelMessageLongPress()">${m.image?`<img src="${m.image}" style="max-width:220px;max-height:260px">`:''}${m.text?`<div>${esc(m.text)}</div>`:''}${m.audio?`<audio controls src="${m.audio}"></audio>`:''}<div class="meta">${time(m.created)}</div>${renderReactions(m)}</div>`}).join('')||`<div class="empty">Start the conversation.</div>`;
  };

  // Load reactions whenever chats are pulled. If the table is not installed yet,
  // the app simply keeps local reactions instead of breaking messages.
  async function pullMessageReactionsV84(){
    if(!onlineUser||!supabaseClient)return;
    try{
      const q=await supabaseClient.from('message_reactions').select('message_id,user_id,reaction');if(q.error||!Array.isArray(q.data))return;
      Object.values(db.chats||{}).forEach(()=>{});
      db.chats.forEach(c=>c.messages?.forEach(m=>{m.reactions={}}));
      q.data.forEach(r=>{for(const c of db.chats){const m=c.messages?.find(x=>String(x.id)===String(r.message_id));if(m){m.reactions=m.reactions||{};(m.reactions[r.reaction]||(m.reactions[r.reaction]=[])).push(r.user_id);break}}});
      save();
    }catch{}
  }
  window.pullMessageReactionsV84=pullMessageReactionsV84;

  // Login paths can finish without calling boot (especially local-first login), so gate reactivation after auth/profile sync too.
  const v84OrigAuthSubmitImpl=window.authSubmitImpl;
  authSubmitImpl=async function(){
    // Do not let the normal login routine render the home page before we check
    // whether this account is still deactivated.
    const realRender=window.render;
    window.__rippleAuthGate=true;
    window.render=function(){ if(window.__rippleAuthGate)return; return realRender.apply(this,arguments); };
    try{
      await v84OrigAuthSubmitImpl();
    }finally{
      window.__rippleAuthGate=false;
      window.render=realRender;
    }
    if(onlineUser&&current){
      const u=user();
      const activeDeactivated=!!u&&!!deactivationMs(u)&&deactivationMs(u)>Date.now();
      if(activeDeactivated){
        // Put the login screen back in front while the YES / NO decision is shown.
        $('#auth').style.display='grid';
        $('#app').style.display='none';
      }
      try{
        const stopped=await reactivateIfNeeded();
        if(stopped){location.reload();return}
        $('#auth').style.display='none';
        $('#app').style.display='block';
        render();
      }catch(e){
        console.warn('Ripple reactivation gate:',e);
        if(activeDeactivated){
          try{await supabaseClient.auth.signOut()}catch{}
          current=null;onlineUser=null;clearRippleSessionPersistence();
          return;
        }
        render();
      }
    }
  };

  // Rebuild realtime with lifecycle/follow/block/reaction changes in addition to v83 events.
  async function installRealtimeV84(){
    if(!onlineUser||!supabaseClient)return;
    try{if(window.__rippleRealtime)await supabaseClient.removeChannel(window.__rippleRealtime)}catch{}
    const ch=supabaseClient.channel('ripple-live-v84-'+onlineUser.id)
      .on('broadcast',{event:'typing'},payload=>receiveTyping(payload?.payload||payload))
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'profiles'},async()=>{await pullOnlineProfiles();await pullOnlinePosts();if(state.view!=='profile')render()})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles'},async()=>{await pullOnlineProfiles();await pullOnlinePosts();if(state.view!=='profile')render()})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'profiles'},async()=>{await pullOnlineProfiles();await pullOnlinePosts();await syncFollowGraphExact();if(state.view!=='profile')render()})
      .on('postgres_changes',{event:'*',schema:'public',table:'follows'},async()=>{await pullOnlineProfiles();await syncFollowGraphExact();render()})
      .on('postgres_changes',{event:'*',schema:'public',table:'blocks'},async()=>{await pullOnlineProfiles();await pullOnlinePosts();render()})
      .on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},async()=>{await pullMessageReactionsV84();if(state.view==='messages')messages()})
      .on('postgres_changes',{event:'*',schema:'public',table:'posts'},async()=>{await pullOnlinePosts();render()})
      .on('postgres_changes',{event:'*',schema:'public',table:'messages'},async payload=>{const row=payload?.new;if(row?.sender_id===onlineUser.id)return;await pullOnlineChats();await pullMessageReactionsV84();if(state.view==='messages')messages();const created=row?.created_at?new Date(row.created_at).getTime():Date.now();if(created>=notificationSessionStartedAt-2000)sound()})
      .on('postgres_changes',{event:'*',schema:'public',table:'likes'},async()=>{await pullOnlineLikesComments();render()})
      .on('postgres_changes',{event:'*',schema:'public',table:'comments'},async()=>{await pullOnlineLikesComments();render()})
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'recipient_id=eq.'+onlineUser.id},async()=>{await pullOnlineNotifications();render()})
      .subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Ripple v84 realtime:',status)});
    window.__rippleRealtime=ch;
  }
  window.installRealtimeV84=installRealtimeV84;

  // Replace v83 realtime after startup.
  setTimeout(()=>{if(onlineUser)installRealtimeV84().catch(()=>{})},500);
  if(window.__rippleLivePoll)clearInterval(window.__rippleLivePoll);
  let busy=false;
  window.__rippleLivePoll=setInterval(async()=>{
    if(!onlineUser||busy||document.hidden)return;busy=true;
    try{
      await pullOnlineProfiles();await pullOnlinePosts();await pullOnlineChats();await pullMessageReactionsV84();await syncFollowGraphExact();window.ripplePurgeDeleted?.();
      /* Never full-render an actively viewed profile from the background poll.
         A profile render replaces the DOM and can wipe an editor/save result. */
      if(state.view!=='profile')render();
    }catch(e){console.warn('Ripple v84 live sync:',e)}finally{busy=false}
  },3000);
})();

</script>
<style id="ripple-v84-lifecycle-ui">
.ripple-reaction-menu{position:fixed;z-index:1000;display:flex;gap:4px;padding:7px;background:#fff;border:2px solid #111;box-shadow:3px 4px 0 #000;border-radius:8px}.ripple-reaction-menu button{font-size:22px;border:1px solid #9aa;background:#f5f7f9;border-radius:6px;padding:4px 6px;cursor:pointer}.message-reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.message-reaction{border:1px solid #9baab5;background:#fff;border-radius:12px;padding:2px 6px;font-size:11px;cursor:pointer}.message-reaction.mine-reaction{background:#d7ecff;border-color:#3979a7}.lifecycle-window{width:min(560px,100%)!important}.profile-actions{display:flex;gap:6px;flex-wrap:wrap}.profile-page-text{color:var(--profile-page-text,#000)!important}.profile-page-text *{color:var(--profile-page-text,#000)!important}
.dark .ripple-reaction-menu{background:#18232b;border-color:#d9e8ef}.dark .ripple-reaction-menu button,.dark .message-reaction{background:#202e37;color:#eef7fb;border-color:#4c606c}
</style>
<script id="ripple-v85-privacy-reactivation">
(function(){
  'use strict';
  const oldSyncMyProfile=window.syncMyProfile;
  const oldSettings=window.settings;
  const oldToggleFollow=window.toggleFollow;

  function privateAccount(u){return !!u?.is_private}
  function pendingFollow(id){return !!(user()?.pending_following||[]).map(String).includes(String(id))}
  function pendingRequestFrom(id){return !!(user()?.pending_followers||[]).map(String).includes(String(id))}

  async function loadFollowRequests(){
    if(!onlineUser||!supabaseClient)return;
    try{
      const mePid=await onlineProfileIdFor(current); if(mePid==null)return;
      const q=await supabaseClient.from('follow_requests').select('id,requester_id,recipient_id,created_at').or(`recipient_id.eq.${mePid},requester_id.eq.${mePid}`);
      if(q.error||!Array.isArray(q.data))return;
      const byProfile=new Map(Object.values(db.users||{}).filter(u=>u?.profile_id!=null).map(u=>[String(u.profile_id),u.id]));
      const me=user(); if(!me)return;
      me.pending_followers=[]; me.pending_following=[];
      q.data.forEach(r=>{
        const a=byProfile.get(String(r.requester_id)), b=byProfile.get(String(r.recipient_id));
        if(String(r.recipient_id)===String(mePid)&&a)me.pending_followers.push(a);
        if(String(r.requester_id)===String(mePid)&&b)me.pending_following.push(b);
      });
      save();
    }catch(e){console.warn('Follow request sync failed',e)}
  }

  async function requestFollow(id,me,other){
    if(pendingFollow(id))return toast(`Follow request already sent to @${other.username}.`);
    const q=await supabaseClient.from('follow_requests').upsert({requester_id:String(me.profile_id),recipient_id:String(other.profile_id)},{onConflict:'requester_id,recipient_id'});
    if(q.error)throw q.error;
    me.pending_following=me.pending_following||[];
    if(!me.pending_following.includes(other.id))me.pending_following.push(other.id);
    save();
    try{await notify(id,'follow_request',`${me.display} wants to follow you.`,`profile:${current}`)}catch{}
    render();
    toast(`Follow request sent to @${other.username}.`);
  }

  window.respondFollowRequest=async function(requesterId,accept){
    const me=user(),other=userBy(requesterId); if(!me||!other||!onlineUser)return;
    try{
      const a=await onlineProfileIdFor(requesterId), b=await onlineProfileIdFor(current);
      if(a==null||b==null)throw new Error('Could not resolve both profiles online.');
      const del=await supabaseClient.from('follow_requests').delete().eq('requester_id',String(a)).eq('recipient_id',String(b));
      if(del.error)throw del.error;
      if(accept){
        const ins=await supabaseClient.from('follows').upsert({follower_id:String(a),following_id:String(b)},{onConflict:'follower_id,following_id'});
        if(ins.error)throw ins.error;
      }
      await loadFollowRequests();
      db.notifications=db.notifications.filter(n=>!(n.type==='follow_request'&&n.actor===requesterId&&n.to===current));
      save();
      await syncFollowGraphExact(); render();
      toast(accept?`@${other.username} is now following you.`:`Follow request from @${other.username} declined.`);
    }catch(e){toast(e?.message||'Could not update the follow request.')}
  };

  window.followRequestsPanel=async function(){
    await loadFollowRequests();
    const me=user(); const ids=(me?.pending_followers||[]).filter(id=>v84ProfileVisible?.(userBy(id))??!!userBy(id));
    $('#modalRoot').innerHTML=`<div class="modal"><div class="window" style="max-width:430px;width:94%"><div class="titlebar">FOLLOW REQUESTS <button class="link" style="color:#fff;float:right" onclick="closeModal()">CLOSE</button></div><div class="panel-body">${ids.length?ids.map(id=>{const u=userBy(id);return `<div class="account-row" style="margin:8px 0"><img class="avatar" src="${avatar(u)}"><div style="flex:1"><button class="link" onclick="closeModal();go('profile','${u.id}')"><b>${esc(u.display)}</b></button><div class="meta">@${esc(u.username)}</div></div><button class="retro-btn" onclick="respondFollowRequest('${u.id}',true)">ACCEPT</button><button class="retro-btn danger" onclick="respondFollowRequest('${u.id}',false)">DECLINE</button></div>`}).join(''):`<div class="empty">No pending follow requests.</div>`}</div></div></div>`;
  };

  // Sync the account privacy flag to profiles.
  window.syncMyProfile=async function(){
    const ok=await oldSyncMyProfile();
    const u=user();
    if(ok&&u&&onlineUser&&supabaseClient){
      try{
        let q=await supabaseClient.from('profiles').update({is_private:!!u.is_private}).eq('auth_id',onlineUser.id);
        if(q.error&&!/column .* does not exist|schema cache|could not find/i.test(String(q.error.message||'')))throw q.error;
        if(q.error && u.profile_id!=null) q=await supabaseClient.from('profiles').update({is_private:!!u.is_private}).eq('id',String(u.profile_id));
      }catch(e){console.warn('Private account sync failed',e)}
    }
    return ok;
  };

  // Replace FOLLOW with REQUEST when the target is private.
  window.followLabel=function(id){
    if(id===current)return '';
    const me=user(),other=userBy(id); if(!other)return 'FOLLOW';
    if((me.following||[]).map(String).includes(String(id)))return 'UNFOLLOW';
    if(pendingFollow(id))return 'REQUESTED';
    if((other.following||[]).map(String).includes(String(current)))return 'FOLLOW BACK';
    return privateAccount(other)?'REQUEST':'FOLLOW';
  };

  window.toggleFollow=async function(id){
    if(id===current)return;
    let me=user(),other=userBy(id); if(!me||!other)return toast('That Ripple account could not be found.');
    if(isDeactivated?.(other)||isBlockedLocal?.(current,id))return toast('That profile is unavailable.');
    const wasFollowing=(me.following||[]).map(String).includes(String(id));
    if(onlineUser){
      try{
        if(me.profile_id==null||other.profile_id==null){await pullOnlineProfiles();me=user();other=userBy(id)}
        if(me?.profile_id==null||other?.profile_id==null)throw new Error('Could not find both Ripple profiles online.');
        if(wasFollowing){
          const q=await supabaseClient.from('follows').delete().eq('follower_id',String(me.profile_id)).eq('following_id',String(other.profile_id)); if(q.error)throw q.error;
          me.following=(me.following||[]).filter(x=>String(x)!==String(id)); other.followers=(other.followers||[]).filter(x=>String(x)!==String(current));
          save(); await syncFollowGraphExact(); render(); toast(`You unfollowed @${other.username}.`); return;
        }
        if(pendingFollow(id)){return toast(`Follow request already sent to @${other.username}.`)}
        if(privateAccount(other)){await requestFollow(id,me,other);return;}
        const q=await supabaseClient.from('follows').upsert({follower_id:String(me.profile_id),following_id:String(other.profile_id)},{onConflict:'follower_id,following_id'}); if(q.error)throw q.error;
        await pullOnlineFollows(); try{await notify(id,'follow',`${me.display} followed you.`,`profile:${current}`)}catch{} render(); toast(`You followed @${other.username}.`); return;
      }catch(e){console.error('Ripple follow failed',e);toast(e?.message||'Could not update follow.');return}
    }
    if(privateAccount(other)){
      me.pending_following=me.pending_following||[]; if(!me.pending_following.includes(id))me.pending_following.push(id); save(); render(); return toast(`Follow request sent to @${other.username}.`);
    }
    me.following=me.following||[];other.followers=other.followers||[];me.following.push(id);if(!other.followers.includes(current))other.followers.push(current);save();render();
  };

  // Real YES / NO modal instead of browser confirm for reactivation.
  window.reactivateIfNeeded=async function(){
    if(!onlineUser||!current||!supabaseClient)return false;
    try{await v84OrigPullProfiles()}catch{}
    const u=user(); if(!u)return false;
    const until=deactivationMs(u); if(!until||until<=Date.now()){if(u.deactivated_until){u.deactivated_until=null;save()}return false}
    const choice=await new Promise(resolve=>{
      $('#modalRoot').innerHTML=`<div class="modal"><div class="window" style="max-width:390px;width:92%"><div class="titlebar">REACTIVATE ACCOUNT?</div><div class="panel-body"><h3>Reactivate Account?</h3><p>Your account is currently deactivated.</p><p>Would you like to reactivate <b>@${esc(u.username)}</b> now?</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="retro-btn danger" id="reactivateNo">NO</button><button class="retro-btn" id="reactivateYes">YES</button></div></div></div></div>`;
      $('#reactivateYes').onclick=()=>{closeModal();resolve(true)};
      $('#reactivateNo').onclick=()=>{closeModal();resolve(false)};
    });
    if(!choice){try{await supabaseClient.auth.signOut()}catch{}current=null;onlineUser=null;clearRippleSessionPersistence();return true}
    try{
      const rpc=await supabaseClient.rpc('ripple_reactivate_account');
      if(rpc.error){const q=await supabaseClient.from('profiles').update({deactivated_until:null}).eq('id',String(u.profile_id));if(q.error)throw q.error}
      u.deactivated_until=null;save();await syncFollowGraphExact();return false;
    }catch(e){toast(e?.message||'Could not reactivate the account.');try{await supabaseClient.auth.signOut()}catch{}current=null;onlineUser=null;clearRippleSessionPersistence();return true}
  };

  // Make counts refresh whenever profile lifecycle changes.
  const oldPullProfiles=window.pullOnlineProfiles;
  window.pullOnlineProfiles=async function(){
    await oldPullProfiles();
    try{
      const q=await supabaseClient.from('profiles').select('id,username,is_private,deactivated_until');
      if(!q.error&&Array.isArray(q.data)){
        const byPid=new Map(q.data.map(r=>[String(r.id),r]));
        const byName=new Map(q.data.map(r=>[String(r.username||'').toLowerCase(),r]));
        Object.values(db.users||{}).forEach(u=>{
          const r=(u.profile_id!=null&&byPid.get(String(u.profile_id)))||byName.get(String(u.username||'').toLowerCase());
          if(r){u.is_private=!!r.is_private;u.deactivated_until=r.deactivated_until||null;}
        });
        save();
      }
    }catch(e){console.warn('Private profile sync failed',e)}
    try{await loadFollowRequests()}catch{}
    try{await syncFollowGraphExact()}catch{}
    try{window.ripplePurgeDeleted?.()}catch{}
  };

  const oldProfile=window.profile;
  window.profile=function(id){
    oldProfile(id);
    setTimeout(()=>{
      const u=userBy(id); if(!u)return;
      const title=document.querySelector('#view .profile-actions')?.parentElement;

          document.querySelector('#view .profile-actions')?.insertAdjacentElement('afterend',n);
        }
      }
    },0);
  };

  // Keep server graph authoritative and immediately recalculate visible counts.
  const oldSyncGraph=window.syncFollowGraphExact;
  if(oldSyncGraph){window.syncFollowGraphExact=async function(){await oldSyncGraph();const me=user();if(me){me.followers=(me.followers||[]).filter(id=>v84ProfileVisible?.(userBy(id))??!!userBy(id));me.following=(me.following||[]).filter(id=>v84ProfileVisible?.(userBy(id))??!!userBy(id));save();}}}
})();
</script>

<script id="ripple-v132-persistence-surgical">
(function(){
  'use strict';
  window.ripplePersistProfileSurgical=async function(u){
    if(!u||!onlineUser||!supabaseClient)return false;
    // Refresh the Auth user immediately before saving so we never write to a
    // stale Supabase session on mobile/browser restores.
    try{
      const fresh=await supabaseClient.auth.getUser();
      if(!fresh.error&&fresh.data&&fresh.data.user)onlineUser=fresh.data.user;
    }catch(e){console.warn('Ripple Auth refresh before save:',e)}
    var custom={
      profile_font:u.profile_font||'Arial',
      profile_info_box_color:u.profile_info_box_color||'#ffffff',
      profile_info_banner_color:u.profile_info_banner_color||'#063c8c',
      profile_display_font:u.profile_display_font||u.profile_font||'Arial',
      profile_username_font:u.profile_username_font||u.profile_font||'Arial',
      profile_info_font:u.profile_info_font||u.profile_font||'Arial',
      profile_display_name_color:u.profile_display_name_color||u.profile_text_color||'#ffffff',
      profile_colors:u.profile_colors||{},
      profile_info_symbols:u.profile_info_symbols||{}
    };
    // Widgets are local-first. Include them in Auth metadata only when small
    // enough to be practical; large image data must not make the whole profile
    // save fail.
    var widgetPayload=Array.isArray(u.profile_widgets)?u.profile_widgets:[];
    try{if(JSON.stringify(widgetPayload).length<180000)custom.profile_widgets=widgetPayload}catch(e){}
    var base={username:u.username,display_name:u.display,email:u.email||onlineUser.email||null,auth_id:onlineUser.id,avatar_url:u.avatar||null,text_color:u.profile_text_color||'#ffffff',cover_url:u.cover||null,theme:u.theme||'sky',bio:u.bio||'',status:u.status||'',interests:u.interests||'',pronouns:u.pronouns||'',location:u.location||'',website:u.website||'',quote:u.quote||'',is_private:!!u.is_private};
    var md={username:u.username,display_name:u.display,bio:u.bio||'',status:u.status||'',interests:u.interests||'',pronouns:u.pronouns||'',location:u.location||'',website:u.website||'',quote:u.quote||'',ripple_profile_customization:custom};
    var baseOK=false,metaOK=false;
    try{
      var q=await supabaseClient.from('profiles').update(base).eq('id',String(u.profile_id||onlineUser.id));
      if(q.error||q.count===0){q=await supabaseClient.from('profiles').update(base).eq('auth_id',onlineUser.id)}
      baseOK=!q.error;
    }catch(e){console.warn('Ripple base profile save:',e)}
    try{
      var r=await supabaseClient.auth.updateUser({data:md});
      if(!r.error&&r.data&&r.data.user)onlineUser=r.data.user;
      metaOK=!r.error;
    }catch(e){console.warn('Ripple Auth profile save:',e)}
    save();
    return baseOK||metaOK;
  };
})();
</script>

<script>

// Never let a localStorage quota error block deletion. The browser can throw QuotaExceededError

const __v69OldDeletePost=deletePost;
deletePost=async function(id){

  if(!before)return toast('Post not found.');
  try{await __v69OldDeletePost(id)}catch(e){console.warn('Delete fallback:',e)}
  // The older delete routine catches its own storage error. If it already removed the
  // post from memory, finish the UI update even when localStorage is full.
  if(!db.posts.some(x=>String(x.id)===String(id))){
    window._rippleDeletedPostTombstones=window._rippleDeletedPostTombstones||new Set();
    window._rippleDeletedPostTombstones.add('local:'+String(id));
    try{save()}catch{}
    render();
    toast('Post deleted.');
    return;
  }
  // If the old routine stopped before removing it, remove it locally now.
  db.posts=db.posts.filter(x=>String(x.id)!==String(id));
  Object.values(db.users).forEach(u=>u.posts=(u.posts||[]).filter(x=>String(x)!==String(id)));
  window._rippleDeletedPostTombstones=window._rippleDeletedPostTombstones||new Set();
  window._rippleDeletedPostTombstones.add('local:'+String(id));

};

<script>
/* RIPPLE v73: no inline pattern handlers, delegated touch/click handling,
   and stage-level pointer capture for stickers. */
(function(){
  function v73PatternBg(p,c1,c2){
    const a=c1||p?.c1||'#ff7eb6', b=c2||p?.c2||'#ffe5f0';
    const type=p?.type||'checker';
    if(type==='checker'||type==='pixel') return `repeating-conic-gradient(${a} 0 25%,${b} 0 50%) 50%/18px 18px`;
    if(type==='dots') return `radial-gradient(circle,${a} 0 2px,transparent 2.5px) 0 0/16px 16px,${b}`;
    if(type==='grid'||type==='cross') return `linear-gradient(${a} 2px,transparent 2px) 0 0/18px 18px,linear-gradient(90deg,${a} 2px,transparent 2px) 0 0/18px 18px,${b}`;
    if(type==='rings') return `radial-gradient(circle,transparent 0 5px,${a} 6px 7px,transparent 8px) 0 0/28px 28px,${b}`;
    if(type==='diamonds') return `linear-gradient(45deg,transparent 42%,${a} 43% 48%,transparent 49%) 0 0/24px 24px,linear-gradient(-45deg,transparent 42%,${a} 43% 48%,transparent 49%) 0 0/24px 24px,${b}`;
    if(type==='zigzag') return `linear-gradient(135deg,transparent 0 42%,${a} 43% 50%,transparent 51% 92%,${a} 93%) 0 0/24px 18px,${b}`;
    if(type==='diagonal'||type==='stripe') return `repeating-linear-gradient(135deg,${a} 0 7px,${b} 7px 14px)`;
    return `repeating-conic-gradient(${a} 0 25%,${b} 0 50%) 50%/18px 18px`;
  }
  function v73GinghamBg(c1,c2){
    const a=c1||'#ff7eb6',b=c2||'#ffe5f0';
    /* True gingham-like woven square checks: vertical + horizontal bands. */
    return `linear-gradient(90deg,${a} 0 50%,transparent 50% 100%) 0 0/20px 20px,`+
           `linear-gradient(0deg,${a} 0 50%,transparent 50% 100%) 0 0/20px 20px,${b}`;
  }
  function v73Apply(i){
    const e=photoEditState(i),img=document.getElementById('rippleV73Img'),stage=document.getElementById('rippleV73Stage');

    stage.style.background='transparent';
    img.style.filter=V68_FILTERS[e.filter]||'none';

    if(e.border==='gingham-custom'){

      img.style.padding='18px';img.style.background=v73GinghamBg(e.customC1||g.c1,e.customC2||g.c2);
    }else if(e.border==='pattern'){

    }else{

  }
  function v73WirePatternGrid(i){
    const grid=document.getElementById('rippleV73PatternGrid');if(!grid)return;
    const activate=(ev)=>{
      const b=ev.target.closest('button[data-kind][data-id]');if(!b||!grid.contains(b))return;
      ev.preventDefault();ev.stopPropagation();
      v73SelectPattern(i,b.dataset.kind,b.dataset.id);
    };
    grid.addEventListener('pointerup',activate,{passive:false});
    grid.addEventListener('click',activate,{passive:false});
    grid.addEventListener('touchend',activate,{passive:false});
  }
  function v73WireStickerDrag(i){
    const stage=document.getElementById('rippleV73Stage');if(!stage)return;
    const e=photoEditState(i);let drag=null;
    const down=(ev)=>{
      const el=ev.target.closest('.ripple-v73-sticker');if(!el||!stage.contains(el))return;
      const j=Number(el.dataset.stickerIndex),st=e.stickers?.[j];if(!st)return;
      ev.preventDefault();ev.stopPropagation();e.selected=j;v73Apply(i);
      const rect=stage.getBoundingClientRect();
      drag={pid:ev.pointerId,j,st,startX:ev.clientX,startY:ev.clientY,startPX:Number(st.x)||.5,startPY:Number(st.y)||.5,rect};
      try{stage.setPointerCapture(ev.pointerId)}catch{}
    };
    const move=(ev)=>{
      if(!drag||ev.pointerId!==drag.pid)return;
      ev.preventDefault();
      const st=drag.st,r=drag.rect;
      st.x=Math.max(.02,Math.min(.98,drag.startPX+(ev.clientX-drag.startX)/Math.max(1,r.width)));
      st.y=Math.max(.02,Math.min(.98,drag.startPY+(ev.clientY-drag.startY)/Math.max(1,r.height)));
      const el=stage.querySelector(`.ripple-v73-sticker[data-sticker-index="${drag.j}"]`);
      if(el){el.style.left=(st.x*100)+'%';el.style.top=(st.y*100)+'%';}
    };
    const up=(ev)=>{
      if(!drag||ev.pointerId!==drag.pid)return;
      try{if(stage.hasPointerCapture(ev.pointerId))stage.releasePointerCapture(ev.pointerId)}catch{}

    };
    stage.addEventListener('pointerdown',down,{passive:false});

  openPhotoEditor=function(i){

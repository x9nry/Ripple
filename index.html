  .mobile-tools{

  }

  .window,.panel,.card,.box,.post,.profile-card,.community-card,.message-card{

  .columns,.two-col,.layout,.content-grid{

function rippleTimeout(promise, ms, label="Ripple request timed out"){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))
  ]);
}

async function ensureSupabase(){
  if(supabaseClient)return supabaseClient;
  if(supabaseLoadPromise)return supabaseLoadPromise;
  supabaseLoadPromise=(async()=>{
    const loadScript=(src)=>new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      let done=false;
      const finish=(fn,val)=>{if(done)return;done=true;fn(val)};
      const timer=setTimeout(()=>finish(reject,new Error("Supabase CDN timed out")),7000);
      script.src=src;
      script.onload=()=>{clearTimeout(timer);finish(resolve)};
      script.onerror=()=>{clearTimeout(timer);finish(reject,new Error("Supabase CDN unavailable"))};
      document.head.appendChild(script);
    });
    try{
      if(!window.supabase){
        try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2")}catch(e){
          console.warn("Primary Supabase CDN failed, trying fallback",e);
        }
      }
      if(!window.supabase){
        await loadScript("https://unpkg.com/@supabase/supabase-js@2");
      }
      if(!window.supabase)throw new Error("Supabase library could not be loaded");
      supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"ripple_supabase_auth"}});
      return supabaseClient;
    }catch(e){
      console.warn("Ripple online service unavailable; local features remain available.",e);
      supabaseClient=null;
      supabaseLoadPromise=null;
      return null;
    }
  })();
  return supabaseLoadPromise;
}

function stableDmClientId(a,b){
  const aa=String(a||'').trim(),bb=String(b||'').trim();
  if(!aa||!bb)return null;
  return 'dm_'+[aa,bb].sort().join('_');
}

async function pullOnlineNotifications(){
  if(!onlineUser)return;
  try{
    const {data,error}=await supabaseClient.from("notifications").select("id,recipient_id,actor_id,type,text,link,read,created_at").eq("recipient_id",onlineUser.id).order("created_at",{ascending:false}).limit(200);
    if(error)throw error;
    (data||[]).forEach(row=>{
      const actor=rippleUserForAuth(row.actor_id);
      const id=String(row.id);
      const link=String(row.link||"");
      if(notificationDeleted(id,link))return;
      const item={id,to:current,type:row.type||"activity",text:row.text||"",link,read:!!row.read,created:row.created_at?new Date(row.created_at).getTime():Date.now(),actor,fresh:false};
      // Reconcile a local optimistic notification with its server copy by link
      // before falling back to the database id. This prevents one message from
      // producing two alerts when the realtime/polling sync catches up.
      let i=db.notifications.findIndex(n=>String(n.id)===id);
      if(i<0 && link)i=db.notifications.findIndex(n=>String(n.link||"")===link);
      if(i>=0)db.notifications[i]={...db.notifications[i],...item}; else db.notifications.push(item);
    });
    db.notifications=db.notifications.filter(n=>n.to===current||!n.to);
    save();
  }catch(e){console.warn("Online notification sync failed",e)}
}

function rawMessageText(m){
  if(!m)return "";
  return m.message_text ?? m.text ?? m.message ?? m.content ?? m.body ?? "";
}
function messageTextValue(m){
  const raw=String(rawMessageText(m)||"");
  return raw.replace(/\n?\[\[RIPPLE_(?:IMAGE|AUDIO)\]\][\s\S]*$/i,"").trim();
}
function messageAudioValue(m){
  if(!m)return null;
  if(m.audio)return m.audio;
  if(m.audio_url)return m.audio_url;
  const raw=String(rawMessageText(m)||"");
  const match=raw.match(/\[\[RIPPLE_AUDIO\]\]([\s\S]+)$/i);
  return match?match[1]:null;
}
function messageImageValue(m){
  if(!m)return null;
  if(m.image&&!(typeof m.image === "string" && m.image.startsWith("data:audio/")))return m.image;
  if(m.image_url)return m.image_url;
  const raw=String(rawMessageText(m)||"");
  const match=raw.match(/\[\[RIPPLE_IMAGE\]\]([\s\S]+?)(?:\n\[\[RIPPLE_AUDIO\]\][\s\S]*)?$/i);
  return match?match[1]:null;
}
let rippleMessageTextColumn=null;
async function insertOnlineMessageRow(base, audioData=null){
  // Some Ripple deployments do not have an `image`/`image_url` column on
  // messages. To keep image DMs working without another database migration,
  // store media in the existing text column using a private marker. The reader
  // above extracts the media again and leaves ordinary message text untouched.
  const candidates=rippleMessageTextColumn?[rippleMessageTextColumn]:["message_text","text","message","content","body"];
  let storedText=String(base.text||"");
  if(base.image)storedText += (storedText?"\n":"")+"[[RIPPLE_IMAGE]]"+String(base.image);
  if(audioData)storedText += (storedText?"\n":"")+"[[RIPPLE_AUDIO]]"+String(audioData);
  let lastError=null;
  for(const key of candidates){
    const row={conversation_id:base.conversation_id,sender_id:base.sender_id,[key]:storedText,created_at:base.created_at};
    const {error}=await supabaseClient.from("messages").insert(row);
    if(!error){rippleMessageTextColumn=key;return {ok:true};}
    lastError=error;
    const msg=String(error.message||"");
    if(!/column .* does not exist|could not find the .* column|schema cache/i.test(msg))break;
  }
  return {ok:false,error:lastError};
}

async function pullOnlineChats(){
  if(!onlineUser)return;
  try{
    const {data:ownMembers,error:memberErr}=await supabaseClient
      .from("conversation_members")
      .select("conversation_id,user_id")
      .eq("user_id",onlineUser.id);
    if(memberErr)throw memberErr;

    const groupIds=[...new Set((ownMembers||[]).map(x=>x.conversation_id).filter(Boolean))];
    const {data:dmRows,error:dmErr}=await supabaseClient
      .from("conversations")
      .select("id,client_id,type,name,created_at")
      .eq("type","dm")
      .like("client_id","%"+onlineUser.id+"%");
    if(dmErr)throw dmErr;

    const allRows=[];
    const seenIds=new Set();
    (dmRows||[]).forEach(r=>{if(!seenIds.has(String(r.id))){seenIds.add(String(r.id));allRows.push(r)}});

    if(groupIds.length){
      const {data:groupRows,error:groupErr}=await supabaseClient
        .from("conversations")
        .select("id,client_id,type,name,created_at")
        .in("id",groupIds);
      if(groupErr)throw groupErr;
      (groupRows||[]).forEach(r=>{if(!seenIds.has(String(r.id))){seenIds.add(String(r.id));allRows.push(r)}});
    }

    if(!allRows.length)return;

    // Every participant must have their own membership row. The conversations
    // table is discoverable by the stable DM id, but the messages table is
    // normally protected by membership RLS. The old build only created the
    // sender's membership, so the recipient could see the conversation shell
    // but could not read its messages. Add the current user's membership before
    // fetching messages. This is safe because the RLS policy only permits a
    // signed-in user to insert their own membership.
    for(const row of allRows){
      if((row.type||"dm")!=="dm")continue;
      const clientId=String(row.client_id||"");
      if(!clientId.startsWith("dm_"))continue;
      const authIds=clientId.slice(3).split("_");
      if(!authIds.includes(String(onlineUser.id)))continue;
      const {error:memberErr}=await supabaseClient.from("conversation_members")
        .insert({conversation_id:row.id,user_id:onlineUser.id});
      if(memberErr && !/duplicate key|already exists/i.test(memberErr.message||"")){
        console.warn("Could not create DM membership",memberErr);
      }
    }

    const ids=allRows.map(r=>r.id);

    const {data:msgs,error:msgErr}=await supabaseClient
      .from("messages")
      .select("*")
      .in("conversation_id",ids)
      .order("created_at",{ascending:true});
    if(msgErr)throw msgErr;

    const byAuth=new Map(Object.values(db.users).filter(u=>u.auth_id).map(u=>[String(u.auth_id),u.id]));

    for(const row of allRows){
      const isDm=(row.type||"dm")==="dm";
      const id=String(row.client_id||row.id);
      const hiddenSince=hiddenAt(id);
      const resetAt=conversationResetAt(id);

      // Never resurrect a conversation merely because it was fetched from the
      // server. A deleted-for-me conversation returns only when there is a NEW
      // incoming message after the deletion timestamp.
      const relevant=(msgs||[]).filter(m=>String(m.conversation_id)===String(row.id)).filter(m=>{
        if(!resetAt)return true;
        const created=m.created_at?new Date(m.created_at).getTime():Date.now();
        return created>=resetAt;
      }).map(m=>({
        id:String(m.id),
        user:rippleUserForAuth(m.sender_id)||"",
        senderAuthId:String(m.sender_id||""),
        text:messageTextValue(m),image:messageImageValue(m),audio:messageAudioValue(m),
        created:m.created_at?new Date(m.created_at).getTime():Date.now()
      }));

      const hasNewIncoming=hiddenSince>0 && relevant.some(m=>
        String(m.senderAuthId)!==String(onlineUser.id) && m.created>hiddenSince
      );
      if(hiddenSince>0 && !hasNewIncoming){
        db.chats=db.chats.filter(x=>String(x.id)!==id);
        continue;
      }
      if(hasNewIncoming)unhideConversation(id);

      let members=[];
      if(isDm && String(row.client_id||"").startsWith("dm_")){
        const raw=String(row.client_id).slice(3);
        const authIds=raw.split("_");
        members=authIds.map(a=>byAuth.get(String(a))).filter(Boolean);
        if(current&&!members.includes(current))members.push(current);
      }
      if(!members.length){
        const existing=db.chats.find(c=>String(c.id)===id);
        members=existing?.members?.length?existing.members:[current];
      }

      const normalized=[];
      const seenMessages=new Set();
      for(const m of relevant){
        // Older builds could insert the same message more than once with
        // different database IDs. Deduplicate by the actual message content
        // and timestamp as well as by ID.
        const fingerprint=messageFingerprint(m);
        const key=fingerprint||m.id;
        if(seenMessages.has(key))continue;
        seenMessages.add(key);
        normalized.push(m);
      }

      // Create the recipient's in-app message notification locally when a new
      // incoming message appears. This makes notification behavior resilient
      // even if the notifications table/realtime channel is delayed. The
      // message-id suffix keeps this from creating the same alert repeatedly.
      if(hiddenSince<=0){
        const incoming=normalized.filter(m=>String(m.senderAuthId)!==String(onlineUser.id));
        for(const m of incoming){
          const nlink=`chat:${id}#msg:${m.id}`;
          if(notificationDeleted(`msgnotif_${m.id}`,nlink))continue;
          if(db.notifications.some(n=>String(n.link||"")===nlink))continue;
          const sender=userBy(m.user)?.display||"Someone";
          const msgCreated=Number(m.created)||Date.now();
          const msgFresh=msgCreated>=notificationSessionStartedAt-2000;
          db.notifications.unshift({id:`msgnotif_${m.id}`,to:current,type:"message",text:`${sender} sent you a message.`,link:nlink,read:false,created:msgCreated,actor:m.user||null,fresh:msgFresh});
          if(msgFresh){
            if(state.view==="messages")toast(`${sender} sent you a message.`);
            sound();
          }
        }
      }

      const existing=db.chats.find(c=>String(c.id)===id);
      const chat=existing||{id,type:row.type||"dm",members:[],name:row.name||"",messages:[]};
      chat.id=id;
      chat.type=row.type||chat.type||"dm";
      chat.name=row.name||chat.name||"";
      chat.members=[...new Set(members)];
      // Supabase is the online source of truth. Replace the local message list
      // instead of appending, which prevents send -> realtime -> pull duplicates.
      chat.messages=normalized;

      const i=db.chats.findIndex(c=>String(c.id)===id);
      if(i>=0)db.chats[i]=chat;else db.chats.push(chat);
    }
    save();
  }catch(e){console.warn("Online chat sync failed",e);toast(e?.message||"Online messages could not be synced.")}
}
async function saveChatOnline(c,syncMessages=false){
  if(!onlineUser||!c)return;
  try{
    const onlineClientId=onlineChatClientId(c);
    if(!onlineClientId)throw new Error("The other user's online account is not ready yet. Refresh Ripple and try again.");
    if(c.type==='dm')c.id=onlineClientId;

    let conv=null;
    const {data:found,error:findErr}=await supabaseClient
      .from("conversations")
      .select("id,client_id")
      .eq("client_id",onlineClientId)
      .maybeSingle();
    if(findErr)throw findErr;
    if(found){
      conv=found;
    }else{
      const newId=crypto.randomUUID();
      const {error:insertErr}=await supabaseClient.from("conversations").insert({
        id:newId,client_id:onlineClientId,type:c.type||"dm",name:c.name||"",
        created_by:onlineUser.id,created_at:new Date(c.created||Date.now()).toISOString()
      });
      if(insertErr)throw insertErr;
      conv={id:newId,client_id:onlineClientId};
    }

    // RLS intentionally permits each user to create only their own membership.
    // The other participant will create their own membership when their device
    // discovers/opens this stable DM.
    const {error:memberErr}=await supabaseClient.from("conversation_members")
      .insert({conversation_id:conv.id,user_id:onlineUser.id});
    if(memberErr && !/duplicate key|already exists/i.test(memberErr.message||""))throw memberErr;

    // Only use this bulk path for chats that have not already been synced.
    // Individual new messages use sendMessageOnline below, avoiding duplicates.
    if(!(c.messages||[]).length)return;
    for(const m of c.messages){
      const sender=authUserIdForRipple(m.user);
      if(!sender)continue;
      const result=await insertOnlineMessageRow({
        conversation_id:conv.id,
        sender_id:sender,

async function sendMessageOnline(c,m){
  if(!onlineUser||!c||!m)return false;
  try{
    const onlineClientId=onlineChatClientId(c);
    if(!onlineClientId)throw new Error("The other user's online account is not ready yet. Refresh Ripple and try again.");
    if(c.type==='dm')c.id=onlineClientId;

    let conv=null;
    const {data:found,error:findErr}=await supabaseClient
      .from("conversations")
      .select("id,client_id")
      .eq("client_id",onlineClientId)
      .maybeSingle();
    if(findErr)throw new Error("Conversation lookup: "+findErr.message);
    if(found){
      conv=found;
    }else{
      const newId=crypto.randomUUID();
      const {error:insertErr}=await supabaseClient.from("conversations").insert({
        id:newId,client_id:onlineClientId,type:c.type||"dm",name:c.name||"",
        created_by:onlineUser.id,created_at:new Date(c.created||Date.now()).toISOString()
      });
      if(insertErr)throw new Error("Conversation: "+insertErr.message);
      conv={id:newId,client_id:onlineClientId};
    }

    // Only create this device's membership. The recipient's device will add
    // its own membership when it discovers the same stable DM.
    const {error:memberErr}=await supabaseClient.from("conversation_members")
      .insert({conversation_id:conv.id,user_id:onlineUser.id});
    if(memberErr && !/duplicate key|already exists/i.test(memberErr.message||"")){
      throw new Error("Add chat member: "+memberErr.message);
    }

    const result=await insertOnlineMessageRow({
      conversation_id:conv.id,
      sender_id:onlineUser.id,
      text:m.text||"",
      image:m.image||null,
      created_at:new Date(m.created||Date.now()).toISOString()
    },m.audio||null);
    if(!result.ok)throw new Error("Message: "+(result.error?.message||"could not be saved."));
    return true;
  }catch(e){console.warn("Online message failed",e);toast(e?.message||"Message could not be sent online.");return false}
}

async function migrateLocalChatsOnce(){
  if(!onlineUser||localStorage.getItem("ripple_chats_migrated_v2"))return;
  try{
    let allOk=true;
    for(const c of db.chats||[]){
      if(c.type!=="dm" && !(c.members||[]).some(id=>authUserIdForRipple(id)))continue;
      const before=c.id;
      const ok=await saveChatOnline(c,true);
      if(!ok)allOk=false;
      // saveChatOnline normalizes DM ids to the stable cross-device id.
      if(before!==c.id){
        const old=db.chats.find(x=>x!==c&&x.id===before);
        if(old)db.chats=db.chats.filter(x=>x!==old);
      }
    }
    save();
    if(allOk)localStorage.setItem("ripple_chats_migrated_v2","1");
    await pullOnlineChats();
  }catch(e){console.warn("Local chat migration failed",e)}
}

  try{

async function pullOnlineFollows(){
  if(!onlineUser)return;
  try{
    const {data,error}=await supabaseClient.from("follows").select("follower_id,following_id");
    if(error||!Array.isArray(data))return;
    // A zero-row result is NOT treated as proof that nobody is followed.
    // Supabase RLS can legally return an empty visible set. Merge confirmed
    // online rows into local state instead of clearing every relationship.
    if(data.length===0)return;
    const byProfile=new Map(Object.values(db.users).filter(u=>u.profile_id!=null).map(u=>[String(u.profile_id),u.id]));
    data.forEach(row=>{
      const follower=byProfile.get(String(row.follower_id));
      const following=byProfile.get(String(row.following_id));
      if(!follower||!following||follower===following)return;
      const fu=db.users[follower], tu=db.users[following];
      if(!fu||!tu)return;
      fu.following=fu.following||[];tu.followers=tu.followers||[];
      if(!fu.following.includes(following))fu.following.push(following);
      if(!tu.followers.includes(follower))tu.followers.push(follower);
    });
    save();
  }catch(e){console.warn("Online follow sync failed",e)}
}

function deletedPostKeys(){

function rememberDeletedPost(p){
  if(!p)return;
  const keys=deletedPostKeys();
  if(p.remote_id!=null)keys.add("remote:"+String(p.remote_id));
  keys.add("local:"+String(p.id));
  // Keep only a compact tombstone signature. Never let a full base64 image enter localStorage.
  keys.add("sig:"+[String(p.user),String(p.created||0),String(p.caption||"")].join("|"));
  const compact=[...keys].slice(-80);
  try{localStorage.setItem("ripple_deleted_post_keys_v1",JSON.stringify(compact))}
  catch(e){
    // localStorage may already be full because Ripple stores local media. A failed tombstone
    // must NEVER prevent the actual delete from completing.
    try{localStorage.removeItem("ripple_deleted_post_keys_v1")}catch{}
    window._rippleDeletedPostTombstones=window._rippleDeletedPostTombstones||new Set();
    compact.forEach(k=>window._rippleDeletedPostTombstones.add(String(k)));
  }
}
function isDeletedPostRemote(row){

  const caption=String(row?.caption??row?.text??row?.content??row?.body??row?.post_text??row?.description??"");
  const images=Array.isArray(row?.images)?row.images:[];
  const created=row?.created_at?new Date(row.created_at).getTime():0;
  const author=String(row?.author_id??"");
  return keys.has("sig:"+[author,String(created),caption,JSON.stringify(images)].join("|"));

async function pullOnlinePosts(){

    // schema first, then fall back to the older images/caption schema.
    let data=null,error=null,mode="modern";

      .select("id,author_id,content,image_url,repost_of,created_at")
      .order("created_at",{ascending:false});
    if(q.error){
      mode="legacy";
      q=await supabaseClient.from("posts")
        .select("id,author_id,images,caption,hashtags,repost_of_client_id,created_at")
        .order("created_at",{ascending:false});

    // Resolve both so every device can recognize posts from every account.
    const byAuthor=new Map();
    Object.values(db.users||{}).forEach(u=>{
      if(!u)return;
      const rid=String(u.id||u.username||"");
      if(!rid)return;
      if(u.profile_id!=null)byAuthor.set(String(u.profile_id),rid);
      if(u.auth_id!=null)byAuthor.set(String(u.auth_id),rid);
      if(u.username)byAuthor.set(String(u.username).toLowerCase(),rid);

        ||db.posts.find(x=>String(x.id)===localId);
      const post={

      if(i>=0)db.posts[i]={...db.posts[i],...post};else db.posts.push(post);

    });

  try{

    // because older Ripple schemas do not have that column.
    let remoteId=p.remote_id||null;

      const me=userBy(p.user);

    return;
  }

  // No local account/password match: now resolve a username through the online
  // directory, then use Supabase Auth's required email+password sign-in.
  const client=await rippleTimeout(ensureSupabase(),9000,"Ripple online services timed out").catch(()=>null);
  if(!client)return showErr("Ripple could not reach the online account service. Please try LOGIN again.");

  try{
    let email=un;
    if(!email.includes("@")){
      let lookedUpEmail=null;
      try{
        const rpc=await rippleTimeout(client.rpc("ripple_lookup_login_email",{p_username:un}),7000,"Username lookup timed out");
        if(!rpc.error&&typeof rpc.data==="string"&&rpc.data.includes("@"))lookedUpEmail=rpc.data;
        else if(!rpc.error&&Array.isArray(rpc.data)&&rpc.data[0]?.email)lookedUpEmail=rpc.data[0].email;
      }catch(e){console.warn("Ripple username RPC unavailable",e)}
      if(lookedUpEmail)email=String(lookedUpEmail).trim().toLowerCase();
      if(!email.includes("@")){
        try{
          const q=await rippleTimeout(client.from("profiles").select("username,email").eq("username",un).maybeSingle(),7000,"Profile lookup timed out");
          if(!q.error&&q.data?.email)email=String(q.data.email).trim().toLowerCase();
        }catch(e){console.warn("Ripple profile username lookup failed",e)}
      }
    }
    if(!email.includes("@"))return showErr("I found @"+un+", but its secure login email is not available to this browser. Log in once with the account email on this device, then username login will work here too.");

    const {data,error}=await rippleTimeout(client.auth.signInWithPassword({email,password:pw}),8000,"Online sign-in timed out");
    if(error)throw error;
    onlineUser=data.user;
    const uname=String(onlineUser.user_metadata?.username||un).toLowerCase();
    let u=db.users[uname]||findUser(un);
    if(!u){
      u={id:uname,username:uname,display:onlineUser.user_metadata?.display_name||uname,email:onlineUser.email||email,auth_id:onlineUser.id,followers:[],following:[],posts:[],badges:[],created:Date.now(),online:true,avatar:null,cover:null,theme:"sky",profile_text_color:"#ffffff"};
      db.users[uname]=u;
    }else{
      u.email=onlineUser.email||u.email||email;u.auth_id=onlineUser.id;u.online=true;
      if(!db.users[uname])db.users[uname]=u;
    }
    current=u.id||uname;rememberDeviceAccount(current);persistRippleCurrent(current);save();rememberLocalSession(current);
    try{await refreshOnlineDataAfterLogin();}catch(e){console.warn("Post-login data sync failed",e)}
    /* Server/Auth profile was just pulled; do not push a stale local copy back on login. */
    window.rippleAddingAccount=false;$("#authCancel").classList.add("hidden");
    $("#auth").style.display="none";$("#app").style.display="block";render();
    toast("Welcome back to Ripple!",4200);
  }catch(e){
    const msg=String(e?.message||"Invalid username or password.");
    console.error("Ripple login failed",e);
    if(/failed to fetch|network|fetch/i.test(msg))showErr("Ripple could not reach Supabase. Check your internet connection and try again.");
    else if(/email not confirmed/i.test(msg))showErr("This account's email is not confirmed yet. For Ripple testing, turn off Supabase email confirmation, then log in again.");
    else showErr(msg);
  }
}
async function refreshOnlineDataAfterLogin(){
  if(!onlineUser||!supabaseClient)return;
  // Sync in a safe order. None of these operations is allowed to erase local
  // users, follows, or posts just because an online query is partial/empty.
  try{await pullOnlineProfiles()}catch(e){console.warn("Post-login profile sync skipped",e)}
  try{await migrateLocalFollowsOnce()}catch(e){console.warn("Post-login follow migration skipped",e)}
  try{await pullOnlineFollows()}catch(e){console.warn("Post-login follow pull skipped",e)}
  try{await migrateLocalPostsOnce()}catch(e){console.warn("Post-login post migration skipped",e)}
  try{await pullOnlinePosts()}catch(e){console.warn("Post-login post pull skipped",e)}
  try{await migrateLocalLikesCommentsOnce()}catch(e){}
  try{await pullOnlineLikesComments()}catch(e){}
  save();
}

async function deletePost(id){
  const p=db.posts.find(x=>String(x.id)===String(id));
  if(!p||p.user!==current)return toast("You can only delete your own posts.");
  if(!confirm(p.repostOf!=null?"Remove this repost from your profile?":"Delete this post? This cannot be undone."))return;
  try{
    if(onlineUser){
      let remoteId=remotePostId(p);
      const me=user();

      // IMPORTANT: older/local posts may not have remote_id saved.
      // Do NOT require profile_id just to locate the row. The posts SELECT
      // policy lets authenticated users see rows, so match the actual post
      // by content/image/time and then delete by its real database id.
      if(remoteId==null){
        const wanted=String(p.caption||"").trim();
        const wantedImage=(Array.isArray(p.images)&&p.images.length)?String(p.images[0]):"";
        const created=Number(p.created||0);

        const q=await supabaseClient
          .from("posts")
          .select("id,author_id,content,image_url,created_at")
          .order("created_at",{ascending:false})
          .limit(200);

        if(q.error)throw q.error;

        let best=null,bestScore=-Infinity;
        for(const row of (q.data||[])){
          const rc=String(row.content??"").trim();
          const rt=row.created_at?new Date(row.created_at).getTime():0;
          const ri=row.image_url?String(row.image_url):"";
          const delta=(created&&rt)?Math.abs(rt-created):0;

          // Prefer exact content + image + nearest creation time.
          // A 30-minute window handles timezone/serialization differences.
          if(created&&rt&&delta>30*60*1000)continue;

          let score=0;
          if(rc===wanted)score+=100000;
          else if(wanted && rc.includes(wanted))score+=20000;
          if(ri===wantedImage)score+=50000;
          if(created&&rt)score+=Math.max(0,30000-Math.min(delta,30000));

          // If the post belongs to the current user's known profile,
          // strongly prefer that row, but don't require it.
          if(me?.profile_id!=null && String(row.author_id)===String(me.profile_id))score+=1000000;

          if(score>bestScore){bestScore=score;best=row;}
        }
        if(best?.id!=null && bestScore>0)remoteId=best.id;
      }

      if(remoteId==null){
        throw new Error("Ripple still could not find the online post. Refresh Ripple once and try deleting it again.");
      }

      const d=await supabaseClient.from("posts").delete().eq("id",String(remoteId));
      if(d.error)throw d.error;

      // Remember both IDs so the deleted row cannot come back during realtime sync.
      p.remote_id=remoteId;
      rememberDeletedPost(p);
    }else{
      rememberDeletedPost(p);
    }

    db.posts=db.posts.filter(x=>
      String(x.id)!==String(id) &&
      String(x.remote_id||"")!==String(p.remote_id||"__none__")
    );
    Object.values(db.users).forEach(u=>{
      u.posts=(u.posts||[]).filter(x=>String(x)!==String(id));
    });
    save();
    toast(p.repostOf!=null?"Repost removed from your profile.":"Post deleted.");
    render();
  }catch(e){
    console.error("Ripple delete failed",e);
    toast(e?.message||"Post could not be deleted.");
  }
}

function openPhotoViewer(postId,index=0){
  const images=photoViewerImages(postId);
  if(!images.length)return;
  photoViewerState={postId:String(postId),index:Math.max(0,Math.min(Number(index)||0,images.length-1)),images,touchX:0,touchY:0,touching:false};
  let el=document.getElementById("ripple-photo-viewer");
  if(!el){
    el=document.createElement("div");
    el.id="ripple-photo-viewer";
    el.innerHTML=`<div class="photo-viewer-backdrop" onclick="closePhotoViewer()"></div><div class="photo-viewer-stage" role="dialog" aria-modal="true" aria-label="Photo viewer"><button type="button" class="photo-viewer-close" onclick="closePhotoViewer()" aria-label="Close">×</button><button type="button" class="photo-viewer-prev" onclick="photoViewerStep(-1)" aria-label="Previous photo">‹</button><img id="ripple-photo-viewer-img" class="photo-viewer-img" alt="Expanded photo"><button type="button" class="photo-viewer-next" onclick="photoViewerStep(1)" aria-label="Next photo">›</button><div id="ripple-photo-viewer-count" class="photo-viewer-count"></div></div>`;
    document.body.appendChild(el);
    el.addEventListener("touchstart",e=>{
      const t=e.touches?.[0]; if(!t)return;
      photoViewerState.touching=true; photoViewerState.touchX=t.clientX; photoViewerState.touchY=t.clientY;
    },{passive:true});
    el.addEventListener("touchend",e=>{
      if(!photoViewerState.touching)return;
      const t=e.changedTouches?.[0]; photoViewerState.touching=false;
      if(!t)return;
      const dx=t.clientX-photoViewerState.touchX,dy=t.clientY-photoViewerState.touchY;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))photoViewerStep(dx<0?1:-1);
    },{passive:true});
  }
  el.classList.add("open");
  document.body.classList.add("photo-viewer-open");
  renderPhotoViewer();
}
function renderPhotoViewer(){
  const el=document.getElementById("ripple-photo-viewer");
  const img=document.getElementById("ripple-photo-viewer-img");
  const count=document.getElementById("ripple-photo-viewer-count");
  if(!el||!img)return;
  const images=photoViewerState.images||[];
  const i=photoViewerState.index||0;
  if(!images.length){closePhotoViewer();return;}
  img.src=images[i];
  img.alt=`Photo ${i+1} of ${images.length}`;
  count.textContent=images.length>1?`${i+1} / ${images.length}`:"";
  el.querySelector(".photo-viewer-prev").style.display=images.length>1?"grid":"none";
  el.querySelector(".photo-viewer-next").style.display=images.length>1?"grid":"none";
}
function photoViewerStep(delta){
  const n=(photoViewerState.images||[]).length;
  if(n<2)return;
  photoViewerState.index=(photoViewerState.index+delta+n)%n;
  renderPhotoViewer();
}
function closePhotoViewer(){
  const el=document.getElementById("ripple-photo-viewer");
  if(el)el.classList.remove("open");
  document.body.classList.remove("photo-viewer-open");
  photoViewerState={postId:null,index:0,images:[],touchX:0,touchY:0,touching:false};
}
document.addEventListener("keydown",e=>{
  const el=document.getElementById("ripple-photo-viewer");
  if(!el?.classList.contains("open"))return;
  if(e.key==="Escape")closePhotoViewer();
  else if(e.key==="ArrowLeft")photoViewerStep(-1);
  else if(e.key==="ArrowRight")photoViewerStep(1);
});

function bindPosts(){
  document.querySelectorAll(".carousel").forEach(carousel=>{
    const track=carousel.querySelector(".carousel-track");
    if(!track||track.dataset.bound==="1")return;
    track.dataset.bound="1";
    const update=()=>{
      const width=track.clientWidth||1;
      const index=Math.max(0,Math.min(track.children.length-1,Math.round(track.scrollLeft/width)));
      carousel.dataset.index=String(index);
      carousel.querySelectorAll(".carousel-dot").forEach((dot,i)=>dot.classList.toggle("active",i===index));
    };

    // Native horizontal scrolling is the primary swipe mechanism. The small
    // touch fallback below only takes over after a clearly horizontal drag,
    // so vertical page scrolling still works normally.
    let drag=null;
    const begin=(id,x,y)=>{
      drag={id,startX:x,startY:y,startScroll:track.scrollLeft,moved:false,horizontal:false};
      track.classList.add("dragging");
    };
    const move=(id,x,y,e)=>{
      if(!drag||id!==drag.id)return;
      const dx=x-drag.startX,dy=y-drag.startY;
      if(!drag.horizontal){
        if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
        if(Math.abs(dx)<=Math.abs(dy)){ drag=null; track.classList.remove("dragging"); return; }
        drag.horizontal=true;
      }
      if(drag.horizontal){
        e?.preventDefault?.();
        drag.moved=true;
        track.scrollLeft=drag.startScroll-dx;
        update();
      }
    };
    const finish=(id,x)=>{
      if(!drag||id!==drag.id)return;
      const width=track.clientWidth||1;
      const dx=x-drag.startX;
      const current=Math.round(track.scrollLeft/width);
      const threshold=Math.max(35,width*0.10);
      let target=current;
      if(drag.horizontal&&Math.abs(dx)>=threshold) target=dx<0?current+1:current-1;
      target=Math.max(0,Math.min(track.children.length-1,target));
      drag=null;
      track.classList.remove("dragging");
      track.scrollTo({left:target*width,behavior:"smooth"});
      update();
    };

    // Pointer Events (modern Android/browser support).
    track.addEventListener("pointerdown",e=>{
      if(e.pointerType!=="touch"&&e.pointerType!=="pen")return;
      begin(e.pointerId,e.clientX,e.clientY);
    });
    track.addEventListener("pointermove",e=>move(e.pointerId,e.clientX,e.clientY,e),{passive:false});
    track.addEventListener("pointerup",e=>finish(e.pointerId,e.clientX));
    track.addEventListener("pointercancel",e=>finish(e.pointerId,e.clientX));

    // Touch fallback for WebViews/browsers where pointer events are unreliable.
    track.addEventListener("touchstart",e=>{
      const t=e.touches[0];
      if(t)begin("touch",t.clientX,t.clientY);
    },{passive:true});
    track.addEventListener("touchmove",e=>{
      if(!drag)return;
      const t=e.touches[0];
      if(t)move("touch",t.clientX,t.clientY,e);
    },{passive:false});
    track.addEventListener("touchend",e=>{
      const t=e.changedTouches[0];
      if(t)finish("touch",t.clientX);
    },{passive:true});
    track.addEventListener("touchcancel",()=>{
      if(drag){drag=null;track.classList.remove("dragging");}
    },{passive:true});

    track.addEventListener("scroll",update,{passive:true});
    requestAnimationFrame(update);
  });
}

async function openFollowedChat(id){
  if(!id||id===current)return;
  // Make sure the target's auth_id is available before deriving the shared DM ID.
  if(onlineUser&&!authUserIdForRipple(id)){
    await pullOnlineProfiles();
  }
  const target=userBy(id);
  if(!target)return toast("That Ripple account could not be found.");
  const stableId=onlineUser&&target.auth_id?stableDmClientId(onlineUser.id,target.auth_id):null;
  // Explicitly starting a chat is allowed to reopen a conversation that was
  // previously deleted-for-me. Background sync still keeps deleted chats hidden.
  if(stableId && isConversationHidden(stableId)){
    // Starting a chat again after deleting it creates a fresh local view of
    // the shared DM. The old server messages stay intact for the other person,
    // but this device won't pull the old history back into the new view.
    unhideConversation(stableId);
    resetConversationView(stableId);
  }
  let c=db.chats.find(x=>x.type==="dm"&&x.members.includes(current)&&x.members.includes(id)&&!isConversationHidden(x.id));
  if(c&&stableId&&c.id!==stableId){
    const oldId=c.id;
    c.id=stableId;
    const duplicate=db.chats.find(x=>x!==c&&x.type==="dm"&&x.id===stableId);
    if(duplicate){
      duplicate.messages=[...(duplicate.messages||[]),...(c.messages||[])].sort((a,b)=>a.created-b.created);
      db.chats=db.chats.filter(x=>x!==c);
      c=duplicate;
    }
    save();
  }
  if(!c){
    c={id:stableId||uid("chat"),type:"dm",members:[current,id],name:"",messages:[],created:Date.now()};
    db.chats.push(c);save();
  }
  state.chat=c.id;messages();
  if(onlineUser){
    const ok=await saveChatOnline(c);
    if(ok!==false)await pullOnlineChats();
    state.chat=c.id;
    messages();
  }
}
function messageFingerprint(m){
  if(!m)return "";
  return [String(m.senderAuthId||m.user||""),String(m.created||""),String(m.text||""),String(m.image||""),String(m.audio||"")].join("|");
}
function messageRowsHTML(c){
  const unique=[]; const seen=new Set();
  (c.messages||[]).forEach(m=>{
    if(!m.senderAuthId&&m.user===current&&onlineUser)m.senderAuthId=onlineUser.id;
    const key=String(m.id||`${m.senderAuthId||m.user}|${m.created}|${m.text||""}|${m.image||""}|${m.audio||""}`);
    if(seen.has(key))return; seen.add(key); unique.push(m);
  });
  c.messages=unique;
  return c.messages.map(m=>{
    const mine=(m.senderAuthId&&onlineUser&&String(m.senderAuthId)===String(onlineUser.id))||(m.user===current);
    return `<div class="bubble ${mine?"mine":""}">${m.image?`<img src="${m.image}" style="max-width:220px;max-height:260px">`:""}${m.text?`<div>${esc(m.text)}</div>`:""}${m.audio?`<audio controls src="${m.audio}"></audio>`:""}<div class="meta">${time(m.created)}</div></div>`;
  }).join("")||`<div class="empty">Start the conversation.</div>`;
}
let __typingTimer=null;
let __typingLast=0;
const __typingState={};
function currentChatStableId(){
  const c=db.chats.find(x=>x.id===state.chat);
  if(!c)return null;
  if(c.type==='dm'&&onlineUser){
    const otherId=(c.members||[]).find(x=>x!==current);
    const other=userBy(otherId);
    if(other?.auth_id)return stableDmClientId(onlineUser.id,other.auth_id);
  }
  return String(c.id);
}
function updateTypingIndicator(chatId){
  const el=document.getElementById('typingIndicator');
  if(!el)return;
  const entries=Object.values(__typingState).filter(x=>x&&x.chatId===String(chatId)&&x.until>Date.now());
  if(!entries.length){el.textContent='';return;}
  const names=[...new Set(entries.map(x=>x.name||'Someone'))];
  el.textContent=names.length===1?`${names[0]} is typing…`:`${names.join(', ')} are typing…`;
}
function receiveTyping(payload){
  if(!payload||!onlineUser||String(payload.userId)===String(onlineUser.id))return;
  const chatId=String(payload.chatId||'');
  if(!chatId)return;
  if(payload.typing){
    __typingState[String(payload.userId)]={chatId,name:payload.name||'Someone',until:Date.now()+2200};
  }else{
    delete __typingState[String(payload.userId)];
  }
  if(state.view==='messages'&&currentChatStableId()===chatId)updateTypingIndicator(chatId);
}
function typingPulse(){
  if(!onlineUser||!state.chat)return;
  const input=document.getElementById('msgInput');
  const chatId=currentChatStableId();
  if(!input||!chatId)return;
  const now=Date.now();
  if(now-__typingLast<350)return;
  __typingLast=now;
  const channel=window.__rippleRealtime;
  if(channel){
    channel.send({type:'broadcast',event:'typing',payload:{chatId,userId:onlineUser.id,name:user().display,typing:true}}).catch(()=>{});
  }
  clearTimeout(__typingTimer);
  __typingTimer=setTimeout(()=>{
    const ch=window.__rippleRealtime;
    if(ch)ch.send({type:'broadcast',event:'typing',payload:{chatId,userId:onlineUser.id,name:user().display,typing:false}}).catch(()=>{});
  },1800);
}
function stopTyping(){
  clearTimeout(__typingTimer);__typingTimer=null;
  if(!onlineUser)return;
  const chatId=currentChatStableId();if(!chatId)return;
  const channel=window.__rippleRealtime;
  if(channel)channel.send({type:'broadcast',event:'typing',payload:{chatId,userId:onlineUser.id,name:user().display,typing:false}}).catch(()=>{});
}

  return `<div class="chat-header"><div class="chat-title"><b>${esc(c.name||c.members.map(x=>userBy(x)?.display).join(", "))}</b></div><button class="retro-btn danger" onclick="deleteConversation('${c.id}')">DELETE</button></div><div class="messages" id="messages">${messageRowsHTML(c)}</div><div class="typing-indicator" id="typingIndicator"></div><div class="chatinput"><input id="msgPhoto" type="file" accept="image/*" class="hidden" onchange="sendSelectedMessagePhoto(this)"><button class="retro-btn" type="button" onclick="document.getElementById('msgPhoto').click()">PHOTO</button><button class="retro-btn" onclick="recordVoice()">VOICE</button><input id="msgInput" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="Write a message…" oninput="typingPulse()" onblur="stopTyping()" onkeydown="if(event.key==='Enter'){event.preventDefault();sendMessage()}"><button class="retro-btn" onclick="sendMessage()">SEND</button></div>`}
function deleteConversation(id){
  const c=db.chats.find(x=>String(x.id)===String(id));
  if(!c)return;
  const other=(c.members||[]).filter(x=>x!==current).map(userBy).filter(Boolean)[0];
  const label=c.type==='group'?(c.name||'this group'):(other?.display||'this conversation');
  if(!confirm(`Delete ${label} from your Messages?\n\nThis only removes it for you. The other person will still have the conversation and its messages.`))return;
  hideConversation(id);
  db.chats=db.chats.filter(x=>String(x.id)!==String(id));
  if(state.chat===id)state.chat=null;
  save();
  messages();
  toast('Conversation deleted for you.');
}
async function sendSelectedMessagePhoto(input){const image=await fileData(input);if(!image)return;input.value="";await sendMessage(image)}
let __sendingMessage=false;
async function sendMessage(image=null){
  stopTyping();
  if(__sendingMessage)return;
  const c=db.chats.find(x=>x.id===state.chat),input=$("#msgInput"),t=input?.value.trim();
  if(!c||(!t&&!image))return;
  __sendingMessage=true;
  const oldText=input?.value||"";
  const m={id:uid("m"),user:current,senderAuthId:onlineUser?.id||"",text:t||"",image:image||null,created:Date.now()};

  // Render the message immediately so the SEND button never appears dead.
  // Supabase remains the source of truth; after a successful write we replace
  // this optimistic copy with the authoritative server rows.
  c.messages=[...(c.messages||[]),m];
  if(input)input.value="";
  save();
  messages();

  try{
    if(onlineUser){
      const ok=await sendMessageOnline(c,m);
      if(!ok){
        c.messages=(c.messages||[]).filter(x=>x.id!==m.id);
        if(input)input.value=oldText;
        save();
        messages();
        return;
      }
      // Keep the optimistic copy visible immediately. A background sync will
      // reconcile it with the server without making a successful send appear
      // to vanish during a transient read/realtime delay.
      setTimeout(()=>{if(onlineUser)pullOnlineChats().then(()=>{if(state.view==="messages")messages()}).catch(()=>{})},350);
    }

    for(const to of c.members.filter(x=>x!==current)){
      await notify(to,"message",`${user().display} sent you a message.`,`chat:${c.id}#msg:${m.id}`);
    }
    save();
    messages();
  }finally{
    __sendingMessage=false;
  }
}
async function recordVoice(){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(s);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let r=new FileReader();r.onload=async()=>{let c=db.chats.find(x=>x.id===state.chat);if(!c)return;let m={id:uid("m"),user:current,senderAuthId:onlineUser?.id||"",text:"",audio:r.result,created:Date.now()};if(onlineUser){const ok=await sendMessageOnline(c,m);if(!ok){messages();return}}c.messages.push(m);save();for(const to of c.members.filter(x=>x!==current))await notify(to,"message",`${user().display} sent you a voice message.`,"chat:"+c.id);save();messages()};r.readAsDataURL(new Blob(chunks,{type:"audio/webm"}));s.getTracks().forEach(t=>t.stop())};recorder.start();toast("Recording… press VOICE again to stop");setTimeout(()=>{if(recorder?.state==="recording")recorder.stop()},15000)}catch{toast("Microphone permission was denied or unavailable.")}}

async function newGroup(){let others=Object.values(db.users).filter(x=>x.id!==current);if(!others.length)return toast("You need other Ripple accounts first.");let name=prompt("Group name?","Ripple Crew");if(!name)return;let selected=others.filter(x=>confirm(`Add ${x.display}?`)).map(x=>x.id);if(!selected.length)return;let c={id:uid("chat"),type:"group",members:[current,...selected],name:name.trim(),messages:[],created:Date.now()};db.chats.push(c);save();if(onlineUser){await saveChatOnline(c);await pullOnlineChats()}state.chat=c.id;messages()}

async function markNotificationRead(id){
  const n=db.notifications.find(x=>String(x.id)===String(id)&&x.to===current);
  if(!n)return;
  n.read=true;
  save();
  if(onlineUser){
    try{
      const q=supabaseClient.from("notifications").update({read:true}).eq("recipient_id",onlineUser.id);
      const {error}=await q.eq("client_id",String(n.id));
      if(error)throw error;
    }catch(e){console.warn("Notification read sync failed",e)}
  }
  renderNav();
  notifications();
}
async function markAllNotificationsRead(){
  const ns=db.notifications.filter(n=>n.to===current&&!n.read);
  if(!ns.length)return toast("No unread notifications.");
  ns.forEach(n=>n.read=true);
  save();
  if(onlineUser){
    try{
      const {error}=await supabaseClient.from("notifications").update({read:true}).eq("recipient_id",onlineUser.id).eq("read",false);
      if(error)throw error;
    }catch(e){
      console.warn("Notification read sync failed",e);
      toast(e?.message||"Could not sync read status.");
    }
  }
  render();
  toast("All notifications marked as read.");
}
async function deleteNotification(id){
  const idx=db.notifications.findIndex(x=>String(x.id)===String(id)&&x.to===current);
  if(idx<0)return;
  const n=db.notifications[idx];
  db.notifications.splice(idx,1);
  rememberDeletedNotification(n.id,n.link);
  if(onlineUser){
    try{
      let q=supabaseClient.from("notifications").delete().eq("recipient_id",onlineUser.id);
      if(n.id&&!String(n.id).startsWith("n_"))q=q.eq("id",String(n.id));
      else if(n.link)q=q.eq("link",String(n.link));
      else q=null;
      if(q){const {error}=await q;if(error)throw error;}
    }catch(e){console.warn("Notification delete sync failed",e)}
  }
  renderNav();
  notifications();
}

function rippleRgbToHex(rgb){return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function rippleBannerColors(hex){const rgb=rippleHexToRgb(hex)||[6,60,140];const dark=rippleRgbToHex(rgb.map(v=>v*.72));const light=rippleRgbToHex(rgb.map(v=>v+(255-v)*.22));return {dark,light};}

    }
  }catch(e){console.warn("Initial session restore failed",e)}

    // overwrite the profile that was just saved on another device.
    try{const fresh=await supabaseClient.auth.getUser();if(!fresh.error&&fresh.data&&fresh.data.user)onlineUser=fresh.data.user}catch(e){console.warn('Startup Auth refresh skipped',e)}
    await pullOnlineProfiles();
    await migrateLocalFollowsOnce();
    await pullOnlineFollows();
    await migrateLocalPostsOnce();
    await pullOnlinePosts();
    await migrateLocalLikesCommentsOnce();
    await pullOnlineLikesComments();
    await migrateLocalChatsOnce();
    await pullOnlineChats();
    await pullOnlineNotifications();
    await setupRippleRealtime();
    // Realtime is fast when available, but mobile browsers can suspend or
    // drop realtime sockets. A light polling fallback keeps DMs and alerts
    // moving between devices instead of waiting indefinitely.
    if(!window.__rippleChatPoll){
      window.__rippleChatPoll=setInterval(async()=>{
        if(!onlineUser)return;
        await pullOnlineChats();
        await pullOnlineNotifications();
        if(state.view==="messages")messages();
      },2500);
    }
    // Mobile browsers can suspend Supabase Realtime sockets. Keep the public
    // directory and public posts fresh with a lightweight 2.5s fallback so a
    // newly created account on another device does not stay hidden until a
    // manual refresh.
    if(!window.__rippleDirectoryPoll){
      window.__rippleDirectoryPoll=setInterval(async()=>{
        if(!onlineUser)return;
        if(!window.__rippleProfileEditActive && !window.__rippleProfileSavePending) await pullOnlineProfiles();
        await pullOnlinePosts();
        renderBars();
        if(state.view==="explore" && document.activeElement?.id!=="exploreInput")explore();
      },2500);
    }
  }else if(!onlineUser && sessionRestored){
    // Do not log out a locally remembered Ripple account merely because the
    // browser has no usable Supabase session on this refresh. Explicit LOG OUT
    // is the only normal path that clears ripple_current.
  }
  // If the local account is still valid, keep the app open even when Supabase
  // is temporarily unavailable. Local login remains a supported fallback.
  if(current && db.users[current] && !recoveryMode){
    $("#auth").style.display="none";
    $("#app").style.display="block";
  }
  applyDark();
  if(!recoveryMode)boot();
})();

</script>

<script>
/* ===== RIPPLE v64 FEATURE PATCH ===== */

function rippleMetaEncode(p){
  const meta={mood:p.mood||"",tagged_users:Array.isArray(p.tagged_users)?p.tagged_users:[]};
  try{return String(p.caption||"")+"\n[[RIPPLE_META:"+btoa(unescape(encodeURIComponent(JSON.stringify(meta))))+"]]"}catch{return String(p.caption||"")}
}
function rippleMetaDecode(raw){
  const s=String(raw||""); const m=s.match(/\n?\[\[RIPPLE_META:([^\]]+)\]\]\s*$/);
  if(!m)return {caption:s,mood:"",tagged_users:[]};
  try{const meta=JSON.parse(decodeURIComponent(escape(atob(m[1]))));return {caption:s.slice(0,m.index).trimEnd(),mood:meta.mood||"",tagged_users:Array.isArray(meta.tagged_users)?meta.tagged_users:[]}}catch{return {caption:s,mood:"",tagged_users:[]}}
}

const INTEREST_OPTIONS=["Music","Movies","Gaming","Art","Drawing","Photography","Reading","Writing","Fashion","Cooking","Baking","Travel","Nature","Animals","Sports","Fitness","Technology","Coding","Anime","K-pop","J-pop","Rock","Shoegaze","Hip-hop","Indie","Horror","Comedy","Science","History","Cars","Guitar","Singing","Dance","Poetry","Skateboarding"];
function parseInterests(v){return String(v||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,20)}
function interestChips(v){const a=parseInterests(v);return a.length?`<div class="profile-interest-chips">${a.map(x=>`<span class="profile-interest-chip">${esc(x)}</span>`).join("")}</div>`:"<span>Not added yet.</span>"}
function selectedMoodLabel(m){const moods={happy:"😊 happy",sad:"😢 sad",excited:"🤩 excited",grateful:"🥹 grateful",loved:"🥰 loved",tired:"😴 tired",angry:"😤 angry",calm:"😌 calm",nostalgic:"🥲 nostalgic",silly:"😜 silly",creative:"🎨 creative",motivated:"🔥 motivated"};return moods[m]||""}
function moodOptions(selected){const moods=[['','No mood'],['happy','😊 Happy'],['sad','😢 Sad'],['excited','🤩 Excited'],['grateful','🥹 Grateful'],['loved','🥰 Loved'],['tired','😴 Tired'],['angry','😤 Angry'],['calm','😌 Calm'],['nostalgic','🥲 Nostalgic'],['silly','😜 Silly'],['creative','🎨 Creative'],['motivated','🔥 Motivated']];return moods.map(x=>`<option value="${x[0]}" ${x[0]===selected?'selected':''}>${x[1]}</option>`).join('')}
function getTaggedUsers(v){return String(v||"").split(",").map(x=>x.trim().replace(/^@/,"").toLowerCase()).filter(Boolean).map(un=>findUser(un)?.id).filter(Boolean)}
function taggedNames(ids){return (ids||[]).map(id=>userBy(id)).filter(Boolean)}

/* Comments: open the full section and rank by reactions. */
function commentScore(c){return Number(c.likes?.length||0)+Number(c.ripples?.length||0)}
function sortedComments(comments){return [...(comments||[])].sort((a,b)=>commentScore(b)-commentScore(a)||Number(b.created||0)-Number(a.created||0))}
async function toggleCommentReaction(postId,commentId,type){
  const p=db.posts.find(x=>String(x.id)===String(postId)); if(!p)return;
  const c=(p.comments||[]).find(x=>String(x.id)===String(commentId)); if(!c)return;
  const key=type==='ripple'?'ripples':'likes'; c[key]=c[key]||[];
  const i=c[key].indexOf(current); if(i>=0)c[key].splice(i,1); else c[key].push(current);
  save(); openComments(postId);
}
function openComments(id){
  const p=db.posts.find(x=>String(x.id)===String(id)); if(!p)return;
  const comments=sortedComments(p.comments||[]);
  $('#modalRoot').innerHTML=`<div class="modal"><div class="window comment-window"><div class="titlebar">COMMENTS (${comments.length}) <button class="link" style="color:#fff;margin-left:auto" onclick="closeModal()">CLOSE</button></div><div class="panel-body"><div class="comment-modal-list">${comments.length?comments.map((c,i)=>{const who=userBy(c.user),score=commentScore(c);return `<div class="full-comment ${i===0&&score>0?'top-comment':''}"><div class="comment-rank">${i===0&&score>0?'★ TOP COMMENT · ':''}${score} reaction${score===1?'':'s'}</div><button class="link" onclick="closeModal();go('profile','${c.user}')"><b>${esc(who?.display||c.user)}</b></button> <span class="meta">${time(c.created)}</span><div style="margin-top:5px">${esc(c.text)}</div><div class="comment-actions"><button class="${c.likes?.includes(current)?'active':''}" onclick="toggleCommentReaction('${p.id}','${c.id}','like')">♥ ${c.likes?.length||0}</button><button class="${c.ripples?.includes(current)?'active':''}" onclick="toggleCommentReaction('${p.id}','${c.id}','ripple')">🌊 ${c.ripples?.length||0}</button></div></div>`}).join(''):`<div class="empty">No comments yet.</div>`}</div><div style="display:flex;gap:6px;margin-top:12px"><input id="full-comment-${p.id}" style="flex:1;padding:8px" placeholder="Write a comment…"><button class="retro-btn" onclick="commentFromModal('${p.id}')">POST</button></div></div></div></div>`;
}
function commentFromModal(id){const inp=$('#full-comment-'+id);const text=inp?.value.trim();if(!text)return;const p=db.posts.find(x=>String(x.id)===String(id));if(!p)return;p.comments=p.comments||[];p.comments.push({id:uid('comment'),user:current,text,created:Date.now(),likes:[],ripples:[]});notify(p.user,'comment',`${user().display} commented on your post.`,`comment:${id}:${current}:${Date.now()}`);save();openComments(id);render();}

/* Replace the old comment renderer with a ranked preview. */
const __rippleOldPostHTML=postHTML;
postHTML=function(p){
  const html=__rippleOldPostHTML(p);
  const comments=p.comments||[];
  const ranked=sortedComments(comments);
  const preview=ranked.slice(0,3).map(c=>`<div class="comment"><button class="link" onclick="go('profile','${c.user}')"><b>${esc(userBy(c.user)?.display||c.user)}</b></button> ${esc(c.text)} <span class="meta">${time(c.created)}</span></div>`).join('');
  const replacement=`<div class="comments">${preview}${comments.length>3?`<button class="link" onclick="openComments('${p.id}')">View all ${comments.length} comments</button>`:''}<div style="display:flex;gap:5px"><input id="comment-${p.id}" style="flex:1;padding:7px;border:1px solid #9aa" placeholder="Write a comment…"><button class="retro-btn" onclick="comment('${p.id}')">POST</button></div></div>`;
  return html.replace(/<div class="comments">[\s\S]*?<\/div><\/article>$/,replacement+'</article>');
};

/* Add mood/tags to the post header/caption without changing the existing layout. */
const __ripplePostHTMLBase=postHTML;
postHTML=function(p){
  let html=__ripplePostHTMLBase(p);
  const mood=p.mood?selectedMoodLabel(p.mood):'';
  const tags=taggedNames(p.tagged_users||[]);
  const extra=(mood?`<div class="post-mood">${esc(userBy(p.user)?.display||'Someone')} is feeling ${esc(mood)}</div>`:'')+(tags.length?`<div class="post-tags">${tags.map(t=>`<span class="post-tag">@${esc(t.username)}</span>`).join(' ')}</div>`:'');
  if(extra)html=html.replace('</div><div class="actions">',extra+'</div><div class="actions">');
  return html;
};

/* Create editor: borders + sticker + city-style filters + mood + tags. */
window._editSettings=window._editSettings||{border:'plain',filter:'normal',sticker:'none'};
function create(){
  let drafts=window._drafts||[], e=window._editSettings;
  $('#view').innerHTML=`<div class="window"><div class="titlebar">CREATE — NEW POST</div><div class="create-body"><p>Select images, then customize their look before publishing.</p><input id="postFiles" type="file" accept="image/*" multiple> <button class="retro-btn" onclick="cameraCapture('post')">USE CAMERA</button> <button type="button" class="retro-btn" onclick="openDrawingStudio();return false;">✎ DRAW</button>
  <div class="preview-grid" id="postPreview">${drafts.map((x,i)=>`<div class="preview"><img src="${x}"><button onclick="removeDraft(${i})">×</button><br><button class="retro-btn" onclick="moveDraft(${i},-1)">←</button><button class="retro-btn" onclick="moveDraft(${i},1)">→</button></div>`).join('')}</div>
  <div class="create-editor"><b>PHOTO EDITOR</b><div class="create-editor-grid"><div><label>Border</label><select id="postBorder"><option value="plain">Plain</option><option value="gingham">Gingham</option><option value="dotted">Dotted</option><option value="checker">Checker</option></select></div><div><label>Effect</label><select id="postFilter"><option value="normal">Normal</option><option value="rio">Rio-style</option><option value="cairo">Cairo-style</option><option value="tokyo">Tokyo-style</option><option value="vintage">Vintage</option><option value="dreamy">Dreamy</option></select></div><div><label>Sticker</label><select id="postSticker"><option value="none">None</option><option value="🌊">🌊 Ripple</option><option value="⭐">⭐ Star</option><option value="🦋">🦋 Butterfly</option><option value="☁️">☁️ Cloud</option><option value="🎧">🎧 Headphones</option><option value="💿">💿 Record</option><option value="🌸">🌸 Flower</option></select></div></div><button class="retro-btn" type="button" onclick="previewPhotoEdit()">PREVIEW EDIT</button></div>
  <div class="field"><label>Mood</label><select id="postMood">${moodOptions(window._postMood||'')}</select></div>
  <div class="field"><label>Tag people</label><input id="postTags" value="${esc(window._postTags||'')}" placeholder="username, another_username"></div>
  <div class="field"><label>Caption</label><textarea id="postCaption" rows="5" placeholder="What's rippling? #ripple">${window._caption||''}</textarea></div>
  <div class="field"><label>Preview / upload progress</label><div class="progress"><i id="postProgress"></i></div></div><button class="retro-btn" onclick="publishPost()">PUBLISH</button></div></div>`;
  $('#postFiles').onchange=e=>readImages(e.target.files);$('#postCaption').oninput=e=>window._caption=e.target.value;$('#postMood').onchange=e=>window._postMood=e.target.value;$('#postTags').oninput=e=>window._postTags=e.target.value;$('#postBorder').value=e.border;$('#postFilter').value=e.filter;$('#postSticker').value=e.sticker;
  $('#postBorder').onchange=e=>window._editSettings.border=e.target.value;$('#postFilter').onchange=e=>window._editSettings.filter=e.target.value;$('#postSticker').onchange=e=>window._editSettings.sticker=e.target.value;
}
function previewPhotoEdit(){const src=(window._drafts||[])[0];if(!src)return toast('Add a photo first.');const e=window._editSettings;$('#modalRoot').innerHTML=`<div class="modal"><div class="window"><div class="titlebar">PHOTO PREVIEW <button class="link" style="color:#fff;margin-left:auto" onclick="closeModal()">CLOSE</button></div><div class="panel-body"><div class="editor-preview-wrap"><img id="editorPreview" class="editor-preview" src="${src}"></div><p class="meta">This preview uses your selected border, effect and sticker.</p></div></div></div>`;applyPreviewCss();}
function applyPreviewCss(){const img=$('#editorPreview');if(!img)return;const e=window._editSettings;let f='none';if(e.filter==='rio')f='saturate(1.35) contrast(1.08) hue-rotate(-8deg)';if(e.filter==='cairo')f='sepia(.12) saturate(1.12) brightness(1.05)';if(e.filter==='tokyo')f='grayscale(1) contrast(1.12)';if(e.filter==='vintage')f='sepia(.28) contrast(1.05) saturate(.85)';if(e.filter==='dreamy')f='brightness(1.08) saturate(.85) contrast(.95)';img.style.filter=f;img.style.padding=e.border==='plain'?'8px':'14px';img.style.background=e.border==='gingham'?'repeating-linear-gradient(45deg,#d9d0b0 0 5px,#f2ead1 5px 10px)':e.border==='dotted'?'radial-gradient(#222 1px,transparent 1px) 0 0/8px 8px':e.border==='checker'?'repeating-conic-gradient(#222 0 25%,#eee 0 50%) 50%/12px 12px':'#fff';img.dataset.sticker=e.sticker||'none';}

/* Render a selected photo edit permanently into the image data before upload. */
async function processImageData(src,e){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const pad=e.border==='plain'?10:22,w=im.naturalWidth||800,h=im.naturalHeight||600,c=document.createElement('canvas');c.width=w+pad*2;c.height=h+pad*2;const x=c.getContext('2d');
  if(e.border==='gingham'){x.fillStyle='#e8dec2';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(70,50,40,.22)';x.lineWidth=12;for(let i=-c.height;i<c.width;i+=24){x.beginPath();x.moveTo(i,0);x.lineTo(i+c.height,c.height);x.stroke();x.beginPath();x.moveTo(i,c.height);x.lineTo(i+c.height,0);x.stroke();}}
  else if(e.border==='dotted'){x.fillStyle='#f4f4f4';x.fillRect(0,0,c.width,c.height);x.fillStyle='#555';for(let yy=5;yy<c.height;yy+=16)for(let xx=5;xx<c.width;xx+=16)x.beginPath(),x.arc(xx,yy,1.4,0,Math.PI*2),x.fill();}
  else if(e.border==='checker'){for(let yy=0;yy<c.height;yy+=20)for(let xx=0;xx<c.width;xx+=20){x.fillStyle=((xx/20+yy/20)%2)?'#222':'#eee';x.fillRect(xx,yy,20,20)}}
  else{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  let f='none';if(e.filter==='rio')f='saturate(1.35) contrast(1.08) hue-rotate(-8deg)';if(e.filter==='cairo')f='sepia(.12) saturate(1.12) brightness(1.05)';if(e.filter==='tokyo')f='grayscale(1) contrast(1.12)';if(e.filter==='vintage')f='sepia(.28) contrast(1.05) saturate(.85)';if(e.filter==='dreamy')f='brightness(1.08) saturate(.85) contrast(.95)';x.filter=f;x.drawImage(im,pad,pad,w,h);x.filter='none';if(e.sticker&&e.sticker!=='none'){x.font=Math.max(36,Math.round(Math.min(w,h)*.11))+'px sans-serif';x.textAlign='right';x.textBaseline='bottom';x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=6;x.fillText(e.sticker,w+pad-16,h+pad-14);x.shadowBlur=0}resolve(c.toDataURL('image/jpeg',.9));};im.src=src;});}

/* publishPost now carries mood/tags and permanently applies the photo edit. */
async function publishPost(){
  if(window._publishingPost)return;let imgs=window._drafts||[];let caption=String(window._caption||'').trim();if(!imgs.length&&!caption)return toast('Write something or add an image to post.');
  window._publishingPost=true;const btns=[...document.querySelectorAll('button')].filter(b=>String(b.textContent||'').includes('PUBLISH'));btns.forEach(b=>{b.disabled=true;b.dataset.oldText=b.textContent;b.textContent='PUBLISHING…'});
  try{
    const edit=window._editSettings||{border:'plain',filter:'normal',sticker:'none'};const processed=[];for(const src of imgs){processed.push(await processImageData(src,edit));}
    const tagged=getTaggedUsers(window._postTags||'');const p={id:uid('post'),user:current,images:processed,caption:window._caption||'',mood:window._postMood||'',tagged_users:tagged,likes:[],comments:[],reposts:[],hashtags:hashtags(window._caption||''),created:Date.now()};
    const bar=$('#postProgress');if(bar)bar.style.width='20%';const ok=await savePostOnline(p);if(!ok)return;if(bar)bar.style.width='100%';db.posts.unshift(p);user().posts.unshift(p.id);save();
    tagged.filter(x=>x!==current).forEach(x=>notify(x,'tag',`${user().display} tagged you in a post.`,`tag:${p.id}:${x}`));window._drafts=[];window._caption='';window._postMood='';window._postTags='';sound();toast('Post published!');setTimeout(()=>go('home'),350);
  }catch(e){console.error(e);toast(e?.message||'Could not publish the post.')}finally{window._publishingPost=false;btns.forEach(b=>{b.disabled=false;b.textContent=b.dataset.oldText||'PUBLISH'})}
}

/* Save profile text color reliably and immediately reflect it in the profile. */
async function saveProfileTextColor(){const c=$('#profileTextColorSet')?.value||'';if(!/^#[0-9a-fA-F]{6}$/.test(c))return toast('Choose a valid color.');const u=user();u.profile_text_color=c;save();try{await syncMyProfile()}catch(e){}render();toast('Profile text color saved.');}

/* Make notifications explicitly old/new based on the session start and never play sound for old rows. */
async function pullOnlineNotifications(){if(!onlineUser)return;try{const {data,error}=await supabaseClient.from('notifications').select('id,recipient_id,actor_id,type,text,link,read,created_at').eq('recipient_id',onlineUser.id).order('created_at',{ascending:false}).limit(200);if(error)throw error;(data||[]).forEach(row=>{const actor=rippleUserForAuth(row.actor_id);const id=String(row.id),link=String(row.link||'');const created=row.created_at?new Date(row.created_at).getTime():Date.now();if(notificationDeleted(id,link))return;const item={id,to:current,type:row.type||'activity',text:row.text||'',link,read:!!row.read,created,actor,fresh:false};let i=db.notifications.findIndex(n=>String(n.id)===id);if(i<0&&link)i=db.notifications.findIndex(n=>String(n.link||'')===link);if(i>=0)db.notifications[i]={...db.notifications[i],...item,fresh:false};else db.notifications.push(item)});db.notifications=db.notifications.filter(n=>n.to===current||!n.to);save()}catch(e){console.warn('Online notification sync failed',e)}}

/* Dark mode is applied immediately and kept on every rerender. */
function applyDark(){document.body.classList.toggle('dark',!!db.settings.dark);document.documentElement.classList.toggle('dark',!!db.settings.dark);document.body.style.filter='none';setDesktopSize(db.settings.desktopSize||'small');}

/* Add interests as chips on the profile and ensure max 10 on save. */
const __rippleOldProfile=profile;
profile=function(id){__rippleOldProfile(id);};

/* Make inline comments reactable too. */
const __oldComment=comment;
comment=async function(id){const inp=$('#comment-'+id);const text=inp?.value.trim();if(!text)return;const p=db.posts.find(x=>x.id===id);if(!p)return;await __oldComment(id);const latest=(p.comments||[]).find(c=>c.user===current&&c.text===text&&c.likes==null);if(latest){latest.likes=[];latest.ripples=[];save();}};

/* Realtime comments should preserve local reaction arrays instead of losing them. */
const __oldPullLC=pullOnlineLikesComments;
pullOnlineLikesComments=async function(){const old=new Map(db.posts.flatMap(p=>(p.comments||[]).map(c=>[String(c.id),{likes:c.likes||[],ripples:c.ripples||[]}])));await __oldPullLC();db.posts.forEach(p=>(p.comments||[]).forEach(c=>{const x=old.get(String(c.id));if(x){c.likes=x.likes;c.ripples=x.ripples}}));save();};


/* Final v64 post renderer: mood + tags + ranked comment preview. */
postHTML=function(p){
  if(postIsArchived(p)&&!isPostOwner(p))return "";
  if(postVisibility(p)==="private"&&!isPostOwner(p))return "";
  let u=userBy(p.user),likes=p.likes||[],comments=p.comments||[];
  const owner=isPostOwner(p),isRepost=p.repostOf!=null;
  const ownerMenu=owner&&!isRepost?`<button class="link post-more" aria-label="Post options" onclick="ownedPostMenu('${p.id}')">•••</button>`:"";
  const repostDelete=owner&&isRepost?`<button class="link post-more" aria-label="Delete repost" onclick="deleteRepost('${p.id}')">🗑</button>`:"";
  const badges=(owner&&postVisibility(p)==="private"?` <span class="meta">🔒 PRIVATE</span>`:"")+(owner&&postIsArchived(p)?` <span class="meta">📦 ARCHIVED</span>`:"");
  const original=isRepost?(db.posts.find(x=>String(x.id)===String(p.repostOf))||null):null;
  const repostLabel=isRepost&&original?`<div class="repost-label">↻ ${esc(u?.display||"Someone")} reposted · original by ${esc(userBy(original.user)?.display||"Unknown")}</div>`:"";
  const repostComment=isRepost&&p.caption?`<div class="caption repost-comment"><b>${esc(u?.display||"Someone")}:</b> ${esc(p.caption)}</div>`:"";
  const displayPost=isRepost&&original?original:p;
  const displayImages=Array.isArray(displayPost.images)?displayPost.images:[];
  const displayCaption=String(displayPost.caption||"");
  const displayUser=userBy(displayPost.user);
  const photoGridHTML=(images)=>{const arr=Array.isArray(images)?images.filter(Boolean):[];if(!arr.length)return "";const shown=arr.slice(0,4),extra=arr.length-4;const cls=`post-media-grid count-${Math.min(arr.length,4)}`;return `<div class="${cls}" aria-label="${arr.length} photos">${shown.map((src,i)=>`<button type="button" class="post-media-box post-media-open" onclick="openPhotoViewer('${esc(String(displayPost.id))}',${i})" aria-label="View photo ${i+1} of ${arr.length}"><img class="postimg" src="${esc(String(src))}" alt="Photo ${i+1} of ${arr.length}" draggable="false">${i===3&&extra>0?`<span class="post-media-more">+${extra}</span>`:""}</button>`).join("")}</div>`};
  const originalBody=isRepost&&original?`<div class="repost-original"><div class="posthead" style="padding:7px 9px"><button class="link" onclick="go('profile','${displayUser?.id||displayPost.user}')"><img class="avatar" src="${avatar(displayUser||{})}"></button><div style="flex:1"><button class="link" onclick="go('profile','${displayUser?.id||displayPost.user}')"><b>${esc(displayUser?.display||"Original post")}</b></button><div class="meta">@${esc(displayUser?.username||displayPost.user)} · ${time(displayPost.created)}</div></div></div>${photoGridHTML(displayImages)}<div class="caption">${esc(displayCaption)}</div></div>`:"";
  const normalMedia=!isRepost?photoGridHTML(displayImages):"";
  const normalCaption=!isRepost?`<div class="caption">${esc(displayCaption)} ${hashtags(displayCaption).map(h=>`<button class="link" onclick="state.search='${h}';go('explore')">${esc(h)}</button>`).join(" ")}</div>`:"";
  const mood=p.mood?selectedMoodLabel(p.mood):"";
  const tags=taggedNames(p.tagged_users||[]);
  const postExtras=(mood?`<div class="post-mood">${esc(u?.display||"Someone")} is feeling ${esc(mood)}</div>`:"")+(tags.length?`<div class="post-tags">${tags.map(t=>`<span class="post-tag">@${esc(t.username)}</span>`).join(" ")}</div>`:"");
  const repostButton=isRepost?`<button class="reposted" onclick="repost('${p.id}')">↻ REPOSTED</button>`:`<button class="${(p.reposts||[]).includes(current)?"reposted":""}" onclick="repost('${p.id}')">↻ REPOST ${(p.reposts||[]).length||""}</button>`;
  const ranked=sortedComments(comments);
  const preview=ranked.slice(0,3).map(c=>`<div class="comment"><button class="link" onclick="go('profile','${c.user}')"><b>${esc(userBy(c.user)?.display||c.user)}</b></button> ${esc(c.text)} <span class="meta">${time(c.created)}</span></div>`).join("");
  return `<article class="window post ${isRepost?"repost-card":""}" id="post-${p.id}">${repostLabel}<div class="posthead"><button class="link" onclick="go('profile','${u?.id||p.user}')"><img class="avatar" src="${avatar(u||{})}"></button><div style="flex:1"><button class="link" onclick="go('profile','${u?.id||p.user}')"><b>${esc(u?.display||"Ripple user")}</b></button><div class="meta">@${esc(u?.username||p.user)} · ${time(p.created)}${badges}</div>${postExtras}</div>${ownerMenu}${repostDelete}<button class="link" onclick="reportItem('post','${p.id}')">report</button></div>${repostComment}${originalBody}${normalMedia}${normalCaption}<div class="actions"><button class="${likes.includes(current)?"liked":""}" onclick="toggleLike('${p.id}')">♥ ${likes.length}</button><button onclick="openComments('${p.id}')">COMMENTS ${comments.length}</button>${repostButton}</div><div class="comments">${preview}${comments.length>3?`<button class="link" onclick="openComments('${p.id}')">View all ${comments.length} comments</button>`:""}<div style="display:flex;gap:5px"><input id="comment-${p.id}" style="flex:1;padding:7px;border:1px solid #9aa" placeholder="Write a comment…"><button class="retro-btn" onclick="comment('${p.id}')">POST</button></div></div></article>`;
};

/* Initial dark state + rerender after the overrides are installed. */
applyDark();
if(current&&!recoveryMode)render();

<script>
/* ===== RIPPLE v67 ===== */
/* v91: a fresh signup with a previously deleted username clears only that username's local deleted-profile tombstone. */
function deletedProfileKeys(){try{return new Set(JSON.parse(localStorage.getItem('ripple_deleted_profiles_v1')||'[]').map(String))}catch{return new Set()}}
function rememberDeletedProfile(u){if(!u)return;const k=deletedProfileKeys();[u.id,u.username,u.profile_id,u.auth_id].filter(x=>x!=null&&String(x)).forEach(x=>k.add(String(x)));localStorage.setItem('ripple_deleted_profiles_v1',JSON.stringify([...k].slice(-500)))}
function clearDeletedProfileTombstone(u){if(!u)return;const keys=deletedProfileKeys();[u.id,u.username,u.profile_id,u.auth_id].filter(x=>x!=null&&String(x)).forEach(x=>keys.delete(String(x)));try{localStorage.setItem('ripple_deleted_profiles_v1',JSON.stringify([...keys].slice(-500)))}catch{}}
function isDeletedProfileId(id){return id!=null&&deletedProfileKeys().has(String(id))}
function isDeletedProfileUser(id){const u=db.users[id];return isDeletedProfileId(id)||isDeletedProfileId(u?.username)||isDeletedProfileId(u?.profile_id)||isDeletedProfileId(u?.auth_id)}
function visiblePostForRipple(p){return !!p&&!isDeletedProfileUser(p.user)&&p.deleted_profile!==true}
function mentionUserIds(text){const out=[];const re=/(?:^|\s)@([A-Za-z0-9_.-]{1,40})\b/g;let m;while((m=re.exec(String(text||'')))){const u=findUser(m[1]);if(u&&!out.includes(u.id))out.push(u.id)}return out}
function renderMentions(text){const safe=esc(String(text||''));return safe.replace(/@([A-Za-z0-9_.-]{1,40})\b/g,(full,un)=>{const u=findUser(un);return u?`<button type="button" class="link mention-link" onclick="go('profile','${esc(String(u.id))}')">@${esc(u.username)}</button>`:full})}
const __v67BasePostHTML=postHTML;
postHTML=function(p){
  if(!visiblePostForRipple(p))return '';
  let html=__v67BasePostHTML(p);
  const caption=String(p.caption||'');
  if(caption)html=html.split(esc(caption)).join(renderMentions(caption));
  const tags=(p.tagged_users||[]).map(id=>userBy(id)).filter(Boolean);
  if(tags.length){
    const tagHtml=`<div class="post-tags">${tags.map(t=>`<button type="button" class="link post-tag mention-link" onclick="go('profile','${esc(String(t.id))}')">@${esc(t.username)}</button>`).join(' ')}</div>`;
    html=html.replace(/<div class="post-tags">[\s\S]*?<\/div>/,tagHtml);
    if(!html.includes('post-tags'))html=html.replace('</div><div class="actions">',tagHtml+'</div><div class="actions">');
  }
  return html;
};

function openInterestPicker(){
  const u=user();if(!u)return;const selected=new Set(parseInterests(u.interests));
  $('#modalRoot').innerHTML=`<div class="modal"><div class="window" style="max-width:620px;width:96%"><div class="titlebar">ADD INTERESTS <button class="link" style="color:#fff;margin-left:auto" onclick="closeModal()">CLOSE</button></div><div class="panel-body"><p class="meta">Choose up to 100 interests. Your choices will appear inside the Interests box.</p><div id="interestModalGrid" class="interest-picker-grid">${INTEREST_OPTIONS.map(x=>`<label><input type="checkbox" value="${esc(x)}" ${selected.has(x)?'checked':''}> ${esc(x)}</label>`).join('')}</div><div style="display:flex;justify-content:flex-end;gap:7px;margin-top:10px"><button class="retro-btn" onclick="saveInterestPicker()">SAVE INTERESTS</button></div></div></div></div>`;
  $$('#interestModalGrid input').forEach(cb=>cb.onchange=()=>{if($$('#interestModalGrid input:checked').length>100){cb.checked=false;toast('You can choose up to 100 interests.')}});
}
function saveInterestPicker(){const vals=$$('#interestModalGrid input:checked').slice(0,100).map(x=>x.value);user().interests=vals.join(', ');save();closeModal();openRippleProfileEditor();toast(vals.length?`${vals.length} interests saved.`:'Interests cleared.');}
function editProfile(){
  const u=user();
  const boxColor=/^#[0-9a-fA-F]{6}$/.test(u.profile_info_box_color||"")?u.profile_info_box_color:"#ffffff";
  const bannerColor=/^#[0-9a-fA-F]{6}$/.test(u.profile_info_banner_color||"")?u.profile_info_banner_color:"#063c8c";
  $('#modalRoot').innerHTML=`<div class="modal"><div class="window profile-editor"><div class="titlebar">EDIT PROFILE <button class="link" style="color:#fff;margin-left:auto" onclick="closeModal()">CLOSE</button></div><div class="panel-body">
  <div class="edit-profile-preview"><img class="avatar big" src="${avatar(u)}"><div><b>${esc(u.display)}</b><div class="meta">@${esc(u.username)}</div><p>Edit your profile information here.</p></div></div>
  <div class="field"><label>Profile photo</label><button type="button" class="retro-btn" onclick="editPhoto()">✎ EDIT PHOTO</button> <button type="button" class="retro-btn" onclick="cameraCapture('profile')">📷 TAKE PHOTO</button></div>
  <div class="field"><label>Display name</label><input id="epName" value="${esc(u.display)}"></div>
  <div class="field"><label>Bio</label><textarea id="epBio" rows="4">${esc(u.bio||'')}</textarea></div>
  <div class="field"><label>Status</label><input id="epStatus" value="${esc(u.status||'')}" placeholder="What are you up to?"></div>
  <div class="field"><label>Interests <span class="meta">(up to 100)</span></label><div class="interest-box" id="editInterestBox">${interestChips(u.interests)}<button type="button" class="retro-btn interest-add" onclick="openInterestPicker()">＋ ADD INTEREST</button></div><input id="epInt" type="hidden" value="${esc(u.interests||'')}"></div>
  <div class="profile-edit-grid"><div class="field"><label>Pronouns</label><input id="epPronouns" value="${esc(u.pronouns||'')}" placeholder="she/her, he/him, they/them…"></div><div class="field"><label>Location</label><input id="epLocation" value="${esc(u.location||'')}" placeholder="City, country"></div></div>
  <div class="field"><label>Website</label><input id="epWebsite" value="${esc(u.website||'')}" placeholder="https://…"></div>

<script>
/* ===== RIPPLE v68 ===== */

// Caption/comment @mentions become real profile links.
function renderMentionsV68(text){
  const safe=esc(String(text||''));
  return safe.replace(/(^|\s)@([A-Za-z0-9_.-]{1,40})\b/g,(all,pre,un)=>{
    const u=findUser(un);
    return u?`${pre}<button type="button" class="link mention-link" onclick="go('profile','${esc(String(u.id))}')">@${esc(u.username)}</button>`:all;
  });
}

// Make the existing post renderer show clickable mentions in captions and comments.
const __v68OldPostHTML=postHTML;
postHTML=function(p){
  let html=__v68OldPostHTML(p);
  if(!html)return html;
  const caption=String(p.caption||'');
  if(caption)html=html.split(esc(caption)).join(renderMentionsV68(caption));
  return html;
};

function notifyCommentMentions(postId,text){
  const ids=mentionUserIds(text).filter(x=>x!==current);
  ids.forEach(x=>notify(x,'mention',`${user().display} mentioned you in a comment.`,`comment-mention:${postId}:${current}:${x}`));
}

  await __v68OldComment(id);
  ids.forEach(x=>notify(x,'mention',`${user().display} mentioned you in a comment.`,`comment-mention:${id}:${current}:${x}`));

};

  ids.forEach(x=>notify(x,'mention',`${user().display} mentioned you in a comment.`,`comment-mention:${id}:${current}:${x}`));

function v71PatternBackground(p,c1,c2){

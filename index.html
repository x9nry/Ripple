    img.style.background=v71GinghamBackground(c.c1,c.c2);
  }else if(e.border==='pattern'){
    const p=v68PatternById(e.pattern||1),c=v69PatternColors(e);
    img.style.padding='20px';
    img.style.background=v71PatternBackground(p,c.c1,c.c2);
  }else if(e.border==='plain'){
    img.style.padding='0';
    img.style.background='transparent';
  }else{
    img.style.padding='18px';
    img.style.background=e.border==='white'?'#fff':e.border==='black'?'#111':'#fff';
  }
  $$('#v68EditorStage .editor-sticker').forEach((el,j)=>{
    const st=e.stickers[j];if(!st)return;
    el.style.left=st.x*100+'%';el.style.top=st.y*100+'%';
    el.style.fontSize=(st.size||72)+'px';
    el.style.transform=`translate(-50%,-50%) rotate(${st.rotate||0}deg)`;
    el.classList.toggle('selected',j===e.selected);
  });
};

// Fixed canvas renderer for publishing. It keeps custom gingham and Y2K colors
// while avoiding the old diagonal "gingham" implementation.
v68DrawBorder=function(ctx,w,h,e,pad){
  if(e.border==='plain')return;
  const c1=e.customC1||'#ff7eb6',c2=e.customC2||'#ffe5f0';
  if(e.border==='gingham-custom'){
    const size=Math.max(18,Math.round(Math.min(w,h)/12)),band=Math.max(8,Math.round(size/2));
    ctx.fillStyle=c2;ctx.fillRect(0,0,w,h);
    ctx.fillStyle=c1;
    for(let y=0;y<h;y+=size)ctx.fillRect(0,y,w,band);
    for(let x=0;x<w;x+=size)ctx.fillRect(x,0,band,h);
    ctx.globalAlpha=.35;
    for(let y=0;y<h;y+=size)for(let x=0;x<w;x+=size)ctx.fillRect(x,y,band,band);
    ctx.globalAlpha=1;return;
  }
  if(e.border==='pattern'){
    const p=v68PatternById(e.pattern||1),a=e.patternC1||c1||p.c1,b=e.patternC2||c2||p.c2;
    ctx.fillStyle=b;ctx.fillRect(0,0,w,h);ctx.fillStyle=a;ctx.strokeStyle=a;
    switch(p.type){
      case 'checker':for(let y=0;y<h;y+=18)for(let x=0;x<w;x+=18)if(((x/18+y/18)%2)===0)ctx.fillRect(x,y,18,18);break;
      case 'dots':for(let y=7;y<h;y+=16)for(let x=7;x<w;x+=16){ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}break;
      case 'grid':ctx.lineWidth=2;for(let x=0;x<w;x+=18){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}break;
      case 'cross':ctx.lineWidth=3;for(let x=0;x<w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}break;
      case 'stripe':case 'diagonal':ctx.lineWidth=8;for(let z=-h;z<w;z+=16){ctx.beginPath();ctx.moveTo(z,0);ctx.lineTo(z+h,h);ctx.stroke()}break;
      case 'zigzag':ctx.lineWidth=4;for(let y=0;y<h;y+=18){ctx.beginPath();for(let x=0;x<w;x+=12)ctx.lineTo(x,y+((x/12)%2?0:9));ctx.stroke()}break;
      case 'diamonds':ctx.lineWidth=3;for(let x=-h;x<w;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+h/2,h/2);ctx.lineTo(x,h);ctx.stroke()}break;
      case 'rings':ctx.lineWidth=4;for(let y=10;y<h;y+=28)for(let x=10;x<w;x+=28){ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.stroke()}break;
      case 'pixel':for(let y=0;y<h;y+=12)for(let x=0;x<w;x+=12)if(((x/12+y/12)%2)===0)ctx.fillRect(x,y,12,12);break;
      default:ctx.lineWidth=8;for(let z=-h;z<w;z+=16){ctx.beginPath();ctx.moveTo(z,0);ctx.lineTo(z+h,h);ctx.stroke()}
    }
    return;
  }
  if(e.border==='dotted'){ctx.fillStyle='#f4f4f4';ctx.fillRect(0,0,w,h);ctx.fillStyle='#555';for(let y=4;y<h;y+=16)for(let x=4;x<w;x+=16){ctx.beginPath();ctx.arc(x,y,1.4,0,Math.PI*2);ctx.fill()}return}
  if(e.border==='checker'){for(let y=0;y<h;y+=20)for(let x=0;x<w;x+=20){ctx.fillStyle=((x/20+y/20)%2)?'#222':'#eee';ctx.fillRect(x,y,20,20)}return}
  ctx.fillStyle=e.border==='black'?'#111':'#fff';ctx.fillRect(0,0,w,h);
};

// Keep the combined 200-pattern library in one palette and make every tile clickable.
setGinghamPreset=function(i,id){const e=photoEditState(i),g=V69_GINGHAM[Number(id)-1]||V69_GINGHAM[0];e.border='gingham-custom';e.gingham=Number(id);e.customC1=g.c1;e.customC2=g.c2;updatePhotoEditorVisual(i)};
setPhotoPattern=function(i,id){const e=photoEditState(i),p=v68PatternById(id);e.border='pattern';e.pattern=Number(id);e.patternC1=e.customC1||p.c1;e.patternC2=e.customC2||p.c2;updatePhotoEditorVisual(i)};

// The top EDIT button should edit the first selected photo; only open the picker

// Never let localStorage quota prevent an already-uploaded post from completing.

// Rebuild editor once more with the fixed renderer, one combined pattern library,

  const allPatternBtns=V69_GINGHAM.map(g=>`<button type="button" title="Gingham ${g.id}" style="background:${v71GinghamBackground(g.c1,g.c2)}" onclick="setGinghamPreset(${i},${g.id})"><span>G${String(g.id).padStart(3,'0')}</span></button>`).join('')+

  updatePhotoEditorVisual(i);
};

<script>
/* ===== RIPPLE v72 — reliable pattern taps + touch sticker dragging ===== */

// Keep all editor preview rendering in the DOM. Older versions accidentally
// referenced canvas variables (ctx/w/h) from a different renderer.
function v72ApplyEditorVisual(i){
  const e=photoEditState(i), img=$('#v68EditorImg'), stage=$('#v68EditorStage');
  if(!img||!stage)return;

  stage.style.background='transparent';
  stage.style.border='0';
  stage.style.boxShadow='none';
  stage.style.outline='0';
  stage.style.touchAction='none';

  img.style.filter=V68_FILTERS[e.filter]||'none';
  img.style.border='0';
  img.style.outline='0';
  img.style.boxShadow='none';
  img.style.background='transparent';
  img.style.touchAction='none';
  img.draggable=false;

  if(e.border==='gingham-custom'){
    const g=V69_GINGHAM[(Number(e.gingham||1)-1)%V69_GINGHAM.length];
    img.style.padding='18px';
    img.style.background=v71GinghamBackground(e.customC1||g.c1,e.customC2||g.c2);
  }else if(e.border==='pattern'){
    const pat=v68PatternById(e.pattern||1);
    const c1=e.patternC1||e.customC1||pat.c1;
    const c2=e.patternC2||e.customC2||pat.c2;
    img.style.padding='18px';
    img.style.background=v71PatternBackground(pat,c1,c2);
  }else if(e.border==='plain'){
    img.style.padding='0';
    img.style.background='transparent';
  }else if(e.border==='white'){
    img.style.padding='18px';
    img.style.background='#fff';
  }else if(e.border==='black'){
    img.style.padding='18px';
    img.style.background='#000';
  }else{
    img.style.padding='18px';
    img.style.background='#fff';
  }

  const els=$$('#v68EditorStage .editor-sticker');
  els.forEach((el,j)=>{
    const st=e.stickers[j];
    if(!st)return;
    el.style.left=(Math.max(.02,Math.min(.98,Number(st.x)||.5))*100)+'%';
    el.style.top=(Math.max(.02,Math.min(.98,Number(st.y)||.5))*100)+'%';
    el.style.fontSize=(Number(st.size)||72)+'px';
    el.style.transform=`translate(-50%,-50%) rotate(${Number(st.rotate)||0}deg)`;
    el.classList.toggle('selected',j===e.selected);
    el.style.touchAction='none';
    el.style.pointerEvents='auto';
    el.draggable=false;

    // Remove any old handlers before installing the robust pointer-capture version.
    el.onpointerdown=null;
    el.onpointermove=null;
    el.onpointerup=null;
    el.onpointercancel=null;

    el.onpointerdown=function(ev){
      if(ev.button!==undefined && ev.button!==0)return;
      ev.preventDefault();
      ev.stopPropagation();
      e.selected=j;
      els.forEach((x,k)=>x.classList.toggle('selected',k===j));

      const rect=stage.getBoundingClientRect();
      const startX=ev.clientX, startY=ev.clientY;
      const startPX=Number(st.x)||.5, startPY=Number(st.y)||.5;
      const pid=ev.pointerId;
      try{el.setPointerCapture(pid)}catch{}

      const move=(mv)=>{
        if(mv.pointerId!==pid)return;
        mv.preventDefault();
        const nx=startPX+(mv.clientX-startX)/Math.max(1,rect.width);
        const ny=startPY+(mv.clientY-startY)/Math.max(1,rect.height);
        st.x=Math.max(.02,Math.min(.98,nx));
        st.y=Math.max(.02,Math.min(.98,ny));
        el.style.left=(st.x*100)+'%';
        el.style.top=(st.y*100)+'%';
      };
      const end=(up)=>{
        if(up.pointerId!==pid)return;
        el.removeEventListener('pointermove',move);
        el.removeEventListener('pointerup',end);
        el.removeEventListener('pointercancel',end);
        try{if(el.hasPointerCapture(pid))el.releasePointerCapture(pid)}catch{}
      };
      el.addEventListener('pointermove',move,{passive:false});
      el.addEventListener('pointerup',end,{passive:false});
      el.addEventListener('pointercancel',end,{passive:false});
    };
  });
}

// Final override: never call the broken canvas-based preview code.
updatePhotoEditorVisual=function(i){v72ApplyEditorVisual(i)};

// Pattern selection is deliberately tiny and synchronous so a tap cannot be
// swallowed by a rendering exception.
setGinghamPreset=function(i,id){
  const e=photoEditState(i);
  const g=V69_GINGHAM[Math.max(0,Number(id)-1)%V69_GINGHAM.length]||V69_GINGHAM[0];
  e.border='gingham-custom';
  e.gingham=Number(id);
  e.customC1=g.c1;
  e.customC2=g.c2;
  updatePhotoEditorVisual(i);
};
setPhotoPattern=function(i,id){
  const e=photoEditState(i);
  const pat=v68PatternById(Number(id))||V68_PATTERNS[0];
  e.border='pattern';
  e.pattern=Number(id);
  e.patternC1=e.patternC1||pat.c1;
  e.patternC2=e.patternC2||pat.c2;
  updatePhotoEditorVisual(i);
};

// Rebuild the editor with one combined 200-pattern library.
openPhotoEditor=function(i){
  const src=(window._drafts||[])[i];
  if(!src)return;
  const e=photoEditState(i);
  e.stickers=Array.isArray(e.stickers)?e.stickers:[];
  e.gingham=e.gingham||1;

  const filterBtns=Object.keys(V68_FILTERS).map(x=>
    `<button type="button" class="retro-btn" onclick="setPhotoFilter(${i},'${x}')">${x.toUpperCase()}</button>`
  ).join('');

  const gingBtns=V69_GINGHAM.map(g=>
    `<button type="button" title="Gingham ${g.id}" style="background:${v69GinghamStyle(g)}" onclick="setGinghamPreset(${i},${g.id});return false"><span>G${String(g.id).padStart(3,'0')}</span></button>`
  ).join('');

  const y2kBtns=V68_PATTERNS.map(p=>
    `<button type="button" title="Y2K pattern ${p.id}" style="background:${v71PatternBackground(p,p.c1,p.c2)}" onclick="setPhotoPattern(${i},${p.id});return false"><span>Y${String(p.id).padStart(3,'0')}</span></button>`
  ).join('');

  const stickers=v68StickerButtons(i);
  const selectedSize=e.selected!=null&&e.stickers[e.selected]?(e.stickers[e.selected].size||72):72;

  $('#modalRoot').innerHTML=`<div class="modal"><div class="window" style="width:min(1000px,98%)">
    <div class="titlebar">PHOTO EDITOR — PHOTO ${i+1}<button class="link" style="color:#fff;margin-left:auto" onclick="closeModal()">DONE</button></div>
    <div class="panel-body">
      <div id="v68EditorStage" class="editor-stage"><img id="v68EditorImg" src="${esc(src)}" alt="Edit photo" draggable="false">${e.stickers.map(editorStickerHTML).join('')}</div>
      <div class="editor-tools"><b>FILTERS — ${Object.keys(V68_FILTERS).length}</b></div>
      <div class="filter-grid">${filterBtns}</div>
      <div class="editor-tools"><b>PATTERNS — 200</b></div>
      <div class="pattern-color-row">
        <label>Pattern color <input type="color" value="${esc(e.customC1||'#ff7eb6')}" onchange="photoEditState(${i}).customC1=this.value;updatePhotoEditorVisual(${i})"></label>
        <label>Light / accent <input type="color" value="${esc(e.customC2||'#ffe5f0')}" onchange="photoEditState(${i}).customC2=this.value;updatePhotoEditorVisual(${i})"></label>
        <button type="button" class="retro-btn" onclick="setPhotoBorder(${i},'plain')">NO BORDER</button>
      </div>
      <div class="pattern-grid">${gingBtns}${y2kBtns}</div>
      <div class="editor-sticker-palette"><b>STICKERS (${V68_STICKERS.length})</b>${stickers}</div>
      <div class="editor-control-row">
        <label>Sticker size <input id="v68StickerSize" type="range" min="20" max="200" value="${selectedSize}" oninput="resizeSelectedSticker(${i},this.value)"></label>
        <button type="button" class="retro-btn danger" onclick="removeSelectedSticker(${i})">REMOVE SELECTED</button>
        <button type="button" class="retro-btn" onclick="clearPhotoStickers(${i})">CLEAR STICKERS</button>
      </div>
      <p class="meta">200 patterns in one library: 100 gingham checks + 100 Y2K designs. Drag stickers directly on the photo.</p>
    </div>
  </div></div>`;

  updatePhotoEditorVisual(i);
};

// Sticker additions should update the existing editor instead of rebuilding it,
// which keeps touch interaction stable.
addPhotoSticker=function(i,text){
  const e=photoEditState(i);
  e.stickers=Array.isArray(e.stickers)?e.stickers:[];
  const n=e.stickers.length;
  e.stickers.push({text,x:.5+((n%5)-2)*.06,y:.5+((n%4)-1.5)*.08,size:64+(n%4)*10,rotate:0});
  e.selected=e.stickers.length-1;

};

resizeSelectedSticker=function(i,v){
  const e=photoEditState(i);
  if(e.selected==null||!e.stickers[e.selected])return;
  e.stickers[e.selected].size=Number(v)||72;
  const el=document.querySelector(`#v68EditorStage .editor-sticker[data-sticker-index="${e.selected}"]`);
  if(el)el.style.fontSize=(Number(v)||72)+'px';
};

// Make the three top create actions deterministic.
const __v72Create=create;
create=function(){
  __v72Create();
  const actions=document.querySelectorAll('.create-top-actions .retro-btn');
  const edit=[...actions].find(b=>b.textContent.includes('EDIT'));
  if(edit)edit.onclick=function(){
    if((window._drafts||[]).length)openPhotoEditor(0);
    else document.getElementById('postFiles')?.click();
  };
};

<!-- RIPPLE v74 — actual pattern frame + publish renderer -->
<script>
(function(){
  function ginghamBG(c1,c2){
    const a=c1||'#ff7eb6', b=c2||'#ffe5f0';
    return `linear-gradient(90deg, ${a} 0 50%, transparent 50% 100%) 0 0/20px 20px,linear-gradient(0deg, ${a} 0 50%, transparent 50% 100%) 0 0/20px 20px,${b}`;
  }
  function patternBG(p,c1,c2){
    const a=c1||p?.c1||'#ff7eb6', b=c2||p?.c2||'#ffe5f0', t=p?.type||'checker';
    if(t==='checker'||t==='pixel') return `repeating-conic-gradient(${a} 0 25%,${b} 0 50%) 50%/18px 18px`;
    if(t==='dots') return `radial-gradient(circle,${a} 0 3px,transparent 3.2px) 0 0/16px 16px,${b}`;
    if(t==='grid'||t==='cross') return `linear-gradient(${a} 2px,transparent 2px) 0 0/18px 18px,linear-gradient(90deg,${a} 2px,transparent 2px) 0 0/18px 18px,${b}`;
    if(t==='rings') return `radial-gradient(circle,transparent 0 5px,${a} 6px 8px,transparent 9px) 0 0/28px 28px,${b}`;
    if(t==='diamonds') return `linear-gradient(45deg,transparent 42%,${a} 43% 48%,transparent 49%) 0 0/24px 24px,linear-gradient(-45deg,transparent 42%,${a} 43% 48%,transparent 49%) 0 0/24px 24px,${b}`;
    if(t==='zigzag') return `linear-gradient(135deg,transparent 0 42%,${a} 43% 50%,transparent 51% 92%,${a} 93%) 0 0/24px 18px,${b}`;
    return `repeating-linear-gradient(135deg,${a} 0 7px,${b} 7px 14px)`;
  }
  function frameBG(e){
    if(e.border==='gingham-custom'){
      const g=V69_GINGHAM[(Number(e.gingham||1)-1+100)%100]||V69_GINGHAM[0];
      return ginghamBG(e.customC1||g.c1,e.customC2||g.c2);
    }
    if(e.border==='pattern'){
      const pat=v68PatternById(Number(e.pattern)||1)||V68_PATTERNS[0];
      return patternBG(pat,e.patternC1||e.customC1||pat.c1,e.patternC2||e.customC2||pat.c2);
    }
    if(e.border==='white') return '#fff';
    if(e.border==='black') return '#111';
    return 'transparent';
  }
  function refresh(i){
    const e=photoEditState(i),stage=document.getElementById('rippleV74Stage'),frame=document.getElementById('rippleV74Frame'),img=document.getElementById('rippleV74Img');
    if(!stage||!frame||!img)return;
    const active=e.border&&e.border!=='plain';
    frame.style.background=frameBG(e);
    frame.style.padding=active?'18px':'0';
    img.style.filter=V68_FILTERS[e.filter]||'none';
    img.style.border='0';img.style.outline='0';img.style.boxShadow='none';
    document.querySelectorAll('#rippleV74Stage .ripple-v74-sticker').forEach((el,j)=>{
      const st=e.stickers?.[j];if(!st)return;
      el.style.left=((Number(st.x)||.5)*100)+'%';el.style.top=((Number(st.y)||.5)*100)+'%';
      el.style.fontSize=(Number(st.size)||72)+'px';
      el.style.transform=`translate(-50%,-50%) rotate(${Number(st.rotate)||0}deg)`;
      el.classList.toggle('selected',j===e.selected);
    });
  }
  window.applyPhotoEditCanvas=function(src,e){
    return new Promise(resolve=>{
      const im=new Image();
      im.onload=()=>{
        const w=im.naturalWidth||800,h=im.naturalHeight||600;
        const hasBorder=e.border&&e.border!=='plain';
        const pad=hasBorder?Math.max(24,Math.round(Math.min(w,h)*.045)):0;
        const c=document.createElement('canvas');c.width=w+pad*2;c.height=h+pad*2;
        const ctx=c.getContext('2d');
        if(hasBorder){
          ctx.fillStyle=frameBG(e);ctx.fillRect(0,0,c.width,c.height);
        }
        ctx.save();ctx.filter=V68_FILTERS[e.filter]||'none';ctx.drawImage(im,pad,pad,w,h);ctx.restore();
        if(renderStickers)(e.stickers||[]).forEach(st=>{
          ctx.save();ctx.translate(pad+(Number(st.x)||.5)*w,pad+(Number(st.y)||.5)*h);
          ctx.rotate((Number(st.rotate)||0)*Math.PI/180);ctx.font=`${Number(st.size)||72}px sans-serif`;
          ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=5;ctx.fillText(st.text||'',0,0);ctx.restore();
        });
        resolve(c.toDataURL('image/jpeg',.92));
      };
      im.onerror=()=>resolve(src);im.src=src;
    });
  };
  window.openPhotoEditor=function(i){
    const src=(window._drafts||[])[i];if(!src)return;

    const stickers=V68_STICKERS.map(x=>`<button type="button" class="retro-btn" data-v74-sticker="${esc(x)}">${x}</button>`).join('');
    const stickerHTML=e.stickers.map((st,j)=>`<span class="ripple-v74-sticker ${j===e.selected?'selected':''}" data-sticker-index="${j}" style="left:${(Number(st.x)||.5)*100}%;top:${(Number(st.y)||.5)*100}%;font-size:${Number(st.size)||72}px;transform:translate(-50%,-50%) rotate(${Number(st.rotate)||0}deg)">${esc(st.text)}</span>`).join('');
    $('#modalRoot').innerHTML=`<div class="modal"><div class="window" style="width:min(1000px,98%)"><div class="titlebar">PHOTO EDITOR — PHOTO ${i+1}<button class="link" style="color:#fff;margin-left:auto" id="rippleV74Done">DONE</button></div><div class="panel-body"><div id="rippleV74Stage" class="editor-stage"><div id="rippleV74Frame"><img id="rippleV74Img" src="${esc(src)}" alt="Edit photo" draggable="false"></div>${stickerHTML}</div><div class="editor-tools"><b>FILTERS — ${Object.keys(V68_FILTERS).length}</b></div><div class="filter-grid" id="rippleV74Filters">${filters}</div><div class="editor-tools"><b>PATTERNS — 200</b></div><div class="pattern-color-row"><label>Pattern color <input id="rippleV74C1" type="color" value="${esc(e.customC1||'#ff7eb6')}"></label><label>Light / accent <input id="rippleV74C2" type="color" value="${esc(e.customC2||'#ffe5f0')}"></label><button type="button" class="retro-btn" id="rippleV74NoBorder">NO BORDER</button></div><div id="rippleV74PatternGrid" class="pattern-grid">${patterns}</div><div class="editor-sticker-palette" id="rippleV74Stickers"><b>STICKERS (${V68_STICKERS.length})</b>${stickers}</div><div class="editor-control-row"><label>Sticker size <input id="rippleV74Size" type="range" min="20" max="200" value="${e.selected!=null&&e.stickers[e.selected]?(e.stickers[e.selected].size||72):72}"></label><button type="button" class="retro-btn danger" id="rippleV74Remove">REMOVE SELECTED</button><button type="button" class="retro-btn" id="rippleV74Clear">CLEAR STICKERS</button></div><p class="meta">200 patterns in one combined library — 100 gingham checks + 100 Y2K designs.</p></div></div></div>`;
    const stage=document.getElementById('rippleV74Stage'),grid=document.getElementById('rippleV74PatternGrid');
    document.getElementById('rippleV74Done').onclick=closeModal;
    document.getElementById('rippleV74NoBorder').onclick=()=>{e.border='plain';refresh(i)};

    document.getElementById('rippleV74C2').oninput=ev=>{e.customC2=ev.target.value;refresh(i)};
    grid.addEventListener('click',ev=>{const b=ev.target.closest('.v74-pattern');if(!b)return;const n=Number(b.dataset.id);if(b.dataset.kind==='g'){const g=V69_GINGHAM[n-1]||V69_GINGHAM[0];e.border='gingham-custom';e.gingham=n;e.customC1=g.c1;e.customC2=g.c2}else{const p=v68PatternById(n)||V68_PATTERNS[0];e.border='pattern';e.pattern=n;e.patternC1=e.customC1||p.c1;e.patternC2=e.customC2||p.c2}refresh(i)});
    grid.addEventListener('pointerup',ev=>{const b=ev.target.closest('.v74-pattern');if(!b)return;ev.preventDefault();b.click()},{passive:false});
    document.getElementById('rippleV74Filters').onclick=ev=>{const b=ev.target.closest('[data-v74-filter]');if(b){e.filter=b.dataset.v74Filter;refresh(i)}};
    document.getElementById('rippleV74Stickers').onclick=ev=>{const b=ev.target.closest('[data-v74-sticker]');if(!b)return;const n=e.stickers.length;e.stickers.push({text:b.dataset.v74Sticker,x:.5,y:.5,size:72+(n%4)*8,rotate:0});e.selected=n;openPhotoEditor(i)};
    document.getElementById('rippleV74Size').oninput=ev=>{if(e.selected!=null&&e.stickers[e.selected]){e.stickers[e.selected].size=Number(ev.target.value);refresh(i)}};
    document.getElementById('rippleV74Remove').onclick=()=>{if(e.selected!=null)e.stickers.splice(e.selected,1);e.selected=e.stickers.length?Math.min(e.selected||0,e.stickers.length-1):null;openPhotoEditor(i)};
    document.getElementById('rippleV74Clear').onclick=()=>{e.stickers=[];e.selected=null;openPhotoEditor(i)};
    let drag=null;
    const down=ev=>{const el=ev.target.closest('.ripple-v74-sticker');if(!el||!stage.contains(el))return;const j=Number(el.dataset.stickerIndex),st=e.stickers[j];if(!st)return;ev.preventDefault();e.selected=j;const r=stage.getBoundingClientRect();drag={id:ev.pointerId,j,st,sx:ev.clientX,sy:ev.clientY,x:Number(st.x)||.5,y:Number(st.y)||.5,r};try{stage.setPointerCapture(ev.pointerId)}catch{}};
    const move=ev=>{if(!drag||ev.pointerId!==drag.id)return;ev.preventDefault();drag.st.x=Math.max(.02,Math.min(.98,drag.x+(ev.clientX-drag.sx)/drag.r.width));drag.st.y=Math.max(.02,Math.min(.98,drag.y+(ev.clientY-drag.sy)/drag.r.height));const el=stage.querySelector(`[data-sticker-index="${drag.j}"]`);if(el){el.style.left=drag.st.x*100+'%';el.style.top=drag.st.y*100+'%'}};
    const up=ev=>{if(!drag||ev.pointerId!==drag.id)return;drag=null};
    stage.addEventListener('pointerdown',down,{passive:false});stage.addEventListener('pointermove',move,{passive:false});stage.addEventListener('pointerup',up,{passive:false});stage.addEventListener('pointercancel',up,{passive:false});
    refresh(i);
  };
})();

<script>
/* ===== RIPPLE v76 — restore the proven canvas editor path ===== */
(function(){
  function r76HexToRgb(hex){
    const m=String(hex||'').match(/^#([0-9a-f]{6})$/i);
    if(!m)return null;
    return {r:parseInt(m[1].slice(0,2),16),g:parseInt(m[1].slice(2,4),16),b:parseInt(m[1].slice(4,6),16)};
  }
  function r76Color(hex,alpha){
    const rgb=r76HexToRgb(hex);
    return rgb?`rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`:hex||'#ff7eb6';
  }
  function r76GinghamCSS(c1,c2){
    const a=c1||'#ff7eb6',b=c2||'#ffe5f0';
    return `linear-gradient(90deg,${r76Color(a,.55)} 0 50%,transparent 50% 100%) 0 0/20px 20px,`+
           `linear-gradient(0deg,${r76Color(a,.55)} 0 50%,transparent 50% 100%) 0 0/20px 20px,${b}`;
  }
  function r76PatternCSS(p,c1,c2){
    const a=c1||p?.c1||'#ff7eb6',b=c2||p?.c2||'#ffe5f0',t=p?.type||'checker';
    if(t==='checker'||t==='pixel')return `repeating-conic-gradient(${a} 0 25%,${b} 0 50%) 50%/18px 18px`;
    if(t==='dots')return `radial-gradient(circle,${a} 0 2.5px,transparent 3px) 0 0/16px 16px,${b}`;
    if(t==='grid'||t==='cross')return `linear-gradient(${a} 2px,transparent 2px) 0 0/18px 18px,linear-gradient(90deg,${a} 2px,transparent 2px) 0 0/18px 18px,${b}`;
    if(t==='rings')return `radial-gradient(circle,transparent 0 5px,${a} 6px 8px,transparent 9px) 0 0/28px 28px,${b}`;
    if(t==='diamonds')return `linear-gradient(45deg,transparent 42%,${a} 43% 48%,transparent 49%) 0 0/24px 24px,linear-gradient(-45deg,transparent 42%,${a} 43% 48%,transparent 49%) 0 0/24px 24px,${b}`;
    if(t==='zigzag')return `linear-gradient(135deg,transparent 0 42%,${a} 43% 50%,transparent 51% 92%,${a} 93%) 0 0/24px 18px,${b}`;
    return `repeating-linear-gradient(135deg,${a} 0 7px,${b} 7px 14px)`;
  }
  function r76DrawFrame(ctx,w,h,e,pad){
    if(!e.border||e.border==='plain')return;
    const W=w,H=h;
    if(e.border==='gingham-custom'){
      const g=V69_GINGHAM[(Number(e.gingham||1)-1+100)%100]||V69_GINGHAM[0];
      const c1=e.customC1||g.c1,c2=e.customC2||g.c2;
      ctx.fillStyle=c2;ctx.fillRect(0,0,W,H);
      const size=Math.max(18,Math.min(28,Math.round(Math.min(W,H)/12)));
      const band=Math.max(7,Math.round(size*.5));
      ctx.save();
      ctx.globalAlpha=.58;
      ctx.fillStyle=c1;
      for(let y=0;y<H;y+=size)ctx.fillRect(0,y,W,band);
      for(let x=0;x<W;x+=size)ctx.fillRect(x,0,band,H);
      ctx.restore();
      return;
    }
    if(e.border==='pattern'){
      const p=v68PatternById(Number(e.pattern)||1)||V68_PATTERNS[0];
      const a=e.patternC1||e.customC1||p.c1,b=e.patternC2||e.customC2||p.c2,t=p.type||'checker';
      ctx.fillStyle=b;ctx.fillRect(0,0,W,H);ctx.fillStyle=a;ctx.strokeStyle=a;
      switch(t){
        case 'stripe': case 'diagonal':
          ctx.lineWidth=8;for(let z=-H;z<W;z+=16){ctx.beginPath();ctx.moveTo(z,0);ctx.lineTo(z+H,H);ctx.stroke()}break;
        case 'checker':
          for(let y=0;y<H;y+=18)for(let x=0;x<W;x+=18)if(((x/18+y/18)%2)===0)ctx.fillRect(x,y,18,18);break;
        case 'dots':
          for(let y=7;y<H;y+=14)for(let x=7;x<W;x+=14){ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill()}break;
        case 'grid':
          ctx.lineWidth=2;for(let x=0;x<W;x+=16){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=16){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}break;
        case 'cross':
          ctx.lineWidth=3;for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}break;
        case 'zigzag':
          ctx.lineWidth=4;for(let y=0;y<H;y+=18){ctx.beginPath();for(let x=0;x<W;x+=12){ctx.lineTo(x,y+((x/12)%2?0:9))}ctx.stroke()}break;
        case 'diamonds':
          ctx.lineWidth=3;for(let x=-H;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+H/2,H/2);ctx.lineTo(x,H);ctx.stroke()}break;
        case 'rings':
          ctx.lineWidth=4;for(let y=10;y<H;y+=28)for(let x=10;x<W;x+=28){ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.stroke()}break;
        case 'pixel':
          for(let y=0;y<H;y+=12)for(let x=0;x<W;x+=12)if(((x/12+y/12)%2)===0)ctx.fillRect(x,y,12,12);break;
      }
      return;
    }
    ctx.fillStyle=e.border==='black'?'#111':'#fff';ctx.fillRect(0,0,W,H);
  }

  function r76RenderCanvas(src,e,canvas,renderStickers=true){
    return new Promise(resolve=>{
      const im=new Image();
      im.onload=()=>{
        const w=im.naturalWidth||800,h=im.naturalHeight||600;
        const active=e.border&&e.border!=='plain';
        const pad=active?Math.max(24,Math.round(Math.min(w,h)*.045)):0;
        canvas.width=w+pad*2;canvas.height=h+pad*2;
        const ctx=canvas.getContext('2d');
        ctx.clearRect(0,0,canvas.width,canvas.height);
        r76DrawFrame(ctx,canvas.width,canvas.height,e,pad);
        ctx.save();ctx.filter=V68_FILTERS[e.filter]||'none';ctx.drawImage(im,pad,pad,w,h);ctx.restore();
        if(renderStickers){
          (e.stickers||[]).forEach(st=>{
            ctx.save();
            ctx.translate(pad+(Number(st.x)||.5)*w,pad+(Number(st.y)||.5)*h);
            ctx.rotate((Number(st.rotate)||0)*Math.PI/180);
            ctx.font=`${Number(st.size)||72}px sans-serif`;
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=5;
            ctx.fillText(st.text||'',0,0);ctx.restore();
          });
        }
        resolve(canvas.toDataURL('image/jpeg',.92));
      };
      im.onerror=()=>resolve(src);
      im.src=src;
    });
  }

  window.applyPhotoEditCanvas=function(src,e){
    const c=document.createElement('canvas');
    return r76RenderCanvas(src,e,c);
  };

  function r76FrameCSS(e){
    if(e.border==='gingham-custom'){
      const g=V69_GINGHAM[(Number(e.gingham||1)-1+100)%100]||V69_GINGHAM[0],c1=e.customC1||g.c1,c2=e.customC2||g.c2;
      const a=`color-mix(in srgb, ${c1} 72%, transparent)`;
      return `linear-gradient(90deg,${a} 0 50%,transparent 50% 100%) 0 0/18px 18px,linear-gradient(0deg,${a} 0 50%,transparent 50% 100%) 0 0/18px 18px,${c2}`;
    }
    if(e.border==='pattern'){
      const p=v68PatternById(Number(e.pattern)||1)||V68_PATTERNS[0],c1=e.patternC1||p.c1,c2=e.patternC2||p.c2;
      if(p.type==='checker'||p.type==='pixel')return `repeating-conic-gradient(${c1} 0 25%,${c2} 0 50%) 50%/18px 18px`;
      if(p.type==='dots')return `radial-gradient(${c1} 2px,transparent 2.5px) 0 0/18px 18px,${c2}`;
      if(p.type==='grid')return `linear-gradient(${c1} 2px,transparent 2px) 0 0/18px 18px,linear-gradient(90deg,${c1} 2px,transparent 2px) 0 0/18px 18px,${c2}`;
      return `repeating-linear-gradient(45deg,${c1} 0 8px,${c2} 8px 16px)`;
    }
    return e.border==='black'?'#111':'#fff';
  }

  function r76Apply(i){
    const e=photoEditState(i),stage=document.getElementById('r76Stage'),canvas=document.getElementById('r76Canvas');
    if(!stage||!canvas)return;
    const src=(window._drafts||[])[i];
    if(!src)return;
    r76RenderCanvas(src,e,canvas,false);
    document.querySelectorAll('#r76Stage .r76-sticker').forEach((el,j)=>{
      const st=e.stickers?.[j];if(!st)return;
      el.style.left=(Math.max(.02,Math.min(.98,Number(st.x)||.5))*100)+'%';
      el.style.top=(Math.max(.02,Math.min(.98,Number(st.y)||.5))*100)+'%';
      el.style.fontSize=(Number(st.size)||72)+'px';
      el.style.transform=`translate(-50%,-50%) rotate(${Number(st.rotate)||0}deg)`;
      el.classList.toggle('selected',j===e.selected);
    });
  }

  openPhotoEditor=function(i){
    const src=(window._drafts||[])[i];if(!src)return;
    const e=photoEditState(i);
    e.stickers=Array.isArray(e.stickers)?e.stickers:[];
    const filters=Object.keys(V68_FILTERS).map(x=>`<button type="button" class="retro-btn" data-r76-filter="${esc(x)}">${x.toUpperCase()}</button>`).join('');
    let patterns='';
    V69_GINGHAM.forEach(g=>patterns+=`<button type="button" data-kind="g" data-id="${g.id}" style="background:${r76GinghamCSS(g.c1,g.c2)}" title="Gingham ${g.id}"><span>G${String(g.id).padStart(3,'0')}</span></button>`);
    V68_PATTERNS.forEach(p=>patterns+=`<button type="button" data-kind="y" data-id="${p.id}" style="background:${r76PatternCSS(p,p.c1,p.c2)}" title="Y2K ${p.id}"><span>Y${String(p.id).padStart(3,'0')}</span></button>`);
    const stickers=V68_STICKERS.map(x=>`<button type="button" class="retro-btn" data-r76-sticker="${esc(x)}">${x}</button>`).join('');
    const stickerHTML=e.stickers.map((st,j)=>`<span class="r76-sticker ${j===e.selected?'selected':''}" data-r76-index="${j}" style="left:${(Number(st.x)||.5)*100}%;top:${(Number(st.y)||.5)*100}%;font-size:${Number(st.size)||72}px;transform:translate(-50%,-50%) rotate(${Number(st.rotate)||0}deg)">${esc(st.text)}</span>`).join('');
    $('#modalRoot').innerHTML=`<div class="modal"><div class="window" style="width:min(1000px,98%)"><div class="titlebar">PHOTO EDITOR — PHOTO ${i+1}<button class="link" style="color:#fff;margin-left:auto" id="r76Done">DONE</button></div><div class="panel-body">
      <div id="r76Stage"><canvas id="r76Canvas" aria-label="Edited photo preview"></canvas>${stickerHTML}</div>
      <div class="editor-tools"><b>FILTERS — ${Object.keys(V68_FILTERS).length}</b></div>
      <div class="filter-grid" id="r76Filters">${filters}</div>
      <div class="editor-tools"><b>PATTERNS — 200</b></div>
      <div class="pattern-color-row">
        <label>Pattern color <input id="r76C1" type="color" value="${esc(e.customC1||'#ff7eb6')}"></label>
        <label>Light / accent <input id="r76C2" type="color" value="${esc(e.customC2||'#ffe5f0')}"></label>
        <button type="button" class="retro-btn" id="r76NoBorder">NO BORDER</button>
      </div>
      <div id="r76PatternGrid">${patterns}</div>
      <div class="editor-sticker-palette" id="r76Stickers"><b>STICKERS (${V68_STICKERS.length})</b>${stickers}</div>
      <div class="editor-control-row"><label>Sticker size <input id="r76Size" type="range" min="20" max="200" value="${e.selected!=null&&e.stickers[e.selected]?(e.stickers[e.selected].size||72):72}"></label>
      <button type="button" class="retro-btn danger" id="r76Remove">REMOVE SELECTED</button><button type="button" class="retro-btn" id="r76Clear">CLEAR STICKERS</button></div>
      <p class="meta">200 patterns in one combined library — 100 gingham checks + 100 Y2K designs.</p>
    </div></div></div>`;

    document.getElementById('r76Done').onclick=closeModal;
    document.getElementById('r76NoBorder').onclick=()=>{e.border='plain';r76Apply(i)};
    document.getElementById('r76C1').oninput=ev=>{e.customC1=ev.target.value;(window._drafts||[]).forEach((_,j)=>photoEditState(j).customC1=ev.target.value);r76Apply(i)};
    document.getElementById('r76C2').oninput=ev=>{e.customC2=ev.target.value;(window._drafts||[]).forEach((_,j)=>photoEditState(j).customC2=ev.target.value);r76Apply(i)};
    document.getElementById('r76Filters').onclick=ev=>{const b=ev.target.closest('[data-r76-filter]');if(b){e.filter=b.dataset.r76Filter;r76Apply(i)}};
    document.getElementById('r76PatternGrid').addEventListener('click',ev=>{
      const b=ev.target.closest('button[data-kind][data-id]');if(!b)return;
      ev.preventDefault();
      const n=Number(b.dataset.id);
      if(b.dataset.kind==='g'){
        const g=V69_GINGHAM[Math.max(0,Math.min(99,n-1))]||V69_GINGHAM[0];
        e.border='gingham-custom';e.gingham=n;e.customC1=g.c1;e.customC2=g.c2;
        (window._drafts||[]).forEach((_,j)=>{const x=photoEditState(j);x.border='gingham-custom';x.gingham=n;x.customC1=g.c1;x.customC2=g.c2;});
      }else{
        const p=v68PatternById(n)||V68_PATTERNS[0];
        e.border='pattern';e.pattern=n;e.patternC1=p.c1;e.patternC2=p.c2;
        (window._drafts||[]).forEach((_,j)=>{const x=photoEditState(j);x.border='pattern';x.pattern=n;x.patternC1=p.c1;x.patternC2=p.c2;});
      }
      r76Apply(i);
    });
    document.getElementById('r76PatternGrid').addEventListener('pointerup',ev=>{
      const b=ev.target.closest('button[data-kind][data-id]');if(b){ev.preventDefault();b.click()}
    },{passive:false});
    const stickerPalette=document.getElementById('r76Stickers');
    stickerPalette.addEventListener('click',ev=>{
      const b=ev.target.closest('button[data-r76-sticker]');if(!b||!stickerPalette.contains(b))return;
      ev.preventDefault();ev.stopPropagation();
      // Mobile browsers can synthesize more than one activation for a single
      // touch. Use a GLOBAL activation token, not a per-render state object,
      // because openPhotoEditor() immediately replaces the DOM.
      const now=Date.now(),key=String(i)+'|'+String(b.dataset.r76Sticker);
      const last=window.__rippleStickerTapGuard||{};
      if(last.key===key && now-last.time<500)return;
      window.__rippleStickerTapGuard={key,time:now};
      const n=e.stickers.length;
      e.stickers.push({text:b.dataset.r76Sticker,x:.5+((n%5)-2)*.06,y:.5+((n%4)-1.5)*.08,size:64+(n%4)*10,rotate:0});
      e.selected=n;
      openPhotoEditor(i);
    },{passive:false});
    document.getElementById('r76Size').oninput=ev=>{
      if(e.selected!=null&&e.stickers[e.selected]){e.stickers[e.selected].size=Number(ev.target.value)||72;r76Apply(i)}
    };
    document.getElementById('r76Remove').onclick=()=>{if(e.selected!=null)e.stickers.splice(e.selected,1);e.selected=e.stickers.length?Math.min(e.selected||0,e.stickers.length-1):null;openPhotoEditor(i)};
    document.getElementById('r76Clear').onclick=()=>{e.stickers=[];e.selected=null;openPhotoEditor(i)};

    const stage=document.getElementById('r76Stage');
    let drag=null;
    const down=ev=>{
      const el=ev.target.closest('.r76-sticker');if(!el||!stage.contains(el))return;
      const j=Number(el.dataset.r76Index),st=e.stickers?.[j];if(!st)return;
      ev.preventDefault();ev.stopPropagation();e.selected=j;
      const rect=stage.getBoundingClientRect();
      drag={pid:ev.pointerId,j,st,startX:ev.clientX,startY:ev.clientY,startPX:Number(st.x)||.5,startPY:Number(st.y)||.5,rect};
      try{stage.setPointerCapture(ev.pointerId)}catch{}
    };
    const move=ev=>{
      if(!drag||ev.pointerId!==drag.pid)return;
      ev.preventDefault();
      const r=drag.rect,st=drag.st;
      st.x=Math.max(.02,Math.min(.98,drag.startPX+(ev.clientX-drag.startX)/Math.max(1,r.width)));
      st.y=Math.max(.02,Math.min(.98,drag.startPY+(ev.clientY-drag.startY)/Math.max(1,r.height)));
      const el=stage.querySelector(`.r76-sticker[data-r76-index="${drag.j}"]`);
      if(el){el.style.left=st.x*100+'%';el.style.top=st.y*100+'%';el.classList.add('selected')}
    };
    const up=ev=>{
      if(!drag||ev.pointerId!==drag.pid)return;
      try{if(stage.hasPointerCapture(ev.pointerId))stage.releasePointerCapture(ev.pointerId)}catch{}
      drag=null;
    };
    stage.addEventListener('pointerdown',down,{passive:false});
    stage.addEventListener('pointermove',move,{passive:false});
    stage.addEventListener('pointerup',up,{passive:false});
    stage.addEventListener('pointercancel',up,{passive:false});
    r76Apply(i);
  };
  window.__rippleProvenEditor=openPhotoEditor;
})();
</script>

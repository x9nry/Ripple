    const stickerButtons=V68_STICKERS.map(x=>`<button type="button" class="retro-btn" data-sticker="${esc(x)}">${x}</button>`).join('');
    const stickerHtml=e.stickers.map((st,j)=>`<span class="ripple-v73-sticker ${j===e.selected?'selected':''}" data-sticker-index="${j}" style="left:${(Number(st.x)||.5)*100}%;top:${(Number(st.y)||.5)*100}%;font-size:${Number(st.size)||72}px;transform:translate(-50%,-50%) rotate(${Number(st.rotate)||0}deg)">${esc(st.text)}</span>`).join('');
    $('#modalRoot').innerHTML=`<div class="modal"><div class="window" style="width:min(1000px,98%)"><div class="titlebar">PHOTO EDITOR — PHOTO ${i+1}<button class="link" style="color:#fff;margin-left:auto" id="rippleV73Done">DONE</button></div><div class="panel-body"><div id="rippleV73Stage" class="editor-stage"><img id="rippleV73Img" src="${esc(src)}" alt="Edit photo" draggable="false">${stickerHtml}</div><div class="editor-tools"><b>FILTERS — ${Object.keys(V68_FILTERS).length}</b></div><div class="filter-grid" id="rippleV73Filters">${filters}</div><div class="editor-tools"><b>PATTERNS — 200</b></div><div class="pattern-color-row"><label>Pattern color <input id="rippleV73C1" type="color" value="${esc(e.customC1||'#ff7eb6')}"></label><label>Light / accent <input id="rippleV73C2" type="color" value="${esc(e.customC2||'#ffe5f0')}"></label><button type="button" class="retro-btn" id="rippleV73NoBorder">NO BORDER</button></div><div id="rippleV73PatternGrid">${patterns}</div><div class="editor-sticker-palette" id="rippleV73Stickers"><b>STICKERS (${V68_STICKERS.length})</b>${stickerButtons}</div><div class="editor-control-row"><label>Sticker size <input id="rippleV73Size" type="range" min="20" max="200" value="${e.selected!=null&&e.stickers[e.selected]?(e.stickers[e.selected].size||72):72}"></label><button type="button" class="retro-btn danger" id="rippleV73Remove">REMOVE SELECTED</button><button type="button" class="retro-btn" id="rippleV73Clear">CLEAR STICKERS</button></div><p class="meta">200 patterns in one combined library. Drag stickers directly on the photo.</p></div></div></div>`;
    document.getElementById('rippleV73Done').onclick=()=>closeModal();
    document.getElementById('rippleV73NoBorder').onclick=()=>{e.border='plain';v73Apply(i)};
    document.getElementById('rippleV73C1').oninput=ev=>{e.customC1=ev.target.value;e.border=e.border==='pattern'?'pattern':'gingham-custom';v73Apply(i)};
    document.getElementById('rippleV73C2').oninput=ev=>{e.customC2=ev.target.value;e.border=e.border==='pattern'?'pattern':'gingham-custom';v73Apply(i)};
    document.getElementById('rippleV73Size').oninput=ev=>{if(e.selected!=null&&e.stickers[e.selected]){e.stickers[e.selected].size=Number(ev.target.value);v73Apply(i)}};
    document.getElementById('rippleV73Remove').onclick=()=>{if(e.selected!=null)e.stickers.splice(e.selected,1);e.selected=e.stickers.length?Math.min(e.selected||0,e.stickers.length-1):null;openPhotoEditor(i)};
    document.getElementById('rippleV73Clear').onclick=()=>{e.stickers=[];e.selected=null;openPhotoEditor(i)};
    document.getElementById('rippleV73Filters').addEventListener('click',ev=>{const b=ev.target.closest('[data-filter]');if(b){e.filter=b.dataset.filter;v73Apply(i)}});
    document.getElementById('rippleV73Stickers').addEventListener('click',ev=>{const b=ev.target.closest('[data-sticker]');if(!b)return;const n=e.stickers.length;e.stickers.push({text:b.dataset.sticker,x:.5+((n%5)-2)*.06,y:.5+((n%4)-1.5)*.08,size:64+(n%4)*10,rotate:0});e.selected=e.stickers.length-1;openPhotoEditor(i)});
    v73WirePatternGrid(i);v73WireStickerDrag(i);v73Apply(i);
  };
})();

<script>
/* ===== RIPPLE v78 FINAL AUTHORITATIVE FIXES ===== */
(function(){
  function tombstones(){
    const out=new Set();
    try{JSON.parse(localStorage.getItem('ripple_deleted_profiles_v1')||'[]').map(String).forEach(x=>out.add(x))}catch{}
    (window._rippleDeletedProfileTombstones||new Set()).forEach(x=>out.add(String(x)));
    return out;
  }
  function deleted(x){return x!=null&&tombstones().has(String(x))}
  function postVisible(p){
    if(!p||p.deleted_profile===true)return false;
    const u=db.users?.[p.user];
    const ids=[p.user,p.username,p.remote_author_id,p.author_id,u?.id,u?.username,u?.profile_id,u?.auth_id].filter(x=>x!=null&&String(x));
    return !ids.some(deleted);
  }
  function purgeDeleted(){
    const beforePosts=(db.posts||[]).length;
    const beforeUsers=Object.keys(db.users||{}).length;
    // Old builds created synthetic users such as @online_profile_<uuid> when
    // a post arrived before its profile. Those synthetic users must NEVER be
    // allowed to survive in Explore, especially after the real profile was
    // deleted.
    const orphanIds=new Set();
    Object.keys(db.users||{}).forEach(k=>{
      const u=db.users[k];
      const synthetic=String(k).startsWith('online_profile_') || String(u?.username||'').startsWith('online_profile_');
      if(synthetic){
        orphanIds.add(String(k));
        orphanIds.add(String(u?.id||''));
        orphanIds.add(String(u?.username||''));
        orphanIds.add(String(u?.profile_id||''));
        delete db.users[k];
      }
    });
    db.posts=(db.posts||[]).filter(p=>{
      if(!postVisible(p))return false;
      const pu=db.users?.[p.user];
      const ids=[p.user,p.username,p.remote_author_id,p.author_id,pu?.id,pu?.username,pu?.profile_id,pu?.auth_id].filter(x=>x!=null&&String(x)).map(String);
      if(ids.some(x=>orphanIds.has(x)))return false;
      if(ids.some(x=>x.startsWith('online_profile_')))return false;
      return true;
    });
    if(beforePosts!==db.posts.length || beforeUsers!==Object.keys(db.users||{}).length){try{save()}catch{}}
  }
  window.ripplePurgeDeleted=purgeDeleted;

  const oldProfiles=pullOnlineProfiles;
  pullOnlineProfiles=async function(){await oldProfiles();purgeDeleted()};
  const oldPosts=pullOnlinePosts;
  pullOnlinePosts=async function(){
    // Profiles first: a post is only accepted when its real author profile is
    // known. This removes the race that created @online_profile_<uuid>.
    try{await pullOnlineProfiles()}catch{}
    await oldPosts();
    purgeDeleted();
  };

  // Final Explore guard: never render a profile or post whose id, username,
  // profile id, auth id, or author id is tombstoned. This runs after every
  // online refresh, so stale local rows cannot reappear in the directory/feed.
  const oldExplore=explore;
  explore=function(){
    purgeDeleted();
    return oldExplore();
  };

  const oldProfile=profile;
  profile=function(id){
    const u=db.users?.[id] || (typeof userBy==='function'?userBy(id):null);
    if(deleted(id)||deleted(u?.id)||deleted(u?.username)||deleted(u?.profile_id)||deleted(u?.auth_id)){toast('This Ripple profile has been deleted.');return}
    return oldProfile(id);
  };

  deleteAccount=async function(){
    const u=user();if(!u)return;
    if(!confirm('Delete this account and its local data? This cannot be undone.'))return;
    const ids=[u.id,u.username,u.profile_id,u.auth_id].filter(x=>x!=null&&String(x)).map(String),idSet=new Set(ids);
    const doomed=(db.posts||[]).filter(p=>{
      const pu=db.users?.[p.user];
      return [p.user,p.username,p.remote_author_id,p.author_id,pu?.id,pu?.username,pu?.profile_id,pu?.auth_id].filter(x=>x!=null&&String(x)).map(String).some(x=>idSet.has(x));
    });
    window._rippleDeletedProfileTombstones=window._rippleDeletedProfileTombstones||new Set();
    ids.forEach(x=>window._rippleDeletedProfileTombstones.add(x));
    try{
      const old=JSON.parse(localStorage.getItem('ripple_deleted_profiles_v1')||'[]').map(String);
      localStorage.setItem('ripple_deleted_profiles_v1',JSON.stringify([...new Set([...old,...ids])].slice(-500)));
    }catch{}
    if(onlineUser){
      // Remove the user's public content BEFORE deleting the Auth user.
      // This matters when the existing RPC only removes auth.users but leaves
      // profiles/posts behind; those rows would otherwise come back into
      // Explore on every other device. RLS may reject either direct delete,
      // so the account-delete RPC remains the authoritative fallback.
      const remoteProfileId=String(u.profile_id||onlineUser.id||'');
      try{
        if(remoteProfileId){
          const postDel=await supabaseClient.from('posts').delete().eq('author_id',remoteProfileId);
          if(postDel.error)console.warn('Ripple pre-delete posts cleanup:',postDel.error);
          const profileDel=await supabaseClient.from('profiles').delete().eq('id',remoteProfileId);
          if(profileDel.error)console.warn('Ripple pre-delete profile cleanup:',profileDel.error);
        }
      }catch(e){console.warn('Ripple pre-delete cleanup failed:',e)}
      try{
        const {error}=await supabaseClient.rpc('delete_my_account');
        if(error)throw error;
      }catch(e){toast('Account deletion failed: '+String(e?.message||'Please try again.'));return}
    }
    doomed.forEach(p=>{p.deleted_profile=true;try{rememberDeletedPost(p)}catch{}});
    db.posts=(db.posts||[]).filter(p=>!doomed.includes(p));
    Object.values(db.users||{}).forEach(x=>x.posts=(x.posts||[]).filter(pid=>!doomed.some(p=>String(p.id)===String(pid))));
    Object.keys(db.users||{}).forEach(k=>{const x=db.users[k];if(idSet.has(String(k))||idSet.has(String(x?.id))||idSet.has(String(x?.username))||idSet.has(String(x?.profile_id))||idSet.has(String(x?.auth_id)))delete db.users[k]});
    try{save()}catch{}
    current=null;onlineUser=null;clearRippleSessionPersistence();
    try{localStorage.setItem('ripple_device_accounts',JSON.stringify(deviceAccountIds().filter(x=>!idSet.has(String(x)))))}catch{}
    try{await supabaseClient.auth.signOut()}catch{}
    toast('Account deleted.');setTimeout(()=>location.reload(),150);
  };

  // Restore the proven v76 editor LAST so v69-v73 legacy overrides cannot replace it.
  if(window.__rippleProvenEditor)openPhotoEditor=window.__rippleProvenEditor;
  try{purgeDeleted()}catch{}
})();
</script>
<style id="ripple-v13-final-targeted-lines">

      <div class="profile-edit-grid"><div class="field"><label>Pronouns</label><input id="epPronouns" value="${esc(u.pronouns||'')}" placeholder="she/her, he/him, they/them…"></div><div class="field"><label>Location</label><input id="epLocation" value="${esc(u.location||'')}" placeholder="City, country"></div></div>

<script id="ripple-v146-final-online-profile-media-fix-js">
(function(){
  'use strict';

  function currentUser(){
    try{
      return (typeof db!=='undefined' && typeof current!=='undefined' && db.users)
        ? db.users[current] : null;
    }catch(e){ return null; }
  }

  function validColor(v,fallback){
    return /^#[0-9a-fA-F]{6}$/.test(String(v||'')) ? String(v) : fallback;
  }

  /* ---------- PROFILE BANNER -> POSTS/REPOSTS ---------- */
  function applyProfileBannerLink(){
    var view=document.getElementById('view');
    if(!view)return;
    var p=view.querySelector('.profile-window');
    var u=currentUser();

    view.classList.toggle('ripple-profile-active',!!p);

    if(!p || !u)return;

    var colors=(u.profile_colors && typeof u.profile_colors==='object') ? u.profile_colors : {};
    var banner=validColor(u.profile_info_banner_color || colors.infoBanner,'#063c8c');

    var rgb=hexToRgb(banner);
    var start=rgbToHex(rgb.map(function(v){return Math.round(v*.72)}));
    var end=rgbToHex(rgb.map(function(v){return Math.round(v+(255-v)*.22)}));

    view.style.setProperty('--ripple-profile-banner',banner);
    view.style.setProperty('--ripple-profile-banner-start',start);
    view.style.setProperty('--ripple-profile-banner-end',end);

    p.style.setProperty('--profile-info-banner',banner,'important');
    p.querySelectorAll('.profile-info-banner').forEach(function(el){
      el.style.setProperty('--profile-info-banner',banner,'important');
      el.style.setProperty('background-color',banner,'important');
    });
  }

  function hexToRgb(hex){
    var m=String(hex||'').match(/^#([0-9a-fA-F]{6})$/);
    return m ? [
      parseInt(m[1].slice(0,2),16),
      parseInt(m[1].slice(2,4),16),
      parseInt(m[1].slice(4,6),16)
    ] : [6,60,140];
  }

  function rgbToHex(rgb){
    return '#'+rgb.map(function(v){
      return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
    }).join('');
  }

  /* ---------- RETRO BANNER PERSISTENCE ---------- */
  function restoreBannerPreference(){
    try{
      var stored=localStorage.getItem('ripple_banner_color_v146');
      if(/^#[0-9a-fA-F]{6}$/.test(stored)){
        db.settings=db.settings||{};
        if(!/^#[0-9a-fA-F]{6}$/.test(db.settings.bannerColor||'')){
          db.settings.bannerColor=stored;
        }
      }
    }catch(e){}
    try{
      if(typeof applyRippleBannerColor==='function')applyRippleBannerColor();
    }catch(e){}
  }

  function persistBannerPreference(){
    try{
      var c=validColor(db.settings&&db.settings.bannerColor,'#063c8c');
      localStorage.setItem('ripple_banner_color_v146',c);
    }catch(e){}
  }

  /* ---------- ONLINE PROFILE SYNC QUEUE ----------
     If a profile is edited before the Supabase session has finished restoring,
     keep the edit dirty and push it as soon as the online session exists.
  */
  var syncTimer=null;
  var syncAttempts=0;

  async function flushProfileSync(){
    var u=currentUser();
    if(!u || typeof onlineUser==='undefined' || !onlineUser ||
       typeof supabaseClient==='undefined' || !supabaseClient){
      return false;
    }

    try{
      if(typeof ripplePersistProfileSurgical==='function'){
        var ok=await ripplePersistProfileSurgical(u);
        if(ok){
          window.__rippleProfileDirty=false;
          window.__rippleProfileSavePending=false;
          applyProfileBannerLink();
          return true;
        }
      }else if(typeof syncMyProfile==='function'){
        var ok2=await syncMyProfile();
        if(ok2){
          window.__rippleProfileDirty=false;
          window.__rippleProfileSavePending=false;
          applyProfileBannerLink();
          return true;
        }
      }
    }catch(e){
      console.warn('Ripple v146 queued profile sync:',e);
    }
    return false;
  }

  function queueProfileSync(){
    window.__rippleProfileDirty=true;
    clearTimeout(syncTimer);
    syncAttempts=0;

    async function attempt(){
      syncAttempts++;
      if(await flushProfileSync())return;
      if(syncAttempts<12){
        syncTimer=setTimeout(attempt,1500);
      }
    }
    syncTimer=setTimeout(attempt,350);
  }

  /* ---------- WRAP THE FINAL PROFILE SAVE PATH ---------- */
  if(typeof window.ripplePersistProfileSurgical==='function' &&
     !window.ripplePersistProfileSurgical.__rippleV146){

      window.__rippleProfileDirty=true;
      var ok=await oldPersist(u);
      if(ok)window.__rippleProfileDirty=false;
      applyProfileBannerLink();

    window.ripplePersistProfileSurgical=wrappedPersist;

    if(id==='bannerColorSet'){
      try{persistBannerPreference()}catch(e){}
    }
  },true);

  document.addEventListener('change',function(ev){
    var id=ev.target && ev.target.id;

    if(id==='rippleV116Banner'){
      queueProfileSync();
    }

    if(id==='bannerColorSet'){
      try{persistBannerPreference()}catch(e){}
      try{applyRippleBannerColor()}catch(e){}
    }
  },true);

  /* ---------- CAMERA: ATTACH/REMOVE/RETAKE ----------
     getUserMedia is preferred. On browsers where camera permission is
     unavailable (including some local-file/mobile contexts), fall back to
     the device's image picker/camera capture input.
  */
  var cameraStream=null;
  var cameraKind='post';
  var cameraImage=null;

  function stopCameraStream(){
    try{
      if(cameraStream){
        cameraStream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});
      }
    }catch(e){}
    cameraStream=null;
  }

  window.rippleV146OpenCamera=function(kind){
    cameraKind=kind||'post';
    cameraImage=null;
    stopCameraStream();

    var root=document.getElementById('modalRoot');
    if(!root)return;

    root.innerHTML=
      '<div class="modal" id="rippleV146CameraModal">'+
        '<div class="window" style="max-width:700px;width:96%">'+
          '<div class="titlebar">CAMERA <button class="link" style="color:#fff" id="rippleV146CameraClose">CLOSE</button></div>'+
          '<div class="panel-body">'+
            '<video id="rippleV146Cam" autoplay playsinline style="width:100%;background:#111;display:block"></video>'+
            '<canvas id="rippleV146Canvas" class="hidden"></canvas>'+
            '<img id="rippleV146Captured" class="ripple-v146-camera-preview hidden" alt="Captured photo">'+
            '<input id="rippleV146Fallback" type="file" accept="image/*" capture="environment" class="hidden">'+
            '<div class="ripple-v146-camera-actions">'+
              '<button type="button" class="retro-btn" id="rippleV146Take">TAKE PICTURE</button>'+
              '<button type="button" class="retro-btn hidden" id="rippleV146Attach">ATTACH PHOTO</button>'+
              '<button type="button" class="retro-btn hidden" id="rippleV146Retake">RETAKE</button>'+
              '<button type="button" class="retro-btn danger hidden" id="rippleV146Remove">REMOVE PHOTO</button>'+
            '</div>'+
            '<div class="meta" id="rippleV146CameraStatus" style="margin-top:8px"></div>'+
          '</div>'+
        '</div>'+
      '</div>';

    var close=document.getElementById('rippleV146CameraClose');
    var take=document.getElementById('rippleV146Take');
    var attach=document.getElementById('rippleV146Attach');
    var retake=document.getElementById('rippleV146Retake');
    var remove=document.getElementById('rippleV146Remove');
    var fallback=document.getElementById('rippleV146Fallback');
    var video=document.getElementById('rippleV146Cam');
    var captured=document.getElementById('rippleV146Captured');
    var status=document.getElementById('rippleV146CameraStatus');

    function close(){
      stopCameraStream();
      root.innerHTML='';
      cameraImage=null;
    }

    function showCaptured(src){
      cameraImage=src;
      stopCameraStream();
      video.classList.add('hidden');
      take.classList.add('hidden');
      captured.src=src;
      captured.classList.remove('hidden');
      attach.classList.remove('hidden');
      retake.classList.remove('hidden');
      remove.classList.remove('hidden');
      status.textContent='Photo ready. Attach it to Ripple or remove it and retake.';
    }

    close.onclick=close;

    remove.onclick=function(){
      cameraImage=null;
      captured.removeAttribute('src');
      captured.classList.add('hidden');
      attach.classList.add('hidden');
      retake.classList.add('hidden');
      remove.classList.add('hidden');
      take.classList.remove('hidden');
      status.textContent='Photo removed. Take another picture when ready.';
      startStream();
    };

    retake.onclick=function(){
      cameraImage=null;
      captured.removeAttribute('src');
      captured.classList.add('hidden');
      attach.classList.add('hidden');
      retake.classList.add('hidden');
      remove.classList.add('hidden');
      take.classList.remove('hidden');

        window._drafts.push(src);
        if(typeof create==='function')create();
        if(typeof toast==='function')toast('Photo attached to your post.');
      }else if(cameraKind==='profile'){
        var u=currentUser();
        if(u){
          u.avatar=src;
          try{save()}catch(e){}
          window.__rippleProfileDirty=true;
          flushProfileSync().catch(function(){});
          if(typeof render==='function')render();
          if(typeof toast==='function')toast('Profile photo updated.');
        }
      }else{
        if(typeof composeMessage==='function')composeMessage(src);

    fallback.onchange=function(){
      var f=fallback.files && fallback.files[0];
      if(!f || !f.type || f.type.indexOf('image/')!==0)return;
      var reader=new FileReader();
      reader.onload=function(){showCaptured(reader.result)};
      reader.readAsDataURL(f);

      if(video.videoWidth && video.videoHeight){
        var canvas=document.getElementById('rippleV146Canvas');

        showCaptured(canvas.toDataURL('image/jpeg',0.88));
      }else{
        fallback.click();
      }
    };

      status.textContent='Starting camera…';
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        status.textContent='Live camera is unavailable here. Use the device camera picker.';
        fallback.click();
        return;
      }
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})
        .then(function(stream){
          cameraStream=stream;
          video.srcObject=stream;
          status.textContent='Camera ready.';
        })
        .catch(function(){
          status.textContent='Live camera permission is unavailable. Opening the device camera/photo picker…';
          fallback.click();
        });

  window.cameraCapture=function(kind){

  };

  if(typeof window.editPhoto==='function' && !window.editPhoto.__rippleV146){

          window.__rippleProfileDirty=true;
          try{await flushProfileSync()}catch(e){}
          root.innerHTML='';
          if(typeof render==='function')render();
          if(typeof toast==='function')toast('Profile photo updated.');
        };
        reader.readAsDataURL(input.files[0]);
      };

      document.getElementById('rippleV146PhotoRemove').onclick=async function(){
        if(!confirm('Remove your profile photo?'))return;
        u.avatar=null;
        try{save()}catch(e){}
        window.__rippleProfileDirty=true;
        try{await flushProfileSync()}catch(e){}
        root.innerHTML='';
        if(typeof render==='function')render();
        if(typeof toast==='function')toast('Profile photo removed.');
      };
    };
    wrappedEditPhoto.__rippleV146=true;
    window.editPhoto=wrappedEditPhoto;
    try{editPhoto=wrappedEditPhoto}catch(e){}
  }

  /* ---------- STARTUP / RELOAD AUTH GUARD ----------
     A locally remembered account is enough to keep the UI open while the
     Supabase session is restoring. Explicit LOG OUT still clears it.
  */
  function keepRememberedAccountOpen(){
    try{
      if(typeof recoveryMode!=='undefined' && recoveryMode)return;
      var hasCurrent=typeof current!=='undefined' && current &&
        typeof db!=='undefined' && db.users && db.users[current];
      if(hasCurrent){
        var auth=document.getElementById('auth');
        var app=document.getElementById('app');
        if(auth)auth.style.display='none';
        if(app)app.style.display='block';
      }
    }catch(e){}
  }

  document.addEventListener('DOMContentLoaded',function(){
    restoreBannerPreference();
    keepRememberedAccountOpen();
    applyProfileBannerLink();
  });

  window.addEventListener('pageshow',function(){
    restoreBannerPreference();
    keepRememberedAccountOpen();
    applyProfileBannerLink();
    if(window.__rippleProfileDirty)queueProfileSync();
  });

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;

    applyProfileBannerLink();
    if(window.__rippleProfileDirty)queueProfileSync();
  });

  /* Re-apply after any render, without changing navigation behavior. */
  var oldRender=window.render;
  if(typeof oldRender==='function' && !oldRender.__rippleV146){
    var wrappedRender=function(){
      var result=oldRender.apply(this,arguments);
      try{
        applyProfileBannerLink();
        restoreBannerPreference();
      }catch(e){}
      return result;
    };
    wrappedRender.__rippleV146=true;
    window.render=wrappedRender;
    try{render=wrappedRender}catch(e){}
  }

     It is stored separately as a small preference so large media cannot
     crowd it out of localStorage. */
  try{
    var bannerInput=document.getElementById('bannerColorSet');
    if(bannerInput)bannerInput.addEventListener('change',persistBannerPreference);
  }catch(e){}

  /* Initial application. */
  restoreBannerPreference();
  applyProfileBannerLink();

})();

<script id="ripple-v147-final-fixes-js">
(function(){

  function me(){

    };r.readAsDataURL(inp.files[0]);

    u.avatar=null;try{save()}catch(e){}
    if(typeof ripplePersistProfileSurgical==='function'&&onlineUser){try{await ripplePersistProfileSurgical(u)}catch(e){}}
    closeModal();if(typeof render==='function')render();if(typeof toast==='function')toast('Profile photo removed.');
  };

  /* Re-apply after rendering/navigation and after editor changes. */
  var oldRender=window.render;
  if(typeof oldRender==='function'&&!oldRender.__rippleV147){
    var wrappedRender=function(){
      if(typeof state!=='undefined'&&state&&state.view!=='profile'){
        document.body.classList.remove('ripple-profile-body');
        document.body.style.removeProperty('--ripple-profile-background');
        var app=document.getElementById('app');
        var layout=app&&app.querySelector('.layout');
        var center=app&&app.querySelector('.center');
        if(layout)layout.style.removeProperty('--ripple-profile-background');
        if(center)center.style.removeProperty('--ripple-profile-background');
      }
      var r=oldRender.apply(this,arguments);
      setTimeout(applyWholeProfileBackground,0);
      setTimeout(applyWholeProfileBackground,80);
      return r;
    };
    wrappedRender.__rippleV147=true;
    window.render=wrappedRender;
    try{render=wrappedRender}catch(e){}
  }
  document.addEventListener('DOMContentLoaded',function(){applyWholeProfileBackground();enhanceProfileEditor()});
  window.addEventListener('pageshow',function(){applyWholeProfileBackground();enhanceProfileEditor()});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){applyWholeProfileBackground();enhanceProfileEditor()}
  });

  /* If the background color input is changed before save, show it immediately
     in the editor without touching any other profile color. */

        syncBackgroundIntoColors(u);
        var p=document.querySelector('#view .profile-window');
        if(p)p.style.setProperty('--ripple-profile-background',u.profile_background_color,'important');
      }
    }
  },true);

  applyWholeProfileBackground();
})();

<!-- RIPPLE RELEASE FIX — ONLINE PROFILE/FOLLOW/DELETE -->
<script id="ripple-release-online-fix">
(function(){
  'use strict';

  function me(){
    try { return (typeof db!=="undefined" && typeof current!=="undefined" && db.users) ? db.users[current] : null; }
    catch(e){ return null; }
  }
  function byId(id){
    try { return typeof userBy==="function" ? userBy(id) : null; } catch(e){ return null; }
  }
  function saveLocal(){ try{ if(typeof save==="function") save(); }catch(e){} }
  function msg(s){ try{ if(typeof toast==="function") toast(s); }catch(e){ console.warn(s); } }
  function cleanColor(v,f){ return /^#[0-9a-fA-F]{6}$/.test(String(v||"")) ? String(v) : f; }

  async function clientReady(){
    if(typeof ensureSupabase==="function"){
      try { return await ensureSupabase(); } catch(e){}
    }
    return (typeof supabaseClient!=="undefined") ? supabaseClient : null;
  }

  async function freshUser(){
    const c=await clientReady();
    if(!c) return null;
    try{
      const r=await c.auth.getUser();
      if(!r.error && r.data && r.data.user){
        onlineUser=r.data.user;
        return r.data.user;
      }
    }catch(e){}
    return (typeof onlineUser!=="undefined") ? onlineUser : null;
  }

  async function findMyProfile(c,u){
    let r;
    try{
      r=await c.from("profiles").select("*").eq("auth_id",u.id).maybeSingle();
      if(!r.error && r.data) return r.data;
    }catch(e){}
    try{
      r=await c.from("profiles").select("*").eq("id",u.id).maybeSingle();
      if(!r.error && r.data) return r.data;
    }catch(e){}
    try{
      r=await c.from("profiles").select("*").eq("username",String(me()?.username||"").toLowerCase()).maybeSingle();
      if(!r.error && r.data) return r.data;
    }catch(e){}
    return null;
  }

  function customization(u){
    const pc=(u.profile_colors && typeof u.profile_colors==="object") ? u.profile_colors : {};
    return {
      profile_font:u.profile_font||"Arial",
      profile_info_box_color:cleanColor(u.profile_info_box_color||pc.infoBox,"#ffffff"),
      profile_info_banner_color:cleanColor(u.profile_info_banner_color||pc.infoBanner,"#063c8c"),
      profile_display_font:u.profile_display_font||u.profile_font||"Arial",
      profile_username_font:u.profile_username_font||u.profile_font||"Arial",
      profile_info_font:u.profile_info_font||u.profile_font||"Arial",
      profile_display_name_color:cleanColor(u.profile_display_name_color||u.profile_text_color,"#ffffff"),
      profile_colors:pc,
      profile_info_symbols:(u.profile_info_symbols && typeof u.profile_info_symbols==="object") ? u.profile_info_symbols : {},
      profile_widgets:Array.isArray(u.profile_widgets) ? u.profile_widgets : []
    };
  }

  /* Authoritative profile write. The SQL companion file adds the columns
     below, so profile customization is no longer local-only. */
  window.rippleReleaseSyncProfile = async function(u){
    if(!u) return false;
    const c=await clientReady();
    const ou=await freshUser();
    if(!c || !ou) return false;

    const existing=await findMyProfile(c,ou);
    const base={
      username:String(u.username||"").toLowerCase(),
      display_name:u.display||u.username||"",
      email:u.email||ou.email||null,
      auth_id:ou.id,
      avatar_url:u.avatar||null,
      text_color:u.profile_text_color||"#ffffff",
      cover_url:u.cover||null,
      theme:u.theme||"sky",
      bio:u.bio||"",
      status:u.status||"",
      interests:u.interests||"",
      pronouns:u.pronouns||"",
      location:u.location||"",
      website:u.website||"",
      quote:u.quote||"",
      is_private:!!u.is_private,
      customization:customization(u)
    };

    let row=existing;
    try{
      if(!row){
        const ins=await c.from("profiles").insert({...base,id:ou.id}).select("*").single();
        if(ins.error) throw ins.error;
        row=ins.data;
      }else{
        const upd=await c.from("profiles").update({...base}).eq("id",String(row.id));
        if(upd.error) throw upd.error;
      }
    }catch(e){
      console.error("Ripple profile online save failed",e);
      return false;
    }

    u.profile_id=String(row.id);
    u.auth_id=ou.id;
    u.online=true;

    /* Keep Auth metadata as a second recovery copy. This is useful if a
       profile row is temporarily unavailable during a session restore. */
    try{
      const md={
        username:base.username, display_name:base.display_name,
        bio:base.bio, status:base.status, interests:base.interests,
        pronouns:base.pronouns, location:base.location, website:base.website,
        quote:base.quote, ripple_profile_customization:base.customization
      };
      const ar=await c.auth.updateUser({data:md});
      if(!ar.error && ar.data && ar.data.user) onlineUser=ar.data.user;
    }catch(e){ console.warn("Ripple Auth metadata backup failed",e); }

    saveLocal();
    return true;
  };

  window.syncMyProfile = window.rippleReleaseSyncProfile;
  try { syncMyProfile=window.rippleReleaseSyncProfile; } catch(e){}

  /* Pull every public profile, including the JSON customization object. */
  window.rippleReleasePullProfiles = async function(){
    const c=await clientReady();
    const ou=await freshUser();
    if(!c || !ou) return false;
    try{
      const q=await c.from("profiles").select("*");
      if(q.error) throw q.error;
      if(!Array.isArray(q.data)) return false;

      db.users=db.users||{};
      q.data.forEach(row=>{
        const un=String(row.username||"").trim().toLowerCase();
        if(!un) return;
        const old=db.users[un]||{};
        const x=Object.assign({},old);
        x.id=old.id||un;
        x.username=un;
        x.profile_id=row.id!=null?String(row.id):(old.profile_id||null);
        x.auth_id=row.auth_id||old.auth_id||null;
        if(row.display_name!=null) x.display=row.display_name;
        if(row.avatar_url!=null) x.avatar=row.avatar_url;
        if(row.cover_url!=null) x.cover=row.cover_url;
        if(row.text_color!=null) x.profile_text_color=row.text_color;
        if(row.theme!=null) x.theme=row.theme;
        ["bio","status","interests","pronouns","location","website","quote","is_private","deactivated_until"].forEach(k=>{
          if(row[k]!==undefined && row[k]!==null) x[k]=row[k];
        });

        const cst=row.customization;
        if(cst && typeof cst==="object"){
          ["profile_font","profile_info_box_color","profile_info_banner_color",
           "profile_display_font","profile_username_font","profile_info_font",
           "profile_display_name_color"].forEach(k=>{ if(cst[k]!=null) x[k]=cst[k]; });
          if(cst.profile_colors) x.profile_colors=cst.profile_colors;
          if(cst.profile_info_symbols) x.profile_info_symbols=cst.profile_info_symbols;
          if(Array.isArray(cst.profile_widgets)) x.profile_widgets=cst.profile_widgets;
        }
        ["profile_font","profile_info_box_color","profile_info_banner_color",
         "profile_display_font","profile_username_font","profile_info_font",
         "profile_display_name_color","profile_colors","profile_info_symbols","profile_widgets"].forEach(k=>{
          if(row[k]!==undefined && row[k]!==null) x[k]=row[k];
        });

        x.followers=old.followers||[];
        x.following=old.following||[];
        x.posts=old.posts||[];
        db.users[un]=x;
      });

      /* Never delete local users just because an RLS-filtered directory
         response is incomplete. */
      const currentUser=me();
      if(currentUser){
        const mine=db.users[String(currentUser.username||"").toLowerCase()]||currentUser;
        Object.assign(currentUser,mine);
      }
      saveLocal();
      return true;
    }catch(e){
      console.error("Ripple online profile pull failed",e);
      return false;
    }
  };
  try { pullOnlineProfiles=window.rippleReleasePullProfiles; } catch(e){}

  /* Server-authoritative follow graph. */
  window.rippleReleasePullFollows = async function(){
    const c=await clientReady();
    if(!c || !(await freshUser())) return false;
    try{
      const q=await c.from("follows").select("follower_id,following_id");
      if(q.error) throw q.error;
      const map=new Map(Object.values(db.users||{}).filter(x=>x.profile_id!=null).map(x=>[String(x.profile_id),x.id]));
      Object.values(db.users||{}).forEach(x=>{x.followers=[];x.following=[];});
      (q.data||[]).forEach(r=>{
        const a=map.get(String(r.follower_id)), b=map.get(String(r.following_id));
        if(!a||!b||a===b) return;
        const fu=db.users[a], tu=db.users[b];
        if(!fu||!tu) return;
        fu.following=fu.following||[];
        tu.followers=tu.followers||[];
        if(!fu.following.map(String).includes(String(b))) fu.following.push(b);
        if(!tu.followers.map(String).includes(String(a))) tu.followers.push(a);
      });
      saveLocal();
      return true;
    }catch(e){
      console.error("Ripple follow graph pull failed",e);
      return false;
    }
  };
  try { pullOnlineFollows=window.rippleReleasePullFollows; } catch(e){}

  window.followLabel=function(id){
    const m=me(),o=byId(id);
    if(!m||!o||String(id)===String(current)) return "";
    if((m.following||[]).map(String).includes(String(id))) return "UNFOLLOW";
    if((m.pending_following||[]).map(String).includes(String(id))) return "REQUESTED";
    if((o.following||[]).map(String).includes(String(current))) return "FOLLOW BACK";
    return o.is_private ? "REQUEST" : "FOLLOW";
  };

  window.toggleFollow = async function(id){
    const m=me(), o=byId(id);
    if(!m||!o||String(id)===String(current)) return;
    const c=await clientReady();
    const ou=await freshUser();
    if(!c||!ou){
      msg("You are offline. Please reconnect and try again.");
      return;
    }
    try{
      if(!m.profile_id) await window.rippleReleasePullProfiles();
      if(!o.profile_id) await window.rippleReleasePullProfiles();
      const a=String(m.profile_id||"");
      const b=String(o.profile_id||"");
      if(!a||!b) throw new Error("Could not resolve the two online profiles.");

      const already=(m.following||[]).map(String).includes(String(id));
      if(already){
        const q=await c.from("follows").delete().eq("follower_id",a).eq("following_id",b);
        if(q.error) throw q.error;
        m.following=(m.following||[]).filter(x=>String(x)!==String(id));
        o.followers=(o.followers||[]).filter(x=>String(x)!==String(current));
        saveLocal();
        try{ await window.rippleReleasePullFollows(); }catch(e){}
        render();
        msg("Unfollowed @"+o.username+".");
        return;
      }

      if(o.is_private){
        if(typeof requestFollow==="function"){
          await requestFollow(id,m,o);
          return;
        }
        const rq=await c.from("follow_requests").upsert(
          {requester_id:a,recipient_id:b},
          {onConflict:"requester_id,recipient_id"}
        );
        if(rq.error) throw rq.error;
        m.pending_following=m.pending_following||[];
        if(!m.pending_following.map(String).includes(String(id))) m.pending_following.push(id);
        saveLocal(); render(); msg("Follow request sent to @"+o.username+".");
        return;
      }

      const q=await c.from("follows").upsert(
        {follower_id:a,following_id:b},
        {onConflict:"follower_id,following_id"}
      );
      if(q.error) throw q.error;

      m.following=m.following||[];
      o.followers=o.followers||[];
      if(!m.following.map(String).includes(String(id))) m.following.push(id);
      if(!o.followers.map(String).includes(String(current))) o.followers.push(current);
      saveLocal();

      try{
        if(typeof notify==="function") await notify(id,"follow",m.display+" followed you.","profile:"+current);
      }catch(e){}
      render();
      msg("You followed @"+o.username+".");
    }catch(e){
      console.error("Ripple follow action failed",e);
      msg("Follow failed: "+String(e?.message||"Check your Supabase policies."));
    }
  };

  /* Permanent delete must be server-side. The companion SQL creates the
     SECURITY DEFINER RPC and deletes the Auth account as the final step. */
  window.deleteAccount = async function(){
    const u=me();
    if(!u) return;
    if(!confirm("Delete @"+u.username+" permanently?\n\nThis removes the account, profile, posts, follows and related data. This cannot be undone.")) return;

    try{
      const c=await clientReady();
      if(!c){
        msg("Ripple's online service is unavailable. Check your connection and try again.");
        return;
      }

      /*
       * Local login and Supabase Auth are separate. A user can be inside
       * Ripple from the local session while the Supabase session has expired
       * or was never established. In that case, re-authenticate here instead
       * of incorrectly reporting that Ripple is offline.
       */
      let ou=null;
      try{
        const s=await c.auth.getSession();
        ou=s?.data?.session?.user||null;
      }catch(e){}

      if(!ou){
        try{
          const r=await c.auth.getUser();
          if(!r.error) ou=r.data?.user||null;
        }catch(e){}
      }

      if(!ou){
        const email=String(u.email||"").trim();
        if(!email){
          msg("This account has no online email. Log out and log in online before deleting it.");
          return;
        }

        const pw=prompt("For security, enter your Ripple password to permanently delete @"+u.username+".");
        if(pw===null) return;
        if(!pw){
          msg("Password is required to permanently delete the account.");
          return;
        }

        const login=await c.auth.signInWithPassword({
          email:email,
          password:pw
        });

        if(login.error || !login.data?.user){
          throw login.error || new Error("Online sign-in failed. Check your password and try again.");
        }

        ou=login.data.user;
        onlineUser=ou;
      }

      const r=await c.rpc("delete_my_account");
      if(r.error) throw r.error;

      try{
        Object.keys(db.users||{}).forEach(k=>{
          const x=db.users[k];
          const ids=[k,x?.id,x?.username,x?.profile_id,x?.auth_id]
            .map(v=>String(v||""));
          if(ids.includes(String(current))) delete db.users[k];
        });
        db.posts=(db.posts||[]).filter(p=>String(p.user)!==String(current));
        db.chats=(db.chats||[]).filter(ch=>!(ch.members||[]).map(String).includes(String(current)));
        saveLocal();
      }catch(e){
        console.warn("Ripple local cleanup after delete:",e);
      }

      const deletedId=current;
      current=null;
      onlineUser=null;

      try{ localStorage.removeItem("ripple_current"); }catch(e){}
      try{
        localStorage.setItem(
          "ripple_device_accounts",
          JSON.stringify(
            typeof deviceAccountIds==="function"
              ? deviceAccountIds().filter(id=>String(id)!==String(deletedId))
              : []
          )
        );
      }catch(e){}

      try{ await c.auth.signOut(); }catch(e){}
      msg("Account permanently deleted.");
      setTimeout(()=>location.reload(),250);

    }catch(e){
      console.error("Ripple account deletion failed",e);
      const detail=String(e?.message||e?.error_description||"");

      if(/invalid login credentials|invalid_credentials/i.test(detail)){
        msg("Delete failed: incorrect password. No account data was deleted.");
      }else if(/delete_my_account|function .* does not exist|42883/i.test(detail)){
        msg("Delete failed: the Supabase account-delete function is not installed correctly.");
      }else{
        msg("Delete failed: "+(detail||"Please try again while connected."));
      }
    }
  };

  /* Sync edits made while Auth is still restoring. */
  let timer=null;
  window.rippleReleaseQueueProfileSync=function(){
    clearTimeout(timer);
    timer=setTimeout(async()=>{
      const u=me();
      if(u) await window.rippleReleaseSyncProfile(u);
    },250);
  };

  /* Run a sync after login/session restoration and after returning to the app. */
  async function bootReleaseSync(){
    try{
      await window.rippleReleasePullProfiles();
      await window.rippleReleasePullFollows();
      const u=me();
      if(u) await window.rippleReleaseSyncProfile(u);
      if(typeof render==="function") render();
    }catch(e){ console.warn("Ripple release sync:",e); }
  }

  if(typeof window.addEventListener==="function"){
    window.addEventListener("online",bootReleaseSync);
    window.addEventListener("focus",function(){ setTimeout(bootReleaseSync,150); });
  }
  setTimeout(bootReleaseSync,900);
})();
</script>

<!-- RIPPLE PROFILE NAVIGATION FIX V3 -->
<script id="ripple-profile-nav-fix-v3">
(function(){
  'use strict';

  /*
   * Final navigation fix:
   * A profile opened from a post/search/people list may leave
   * state.profile pointing at that other person. The Profile nav
   * must always explicitly target the signed-in account.
   *
   * Use a document-level CAPTURE listener so older inline handlers
   * and renderNav's dynamically assigned onclick cannot override it.
   */
  function openOwnProfileFromNav(ev){
    try{
      var b = ev.target && ev.target.closest
        ? ev.target.closest('#mobileNav [data-mnav="profile"], #nav [data-nav="profile"]')
        : null;
      if(!b) return;

      ev.preventDefault();
      ev.stopImmediatePropagation();

      if(typeof current === 'undefined' || !current) return;

      state.profile = current;
      state.view = 'profile';

      if(typeof render === 'function'){
        render();
      }else if(typeof profile === 'function'){
        profile(current);
      }

      requestAnimationFrame(function(){
        try{ window.scrollTo(0,0); }catch(e){}
      });
    }catch(e){
      console.warn('Ripple profile navigation fix:', e);
    }
  }

  document.addEventListener('click', openOwnProfileFromNav, true);
})();
</script>

<!-- RIPPLE DELETE OVERRIDE V5 -->
<script id="ripple-delete-override-v5">
(function(){
  'use strict';

  /*
   * IMPORTANT: Ripple contains several historical deleteAccount wrappers.
   * The settings button uses an inline onclick="deleteAccount()", which can
   * resolve the global lexical function rather than only window.deleteAccount.
   * Replace BOTH references so the same final handler is guaranteed.
   */
  function install(){
    try{
      if(typeof window.deleteAccount === 'function'){
        try{ deleteAccount = window.deleteAccount; }catch(e){}
        window.deleteAccount = window.deleteAccount;
      }
    }catch(e){
      console.error('Ripple V5 delete handler install failed:',e);
    }
  }

  install();
  window.addEventListener('load', install);
  document.addEventListener('DOMContentLoaded', install);

  // Also repair any Settings button that was already rendered.
  document.addEventListener('click', function(ev){
    try{
      var b=ev.target && ev.target.closest
        ? ev.target.closest('button')
        : null;
      if(!b) return;
      if(String(b.textContent||'').trim().toUpperCase()!=='DELETE ACCOUNT') return;

      ev.preventDefault();
      ev.stopImmediatePropagation();

      if(typeof window.deleteAccount==='function'){
        window.deleteAccount();
      }
    }catch(e){
      console.error('Ripple V5 delete click failed:',e);
    }
  }, true);
})();
</script>
